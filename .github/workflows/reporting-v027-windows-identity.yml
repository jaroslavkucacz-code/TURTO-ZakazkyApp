name: Publish reporting 0.2.7 Windows identity fix
on:
  push:
    branches: [mesicni-prehledy-stable]
    paths: ['release_sources/0.2.7/ready.json']
permissions:
  contents: write
concurrency:
  group: reporting-release
  cancel-in-progress: false

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build candidate and validate Windows identity
        shell: pwsh
        run: |
          @'
          import ctypes, hashlib, io, json, pathlib, re, shutil, sys, tempfile, urllib.request, zipfile
          sys.dont_write_bytecode=True
          root=pathlib.Path('release_sources/0.2.7')
          ready=json.loads((root/'ready.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen(ready['previous_url'],timeout=30) as r: previous=r.read()
          assert hashlib.sha256(previous).hexdigest()==ready['previous_sha256']
          stage=pathlib.Path('_candidate_027')
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir()
          with zipfile.ZipFile(io.BytesIO(previous)) as z:
              assert z.testzip() is None
              z.extractall(stage)
          p=stage/'src/constants.py';s=p.read_text(encoding='utf-8');s,n=re.subn(r"APP_VERSION = '[^']+'","APP_VERSION = '0.2.7'",s,count=1);assert n==1;p.write_text(s,encoding='utf-8')
          p=stage/'app.pyw';s=p.read_text(encoding='utf-8')
          old="    from src.ui import App\n    app = App()\n    app.mainloop()\n"
          new="    from src.ui import App\n    app = App()\n    try:\n        from src.windows_identity_fix import install_windows_identity\n        install_windows_identity(app, ROOT)\n    except Exception:\n        pass\n    app.mainloop()\n"
          assert old in s;s=s.replace(old,new);p.write_text(s,encoding='utf-8')
          (stage/'src/windows_identity_fix.py').write_text((root/'windows_identity_fix.py.txt').read_text(encoding='utf-8'),encoding='utf-8')
          (stage/'update_installer.py').write_text((root/'update_installer.py.txt').read_text(encoding='utf-8'),encoding='utf-8')
          note=(root/'ZMENY_0.2.7.txt').read_text(encoding='utf-8')
          for f in stage.glob('ZMENY_*.txt'): f.unlink()
          (stage/'ZMENY_0.2.7.txt').write_text(note,encoding='utf-8')
          ch=stage/'CHANGELOG.txt';ch.write_text(note+'\n'+ch.read_text(encoding='utf-8'),encoding='utf-8')
          files={q.relative_to(stage).as_posix():hashlib.sha256(q.read_bytes()).hexdigest() for q in sorted(stage.rglob('*')) if q.is_file() and q.name!='package_files.json'}
          (stage/'package_files.json').write_text(json.dumps({'app_id':ready['app_id'],'version':'0.2.7','files':files},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sys.path.insert(0,str(stage.resolve()))
          from src.release_safety import validate_folder
          validate_folder(stage)
          import tkinter as tk
          from src.windows_identity_fix import APP_ID,create_shortcut,shortcut_app_id,set_window_identity,window_app_id,_icon_handles
          ctypes.windll.shell32.SetCurrentProcessExplicitAppUserModelID(APP_ID)
          test_link=stage/'identity-test.lnk'
          assert create_shortcut(test_link,stage), 'shortcut creation failed'
          assert shortcut_app_id(test_link)==APP_ID, (shortcut_app_id(test_link),APP_ID)
          win=tk.Tk();win.title('TURTO identity test');win.geometry('320x180+30+30');win.update()
          from src.windows_integration import apply_native_window_icon
          apply_native_window_icon(win,stage);assert set_window_identity(win,stage);win.update()
          assert window_app_id(win)==APP_ID, (window_app_id(win),APP_ID)
          small,big=_icon_handles(win);assert small and big,(small,big)
          win.destroy();test_link.unlink(missing_ok=True)
          print('WINDOWS_IDENTITY_OK',APP_ID,small,big)
          '@ | python -

  publish:
    needs: validate-windows
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build verified 0.2.7 package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,pathlib,re,shutil,urllib.request,zipfile
          root=pathlib.Path('release_sources/0.2.7')
          ready=json.loads((root/'ready.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen(ready['previous_url'],timeout=30) as r: previous=r.read()
          assert hashlib.sha256(previous).hexdigest()==ready['previous_sha256']
          stage=pathlib.Path('_release_027');shutil.rmtree(stage,ignore_errors=True);stage.mkdir()
          with zipfile.ZipFile(io.BytesIO(previous)) as z:
              assert z.testzip() is None;z.extractall(stage)
          p=stage/'src/constants.py';s=p.read_text(encoding='utf-8');s,n=re.subn(r"APP_VERSION = '[^']+'","APP_VERSION = '0.2.7'",s,count=1);assert n==1;p.write_text(s,encoding='utf-8')
          p=stage/'app.pyw';s=p.read_text(encoding='utf-8')
          old="    from src.ui import App\n    app = App()\n    app.mainloop()\n"
          new="    from src.ui import App\n    app = App()\n    try:\n        from src.windows_identity_fix import install_windows_identity\n        install_windows_identity(app, ROOT)\n    except Exception:\n        pass\n    app.mainloop()\n"
          assert old in s;s=s.replace(old,new);p.write_text(s,encoding='utf-8')
          (stage/'src/windows_identity_fix.py').write_text((root/'windows_identity_fix.py.txt').read_text(encoding='utf-8'),encoding='utf-8')
          (stage/'update_installer.py').write_text((root/'update_installer.py.txt').read_text(encoding='utf-8'),encoding='utf-8')
          note=(root/'ZMENY_0.2.7.txt').read_text(encoding='utf-8')
          for f in stage.glob('ZMENY_*.txt'): f.unlink()
          (stage/'ZMENY_0.2.7.txt').write_text(note,encoding='utf-8')
          ch=stage/'CHANGELOG.txt';ch.write_text(note+'\n'+ch.read_text(encoding='utf-8'),encoding='utf-8')
          files={q.relative_to(stage).as_posix():hashlib.sha256(q.read_bytes()).hexdigest() for q in sorted(stage.rglob('*')) if q.is_file() and q.name!='package_files.json'}
          (stage/'package_files.json').write_text(json.dumps({'app_id':ready['app_id'],'version':'0.2.7','files':files},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for rel in files:
              data=(stage/rel).read_bytes()
              if pathlib.PurePosixPath(rel).suffix in ('.py','.pyw'): compile(data,rel,'exec')
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for q in sorted(stage.rglob('*')):
                  if not q.is_file(): continue
                  rel=q.relative_to(stage).as_posix();info=zipfile.ZipInfo(rel,date_time=(2026,9,12,22,55,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,q.read_bytes())
              assert z.testzip() is None
          data=buf.getvalue();target=pathlib.Path('releases/0.2.7/TURTO_update_0.2.7.zip');target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          pathlib.Path('_release_027_sha.txt').write_text(hashlib.sha256(data).hexdigest(),encoding='ascii')
          print('PACKAGE',len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Publish immutable package and stable manifest
        shell: bash
        run: |
          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/0.2.7/TURTO_update_0.2.7.zip
          git diff --cached --quiet || git commit -m 'Build verified TURTO reporting 0.2.7 package'
          export PACKAGE_COMMIT=$(git rev-parse HEAD)
          export PACKAGE_SHA=$(cat _release_027_sha.txt)
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('release_sources/0.2.7/ready.json').read_text(encoding='utf-8'))
          m={'app_id':r['app_id'],'version':r['version'],'minimum_version':r['minimum_version'],'sha256':os.environ['PACKAGE_SHA'],'notes':r['notes'],'channel':'stable','url':'https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['PACKAGE_COMMIT']+'/releases/0.2.7/TURTO_update_0.2.7.zip'}
          pathlib.Path('update_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add update_manifest.json
          git diff --cached --quiet || git commit -m 'Publish TURTO reporting 0.2.7 stable manifest'
          git push origin HEAD:mesicni-prehledy-stable

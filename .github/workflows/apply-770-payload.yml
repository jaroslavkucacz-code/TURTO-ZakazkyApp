name: Apply generated TURTO CRM 7.7 patch

on:
  push:
    branches: ['refactor/7.7.0-runtime-simplification']
    paths:
      - 'scripts/_770_payload/READY'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand reviewed payload
        run: python scripts/_apply_770_chunks.py
      - name: Remove one-shot transport files
        run: |
          rm -rf scripts/_770_payload
          rm -f scripts/_apply_770_chunks.py
          rm -f .github/workflows/apply-770-payload.yml
          rm -f release_plan_7.7.tmp
          rm -f notes/README.md
          rmdir notes 2>/dev/null || true
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement TURTO CRM 7.7 consolidated runtime policy'
          git push origin HEAD:${GITHUB_REF_NAME}

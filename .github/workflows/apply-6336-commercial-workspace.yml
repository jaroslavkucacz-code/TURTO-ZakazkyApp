name: Apply TURTO CRM 6.3.36 commercial workspaces

on:
  push:
    branches:
      - feature/6.3.36-commercial-workspaces
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate canonical source changes
        run: |
          cat scripts/.tmp6336/chunk*.b64 | base64 -d > /tmp/apply-6336.py
          python /tmp/apply-6336.py
          # A workflow token may not modify workflow files. Keep them unchanged
          # in this generated commit; they are updated/removed separately.
          git checkout HEAD -- .github/workflows/validate-6330.yml
          git checkout HEAD -- .github/workflows/apply-6336-commercial-workspace.yml

      - name: Validate generated Python
        run: |
          python -m compileall -q ZakazkyApp_base_6.1
          python -m py_compile scripts/validate-6336-commercial-workspace.py
          bash -n scripts/publish-update.sh
          find ZakazkyApp_base_6.1 scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 scripts -type f -name '*.pyc' -delete

      - name: Commit generated implementation
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build TURTO CRM 6.3.36 commercial workspaces"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Build and validate TURTO reporting 1.1.2

on:
  push:
    branches: [mesicni-prehledy-stable]
    paths:
      - release_sources/1.1.2/publish.json

permissions:
  contents: write
concurrency:
  group: reporting-release
  cancel-in-progress: false
jobs:
  build-test-stage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and validation dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input pyinstaller==6.16.0 "XlsxWriter>=3.2" "Pillow>=11"
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build, repair and launch Windows shortcuts, test installer and upgrade
        shell: pwsh
        run: python release_sources/1.1.2/build_release.py
      - name: Stage verified packages for visual review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/1.1.2
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m 'Stage verified TURTO reporting 1.1.2 packages and synthetic visual checks' }
          git push origin HEAD:mesicni-prehledy-stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-112-validation
          path: releases/1.1.2/validation

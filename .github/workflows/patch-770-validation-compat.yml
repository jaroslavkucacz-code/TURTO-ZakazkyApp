name: Clean TURTO CRM 7.7 validator

on:
  push:
    branches:
      - refactor/7.7.0-runtime-simplification
    paths:
      - scripts/fix-770-validator.py
      - .github/workflows/patch-770-validation-compat.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/7.7.0-runtime-simplification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary assertion
        run: python scripts/fix-770-validator.py
      - name: Validate edited file
        run: python -m compileall -q scripts/validate-7616-requests-plexus-assets.py
      - name: Commit cleanup
        run: |
          rm scripts/fix-770-validator.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-7616-requests-plexus-assets.py scripts/fix-770-validator.py
          git commit -m 'Remove temporary 7.7 validator assertion'
          git push origin HEAD:refactor/7.7.0-runtime-simplification

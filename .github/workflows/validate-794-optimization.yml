name: Validate TURTO CRM 7.9.4 optimization

on:
  pull_request:
    paths:
      - post_baseline.py
      - ZakazkyApp_base_6.1/post_baseline.py
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py
      - scripts/validate-793-ui-cleanup.py
      - scripts/validate-794-ui-optimization.py
      - scripts/validate-794-startup-optimization.py
      - scripts/validate-794-release-pipeline.py
      - scripts/validate-release-version.py
      - .github/workflows/publish-update.yml
      - .github/workflows/validate-794-optimization.yml
  push:
    branches: [main]
    paths:
      - post_baseline.py
      - ZakazkyApp_base_6.1/post_baseline.py
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py
      - scripts/validate-793-ui-cleanup.py
      - scripts/validate-794-ui-optimization.py
      - scripts/validate-794-startup-optimization.py
      - scripts/validate-794-release-pipeline.py
      - scripts/validate-release-version.py
      - .github/workflows/publish-update.yml
      - .github/workflows/validate-794-optimization.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile runtime
        run: python -m compileall -q ZakazkyApp_base_6.1
      - name: Validate 7.9.3 compatibility
        run: python scripts/validate-793-ui-cleanup.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 UI optimization
        run: python scripts/validate-794-ui-optimization.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 startup optimization
        run: python scripts/validate-794-startup-optimization.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 release pipeline
        run: python scripts/validate-794-release-pipeline.py

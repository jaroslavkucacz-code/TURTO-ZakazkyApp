name: Validate TURTO CRM 7.9.4 optimization

on:
  pull_request:
    paths:
      - post_baseline.py
      - ZakazkyApp_base_6.1/post_baseline.py
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/crm_runtime.py
      - ZakazkyApp_base_6.1/crm_v605.py
      - ZakazkyApp_base_6.1/v608_stability.py
      - ZakazkyApp_base_6.1/v611_audit.py
      - ZakazkyApp_base_6.1/v623_exports.py
      - ZakazkyApp_base_6.1/v632_offerlinks.py
      - ZakazkyApp_base_6.1/v637_project_offer_model.py
      - ZakazkyApp_base_6.1/v638_table_updatefix.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/idle_cleanup_804.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/operational_refresh_804.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/deferred_commercial_pages_804.py
      - scripts/validate-793-ui-cleanup.py
      - scripts/validate-794-ui-optimization.py
      - scripts/validate-794-startup-optimization.py
      - scripts/validate-794-release-pipeline.py
      - scripts/validate-804-v638-coalescing.py
      - scripts/validate-804-idle-cleanup.py
      - scripts/validate-804-operational-refresh.py
      - scripts/validate-804-request-urgency.py
      - scripts/validate-804-deferred-commercial-pages.py
      - scripts/validate-804-legacy-overlap.py
      - scripts/validate-804-audit-consolidation.py
      - scripts/validate-release-version.py
      - .github/workflows/publish-update.yml
      - .github/workflows/validate-794-optimization.yml
  push:
    branches: [main]
    paths:
      - post_baseline.py
      - ZakazkyApp_base_6.1/post_baseline.py
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/crm_runtime.py
      - ZakazkyApp_base_6.1/crm_v605.py
      - ZakazkyApp_base_6.1/v608_stability.py
      - ZakazkyApp_base_6.1/v611_audit.py
      - ZakazkyApp_base_6.1/v623_exports.py
      - ZakazkyApp_base_6.1/v632_offerlinks.py
      - ZakazkyApp_base_6.1/v637_project_offer_model.py
      - ZakazkyApp_base_6.1/v638_table_updatefix.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/idle_cleanup_804.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/operational_refresh_804.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/deferred_commercial_pages_804.py
      - scripts/validate-793-ui-cleanup.py
      - scripts/validate-794-ui-optimization.py
      - scripts/validate-794-startup-optimization.py
      - scripts/validate-794-release-pipeline.py
      - scripts/validate-804-v638-coalescing.py
      - scripts/validate-804-idle-cleanup.py
      - scripts/validate-804-operational-refresh.py
      - scripts/validate-804-request-urgency.py
      - scripts/validate-804-deferred-commercial-pages.py
      - scripts/validate-804-legacy-overlap.py
      - scripts/validate-804-audit-consolidation.py
      - scripts/validate-release-version.py
      - .github/workflows/publish-update.yml
      - .github/workflows/validate-794-optimization.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile runtime
        run: python -m compileall -q ZakazkyApp_base_6.1
      - name: Validate 7.9.3 compatibility
        run: python scripts/validate-793-ui-cleanup.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 UI optimization
        run: python scripts/validate-794-ui-optimization.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 startup optimization
        run: python scripts/validate-794-startup-optimization.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 v638 timer coalescing
        run: python scripts/validate-804-v638-coalescing.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 idle cleanup
        run: python scripts/validate-804-idle-cleanup.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 operational refreshes
        run: python scripts/validate-804-operational-refresh.py
      - name: Validate 8.0.4 cached request urgency
        run: python scripts/validate-804-request-urgency.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 deferred commercial pages
        run: python scripts/validate-804-deferred-commercial-pages.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 legacy overlap cleanup
        run: python scripts/validate-804-legacy-overlap.py ZakazkyApp_base_6.1
      - name: Validate 8.0.4 consolidated action audit
        run: python scripts/validate-804-audit-consolidation.py ZakazkyApp_base_6.1
      - name: Validate 7.9.4 release pipeline
        run: python scripts/validate-794-release-pipeline.py

name: Apply TURTO CRM 6.3.41 real UI validation adjustment
on:
  push:
    branches:
      - feature/6.3.41-offer-catalog-separation
    paths:
      - .github/workflows/apply-6341-real-ui-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Apply validation adjustment
        run: python scripts/patch-6341-real-ui.py
      - name: Validate real Tk application
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 75s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit clean validation adjustment
        run: |
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f scripts/patch-6341-real-ui.py
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate-real-ui.py scripts/patch-6341-real-ui.py
          git diff --cached --check
          git commit -m "Align real UI validation with separated received offers"
          git push origin HEAD:feature/6.3.41-offer-catalog-separation

name: Apply TURTO CRM 7.2 visual issued offers v2

on:
  push:
    branches:
      - feature/7.2.0-visual-issued-offers
    paths:
      - .github/workflows/apply-7200-visual-offer-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Reuse and apply the reviewed 7.2 patch
        run: |
          python - <<'PY'
          import base64, pathlib, zlib
          workflow = pathlib.Path('.github/workflows/apply-7200-visual-offer.yml').read_text(encoding='utf-8').splitlines()
          payload = []
          collecting = False
          for line in workflow:
              if 'TURTO_PATCH_B64: |-' in line:
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('            '):
                      payload.append(line.strip())
                  else:
                      break
          if not payload:
              raise SystemExit('7.2 patch payload not found')
          path = pathlib.Path('scripts/apply-7200-visual-offer.py')
          path.write_bytes(zlib.decompress(base64.b64decode(''.join(payload))))
          PY
          python scripts/apply-7200-visual-offer.py
          rm -f scripts/apply-7200-visual-offer.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-7100-commercial-cleanup.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert version == "7.1.0", version\n'
          new = '    assert tuple(int(part) for part in version.split(".")) >= (7, 1, 0), version\n'
          if text.count(old) != 1:
              raise SystemExit('7.1 version assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile canonical source
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py

      - name: Validate 7.2 and regressions
        run: |
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Validate real Tk application
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 120s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit implementation
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            ZakazkyApp_base_6.1/ZakazkyCRM.pyw \
            ZakazkyApp_base_6.1/v638_table_updatefix.py \
            ZakazkyApp_base_6.1/v710_cleanup.py \
            ZakazkyApp_base_6.1/v720_visual_offer.py \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/service.py \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/settings.py \
            post_baseline.py release_version.txt release_notes.txt \
            scripts/publish-update.sh \
            scripts/validate-6337-issued-offers.py \
            scripts/validate-7100-commercial-cleanup.py \
            scripts/validate-7200-visual-issued-offers.py \
            scripts/validate-real-ui.py
          git diff --cached --check
          git commit -m "Implement TURTO CRM 7.2 visual issued offers"
          git push origin HEAD:feature/7.2.0-visual-issued-offers

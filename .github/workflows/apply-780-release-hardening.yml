name: Apply TURTO CRM 7.8 release hardening

on:
  push:
    branches:
      - feature/7.8.0-professional-offer-release-help
    paths:
      - .github/workflows/apply-780-release-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/7.8.0-professional-offer-release-help
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Harden sent confirmation and release validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path('ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py')
          text = module_path.read_text(encoding='utf-8')
          old = '''    document, _items = service.load_document(M, int(document_id))
              if _text(document.get("status")) == "Odesláno":
                  M.messagebox.showinfo(
                      "Vydaná nabídka",
                      "Nabídka je již označená jako Odesláno.",
                      parent=parent or app,
                  )
                  return False
              if not M.messagebox.askyesno(
                  "Potvrdit skutečné odeslání",
                  f"Potvrzujete, že nabídka {document.get('document_number') or ''} "
                  "byla skutečně odeslána zákazníkovi?\\n\\n"
                  "Tuto volbu použijte až po kontrole složky Odeslaná pošta. "
                  "Dokument se označí jako Odesláno a uzamkne proti změnám.",
                  parent=parent or app,
              ):
                  return False
          '''
          new = '''    document, items = service.load_document(M, int(document_id))
              if _text(document.get("status")) == "Odesláno":
                  M.messagebox.showinfo(
                      "Vydaná nabídka",
                      "Nabídka je již označená jako Odesláno.",
                      parent=parent or app,
                  )
                  return False
              report = offer_preflight(document, items, for_email=False)
              if report.errors:
                  M.messagebox.showwarning(
                      "Potvrzení odeslání",
                      report.headline
                      + "\\n\\nPřed potvrzením odeslání opravte povinné údaje nabídky.",
                      parent=parent or app,
                  )
                  return False
              state = pdf_state(M, int(document_id))
              if state.status != "current" or state.path is None or not state.path.is_file():
                  M.messagebox.showwarning(
                      "Potvrzení odeslání",
                      "Odeslání lze potvrdit pouze k aktuální archivované PDF revizi.\\n\\n"
                      + state.label
                      + "\\n\\nNejprve použijte Zkontrolovat a vydat.",
                      parent=parent or app,
                  )
                  return False
              revision = (
                  f"R{int(state.revision_no):02d}"
                  if state.revision_no is not None
                  else "bez označení revize"
              )
              if not M.messagebox.askyesno(
                  "Potvrdit skutečné odeslání",
                  f"Potvrzujete, že nabídka {document.get('document_number') or ''} "
                  f"({revision}) byla skutečně odeslána zákazníkovi?\\n\\n"
                  "Tuto volbu použijte až po kontrole složky Odeslaná pošta. "
                  "Dokument se označí jako Odesláno a uzamkne proti změnám.",
                  parent=parent or app,
              ):
                  return False
          '''
          if old not in text:
              raise SystemExit('sent confirmation anchor not found')
          module_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          validator_path = Path('scripts/validate-770-runtime-policy.py')
          validator = validator_path.read_text(encoding='utf-8')
          version_old = '    assert version_parts[:2] == (7, 7) and version_parts >= (7, 7, 3), version\n'
          version_new = '    assert version_parts[0] == 7 and version_parts >= (7, 7, 3), version\n'
          if version_old not in validator:
              raise SystemExit('runtime version assertion anchor not found')
          validator = validator.replace(version_old, version_new, 1)
          order_anchor = '    assert bootstrap.index(\'"v7616_requests_plexus_assets"\') < bootstrap.index(\'"v770_runtime_policy"\')\n'
          order_add = order_anchor + '    assert bootstrap.index(\'"price_lists_domain.issued_offers.professional_workflow"\') < bootstrap.index(\'"v770_runtime_policy"\')\n'
          if order_anchor not in validator:
              raise SystemExit('runtime order anchor not found')
          validator_path.write_text(validator.replace(order_anchor, order_add, 1), encoding='utf-8')

          publish_path = Path('scripts/publish-update.sh')
          publish = publish_path.read_text(encoding='utf-8')
          test_anchor = 'python scripts/validate-770-runtime-policy.py "$BASE_DIR"\n'
          if 'validate-7800-professional-offer-workflow.py' not in publish:
              if test_anchor not in publish:
                  raise SystemExit('publish test anchor not found')
              publish = publish.replace(
                  test_anchor,
                  'python scripts/validate-7800-professional-offer-workflow.py "$BASE_DIR"\n' + test_anchor,
                  1,
              )
          stage_anchor = 'test -d "$RUNTIME/price_lists_domain"\n'
          stage_line = 'test -e "$RUNTIME/price_lists_domain/issued_offers/professional_workflow.py"\n'
          if stage_line not in publish:
              if stage_anchor not in publish:
                  raise SystemExit('publish stage anchor not found')
              publish = publish.replace(stage_anchor, stage_anchor + stage_line, 1)
          grep_anchor = 'grep -q "Windows.Media.Ocr" "$RUNTIME/price_lists_domain/ocr.py"\n'
          grep_line = 'grep -q "Kontrola a řízené vydání" "$RUNTIME/price_lists_domain/issued_offers/professional_workflow.py"\n'
          if grep_line not in publish:
              if grep_anchor not in publish:
                  raise SystemExit('publish grep anchor not found')
              publish = publish.replace(grep_anchor, grep_anchor + grep_line, 1)
          publish_path.write_text(publish, encoding='utf-8')
          PY

      - name: Validate hardened candidate
        shell: bash
        run: |
          python -m compileall -q \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py \
            scripts/validate-7800-professional-offer-workflow.py \
            scripts/validate-770-runtime-policy.py
          python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Commit hardened candidate
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py \
            scripts/validate-770-runtime-policy.py \
            scripts/publish-update.sh
          git commit -m "Harden controlled offer sending and 7.8 release validation"
          git push origin HEAD:feature/7.8.0-professional-offer-release-help

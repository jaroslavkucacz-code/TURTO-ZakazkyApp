name: Publish reporting 0.2.2 from reviewed source
on:
  push:
    branches: [mesicni-prehledy-stable]
    paths: ['release_sources/0.2.2/ready.json']
permissions:
  contents: write
concurrency:
  group: reporting-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source files and build deterministic ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, re, zipfile
          root = pathlib.Path('release_sources/0.2.2')
          ready = json.loads((root/'ready.json').read_text(encoding='utf-8'))
          assert ready['app_id'] == 'cz.turto.mesicni-prehledy'
          assert ready['version'] == '0.2.2'
          files = {}
          for record in ready['source_files']:
              name = record['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert ':' not in name and '\\' not in name
              assert path.parts[0] not in ('data','imports','exports','backup','assets')
              assert path.name != 'config.json'
              parts = []
              for part in record['parts']:
                  assert re.fullmatch(r'source_[0-9]{3}\.txt', part['name'])
                  raw = (root/part['name']).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == part['sha256'], part['name']
                  parts.append(raw)
              raw = b''.join(parts)
              raw.decode('utf-8')
              assert name not in files
              assert hashlib.sha256(raw).hexdigest() == record['sha256'], name
              if path.suffix in ('.py','.pyw'):
                  compile(raw, name, 'exec')
              files[name] = raw
          spec = json.loads(files['package_files.json'])
          assert spec['app_id'] == ready['app_id'] and spec['version'] == ready['version']
          assert set(files) == set(spec['files']) | {'package_files.json'}
          for name, digest in spec['files'].items():
              assert hashlib.sha256(files[name]).hexdigest() == digest, name
          assert b"APP_VERSION = '0.2.2'" in files['src/constants.py']
          assert b'patch_v020' not in files['app.pyw']
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(files):
                  info = zipfile.ZipInfo(name, date_time=(2026,9,12,9,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, files[name])
              assert z.testzip() is None
          data = buffer.getvalue()
          assert len(data) == ready['bytes']
          assert hashlib.sha256(data).hexdigest() == ready['sha256']
          target = pathlib.Path('releases/0.2.2/TURTO_update_0.2.2.zip')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print('Verified source files:', len(spec['files']), '; ZIP:', len(data), ready['sha256'])
          PY
      - name: Publish immutable package, then manifest
        shell: bash
        run: |
          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/0.2.2/TURTO_update_0.2.2.zip
          git diff --cached --quiet || git commit -m 'Build verified reporting 0.2.2 source ZIP'
          export PACKAGE_COMMIT=$(git rev-parse HEAD)
          python3 - <<'PY'
          import json, os, pathlib
          r = json.loads(pathlib.Path('release_sources/0.2.2/ready.json').read_text(encoding='utf-8'))
          manifest = {k:r[k] for k in ('app_id','version','minimum_version','sha256','notes')}
          manifest['channel'] = 'stable'
          manifest['url'] = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['PACKAGE_COMMIT'] + '/releases/0.2.2/TURTO_update_0.2.2.zip'
          pathlib.Path('update_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git add update_manifest.json
          git diff --cached --quiet || git commit -m 'Publish verified reporting 0.2.2 stable manifest'
          git push origin HEAD:mesicni-prehledy-stable

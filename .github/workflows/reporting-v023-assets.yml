name: Publish reporting 0.2.3 with bundled icon
on:
  push:
    branches: [mesicni-prehledy-stable]
    paths: ['release_sources/0.2.3/ready.json']
permissions:
  contents: write
concurrency:
  group: reporting-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and verify 0.2.3 update
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, struct, urllib.request, zipfile
          root = pathlib.Path('release_sources/0.2.3')
          ready = json.loads((root/'ready.json').read_text(encoding='utf-8'))
          assert ready['app_id'] == 'cz.turto.mesicni-prehledy'
          assert ready['version'] == '0.2.3'

          with urllib.request.urlopen(ready['previous_url'], timeout=30) as r:
              previous = r.read()
          assert hashlib.sha256(previous).hexdigest() == ready['previous_sha256']

          stage = pathlib.Path('_release_023')
          stage.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(previous)) as z:
              assert z.testzip() is None
              z.extractall(stage)

          for rel in ('ZMENY_0.2.3.txt','package_files.json','src/constants.py'):
              src = root/rel
              dst = stage/rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())

          png_assets = {
              'assets/app_icon_48.png': 'assets/app_icon_48.png.b64',
              'assets/app_icon_64.png': 'assets/app_icon_64.png.b64',
          }
          for rel, encoded in png_assets.items():
              dst = stage/rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(base64.b64decode((root/encoded).read_text(encoding='ascii'), validate=True))

          # Jednoduchý standardní ICO kontejner s vloženým 64px PNG.
          png64 = (stage/'assets/app_icon_64.png').read_bytes()
          ico = struct.pack('<HHH', 0, 1, 1) + struct.pack('<BBBBHHII', 64, 64, 0, 0, 1, 32, len(png64), 22) + png64
          (stage/'assets/app_icon.ico').write_bytes(ico)
          assets = ('assets/app_icon.ico','assets/app_icon_48.png','assets/app_icon_64.png')

          spec = json.loads((stage/'package_files.json').read_text(encoding='utf-8'))
          assert spec['app_id'] == ready['app_id']
          assert spec['version'] == ready['version']
          files = spec['files']
          actual = {p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file()}
          assert actual == set(files) | {'package_files.json'}, sorted(actual ^ (set(files)|{'package_files.json'}))
          for rel, digest in files.items():
              data = (stage/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, rel
              if pathlib.PurePosixPath(rel).suffix in ('.py','.pyw'):
                  compile(data, rel, 'exec')
          assert b"APP_VERSION = '0.2.3'" in (stage/'src/constants.py').read_bytes()
          for rel in assets:
              assert (stage/rel).exists() and (stage/rel).stat().st_size > 1000

          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in sorted(actual):
                  info = zipfile.ZipInfo(rel, date_time=(2026,9,12,20,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, (stage/rel).read_bytes())
              assert z.testzip() is None
          data = buffer.getvalue()
          target = pathlib.Path('releases/0.2.3/TURTO_update_0.2.3.zip')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          pathlib.Path('_release_023_sha.txt').write_text(hashlib.sha256(data).hexdigest(), encoding='ascii')
          print('Verified 0.2.3 ZIP:', len(data), hashlib.sha256(data).hexdigest())
          PY
      - name: Publish immutable package, then stable manifest
        shell: bash
        run: |
          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/0.2.3/TURTO_update_0.2.3.zip
          git diff --cached --quiet || git commit -m 'Build verified TURTO reporting 0.2.3 package'
          export PACKAGE_COMMIT=$(git rev-parse HEAD)
          export PACKAGE_SHA=$(cat _release_023_sha.txt)
          python3 - <<'PY'
          import json, os, pathlib
          ready = json.loads(pathlib.Path('release_sources/0.2.3/ready.json').read_text(encoding='utf-8'))
          manifest = {
              'app_id': ready['app_id'],
              'version': ready['version'],
              'minimum_version': ready['minimum_version'],
              'sha256': os.environ['PACKAGE_SHA'],
              'notes': ready['notes'],
              'channel': 'stable',
              'url': 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + os.environ['PACKAGE_COMMIT'] + '/releases/0.2.3/TURTO_update_0.2.3.zip',
          }
          pathlib.Path('update_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git add update_manifest.json
          git diff --cached --quiet || git commit -m 'Publish TURTO reporting 0.2.3 stable manifest'
          git push origin HEAD:mesicni-prehledy-stable

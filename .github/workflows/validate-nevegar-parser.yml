name: Validate Nevegar offer parser

on:
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/offers_engine/providers/nevegar.py'
      - 'ZakazkyApp_base_6.1/offers_engine/Nabidky_Router.py'
      - 'scripts/validate-nevegar-parser.py'
      - '.github/workflows/validate-nevegar-parser.yml'
  push:
    branches: [main]
    paths:
      - 'ZakazkyApp_base_6.1/offers_engine/providers/nevegar.py'
      - 'ZakazkyApp_base_6.1/offers_engine/Nabidky_Router.py'
      - 'scripts/validate-nevegar-parser.py'
      - '.github/workflows/validate-nevegar-parser.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install parser dependency
        run: python -m pip install 'PyMuPDF<2,>=1.24'
      - name: Compile provider
        run: python -m compileall -q ZakazkyApp_base_6.1/offers_engine/providers/nevegar.py scripts/validate-nevegar-parser.py
      - name: Validate Nevegar extraction contract
        run: python scripts/validate-nevegar-parser.py ZakazkyApp_base_6.1

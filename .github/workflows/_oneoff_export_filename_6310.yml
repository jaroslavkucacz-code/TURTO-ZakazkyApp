name: One-off export filename 6.3.10
on:
  push:
    branches: [feat/export-filename-6310]
    paths: [.github/workflows/_oneoff_export_filename_6310.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/export-filename-6310
          fetch-depth: 0
      - name: Patch canonical export naming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('ZakazkyApp_base_6.1/v624_legacy_exports.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import math\n', 'import math\nimport re\n', 1)
          old='''    def _safe_no(value):\n        text = str(value or 'nabidka').strip()\n        return (\n            ''.join(ch if ch.isalnum() or ch in '-_.' else '_' for ch in text)\n            .strip('._')\n            or 'nabidka'\n        )\n\n    def _save_path(parent, offer_no):\n        from tkinter import filedialog\n        return filedialog.asksaveasfilename(\n            parent=parent,\n            title='Extrakce dat nabídky',\n            defaultextension='.xlsx',\n            filetypes=[('Excel', '*.xlsx')],\n            initialfile=f'Extrakce dat CN {_safe_no(offer_no)}.xlsx',\n        ) or ''\n'''
          new='''    def _safe_filename_part(value, fallback='nabidka', maxlen=90):\n        text = re.sub(\n            r'[<>:\"/\\\\|?*\\x00-\\x1f]+',\n            '_',\n            str(value or ''),\n        )\n        text = ' '.join(text.split()).strip(' ._')\n        return (text or fallback)[:maxlen].rstrip(' .')\n\n    def _export_filename_from_offer(offer):\n        offer_no = _safe_filename_part(\n            _v(offer, 'offer_number'),\n            fallback='nabidka',\n            maxlen=55,\n        )\n        supplier_reference = _safe_filename_part(\n            _v(offer, 'reference'),\n            fallback='',\n            maxlen=95,\n        )\n        suffix = f'_{supplier_reference}' if supplier_reference else ''\n        return f'Extrakce dat CN {offer_no}{suffix}.xlsx'\n\n    def export_filename(offer_id):\n        try:\n            with M.db() as con:\n                offer = con.execute(\n                    'SELECT offer_number,reference FROM supplier_offers WHERE id=?',\n                    (offer_id,),\n                ).fetchone()\n            if offer:\n                return _export_filename_from_offer(offer)\n        except Exception:\n            pass\n        return 'Extrakce dat CN nabidka.xlsx'\n\n    M.offer_export_filename = export_filename\n\n    def _save_path(parent, offer):\n        from tkinter import filedialog\n        return filedialog.asksaveasfilename(\n            parent=parent,\n            title='Extrakce dat nabídky',\n            defaultextension='.xlsx',\n            filetypes=[('Excel', '*.xlsx')],\n            initialfile=_export_filename_from_offer(offer),\n        ) or ''\n'''
          if old not in s:
              raise SystemExit('v624 filename block not found')
          s=s.replace(old,new,1)
          s=s.replace("path = _save_path(parent or app, _v(offer, 'offer_number'))", "path = _save_path(parent or app, offer)", 1)
          p.write_text(s,encoding='utf-8')

          p=Path('post_baseline.py')
          s=p.read_text(encoding='utf-8')
          anchor='''    M.export_offer_exactly_like_manual = export_to_path\n\n    # ------------------------------------------------------------------\n    # DB-first archive pipeline.\n'''
          insert='''    M.export_offer_exactly_like_manual = export_to_path\n\n    def excel_name_for_offer(offer_id):\n        generator = getattr(M, 'offer_export_filename', None)\n        if callable(generator):\n            try:\n                name = str(generator(offer_id) or '').strip()\n                if name.lower().endswith('.xlsx'):\n                    return name\n            except Exception:\n                pass\n        return 'Extrakce dat CN nabidka.xlsx'\n\n    # ------------------------------------------------------------------\n    # DB-first archive pipeline.\n'''
          if anchor not in s:
              raise SystemExit('post_baseline export anchor not found')
          s=s.replace(anchor,insert,1)
          s=s.replace("output = folder / 'Extrakce_nabidky.xlsx'", "output = folder / excel_name_for_offer(offer_id)", 1)
          old_loop='''            for index, offer in enumerate(offers, 1):\n                output = folder / (\n                    'Extrakce_nabidky.xlsx'\n                    if len(offers) == 1\n                    else f'Extrakce_nabidky_{index}.xlsx'\n                )\n                try:\n                    export_to_path(app, offer['offer_id'], output)\n                    outputs.append(str(output))\n'''
          new_loop='''            used_output_names = set()\n            for index, offer in enumerate(offers, 1):\n                filename = excel_name_for_offer(offer['offer_id'])\n                key = filename.casefold()\n                if key in used_output_names:\n                    candidate = Path(filename)\n                    filename = f'{candidate.stem}_{index}{candidate.suffix}'\n                    key = filename.casefold()\n                used_output_names.add(key)\n                output = folder / filename\n                try:\n                    export_to_path(app, offer['offer_id'], output)\n                    outputs.append(str(output))\n'''
          if old_loop not in s:
              raise SystemExit('post_baseline MSG export loop not found')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/publish-update.yml')
          s=p.read_text(encoding='utf-8')
          marker='''          grep -q "import v624_legacy_exports" "$DIR/_runtime/post_baseline.py"\n          test "$(grep -o "v624_legacy_exports.apply" "$DIR/_runtime/post_baseline.py" | wc -l)" -eq 1\n'''
          replacement=marker+'''          grep -q "M.offer_export_filename = export_filename" "$DIR/_runtime/v624_legacy_exports.py"\n          grep -q "supplier_reference = _safe_filename_part" "$DIR/_runtime/v624_legacy_exports.py"\n          grep -q "def excel_name_for_offer" "$DIR/_runtime/post_baseline.py"\n          grep -q "output = folder / excel_name_for_offer(offer_id)" "$DIR/_runtime/post_baseline.py"\n'''
          if marker not in s:
              raise SystemExit('workflow validation marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')

          Path('release_version.txt').write_text('6.3.10\n',encoding='utf-8')
          Path('release_notes.txt').write_text('''• Název Excel extrakce nově obsahuje také dodavatelský název/reference nabídky přímo z PDF. Příklad: „Extrakce dat CN P12166-2026_TĚSNÍCÍ VLOŽKY.xlsx“.\n• U Leviatu se do názvu Excelu používá výhradně „Reference zákazníka“ z nabídky Leviatu, nikoli interní název Akce v CRM.\n• U GEROtopu se používá pracovní název akce/reference načtený z dodavatelského PDF. Interní Akce CRM zůstává oddělená.\n• Pokud dodavatelská reference v PDF chybí, název Excelu bezpečně zůstane ve formátu „Extrakce dat CN <číslo nabídky>.xlsx“.\n• Ruční export i automatická extrakce do archivní složky používají stejný kanonický generátor názvu souboru; při více nabídkách v jednom MSG se případná shoda názvů bezpečně očísluje.\n• Znaky nepovolené ve Windows názvech souborů se nahrazují podtržítkem; mezery a česká diakritika se zachovávají.\n• Databázové schéma, uživatelská data, parsery, formátování GEROtop i bezpečná MSG/PDF drag & drop cesta se touto verzí nemění.\n''',encoding='utf-8')
          PY
          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py
          grep -q "Extrakce dat CN {offer_no}{suffix}.xlsx" ZakazkyApp_base_6.1/v624_legacy_exports.py
          grep -q "M.offer_export_filename = export_filename" ZakazkyApp_base_6.1/v624_legacy_exports.py
          grep -q "excel_name_for_offer" post_baseline.py
          git rm .github/workflows/_oneoff_export_filename_6310.yml
          git config user.name "TURTO Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/v624_legacy_exports.py post_baseline.py .github/workflows/publish-update.yml release_version.txt release_notes.txt
          git commit -m "TURTO CRM 6.3.10 — descriptive Excel filenames"
          git push origin HEAD:feat/export-filename-6310

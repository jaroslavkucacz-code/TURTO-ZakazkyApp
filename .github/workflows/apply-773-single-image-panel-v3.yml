name: Apply TURTO CRM 7.7.3 single-image-panel patch v3

on:
  push:
    branches:
      - fix/7.7.3-single-offer-image-panel
    paths:
      - .github/workflows/apply-773-single-image-panel-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/7.7.3-single-offer-image-panel
          fetch-depth: 0

      - name: Install focused validation dependency
        run: python -m pip install 'Pillow>=12.2'

      - name: Execute the reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-773-single-image-panel.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(block), 'apply-773-single-image-panel', 'exec'))
          PY
          git checkout -- .github/workflows/validate-770-runtime.yml

      - name: Compile and run focused regression checks
        shell: bash
        run: |
          python -m compileall -q ZakazkyApp_base_6.1/v619_fixes.py ZakazkyApp_base_6.1/v770_runtime_policy.py scripts/validate-770-runtime-policy.py
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1

      - name: Commit patch to the feature branch
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/v619_fixes.py ZakazkyApp_base_6.1/v770_runtime_policy.py scripts/validate-770-runtime-policy.py ARCHITECTURE_AUDIT_7.7.md release_version.txt release_notes.txt
          git commit -m "Consolidate received-offer PLEXUS image preview"
          git push origin HEAD:fix/7.7.3-single-offer-image-panel

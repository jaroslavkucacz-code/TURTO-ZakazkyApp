name: Apply verified 7.9.2 source edits
on:
  push:
    branches: [fix/7.9.2-customer-pdf-and-dialogs]
    paths: [.github/workflows/apply-792.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/7.9.2-customer-pdf-and-dialogs
      - name: Apply explicit source edits
        run: |
          python _workbench792/apply_source.py
          python _workbench792/apply_ui.py
      - name: Match the locally tested source byte for byte
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('_workbench792/expected.json').read_text())
          bad=[]
          for name, wanted in expected.items():
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              print(name,actual)
              if actual!=wanted:bad.append(name)
          assert not bad, 'Transport mismatch: '+str(bad)
          PY
          python -m compileall -q ZakazkyApp_base_6.1 scripts
      - name: Commit verified canonical files only
        run: |
          git rm -r _workbench792 .github/workflows/workbench-792.yml .github/workflows/apply-792.yml
          git add -u
          git diff --cached --check
          git config user.name 'TURTO Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Apply tested 7.9.2 privacy, header/footer and dialog fixes'
          git push origin HEAD:fix/7.9.2-customer-pdf-and-dialogs

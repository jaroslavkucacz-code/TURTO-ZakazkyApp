name: Verify status layout 6.3.12
on:
  push:
    branches: [fix/status-layout-6312]
    paths: [.github/workflows/_verify_status_layout_6312.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-layout-6312
      - name: Compile and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('ZakazkyApp_base_6.1/v638_table_updatefix.py')
          s=p.read_text(encoding='utf-8')
          assert "if tuple(tree.cget('columns'))!=tuple(cols):" in s
          assert "final_layout=getattr(M,'schedule_final_tree_layout',None)" in s
          assert "if callable(final_layout):final_layout(app)" in s
          assert "unbind('<Configure>')" not in s
          assert "for ms in (50,420):" in s
          print('status-layout contract OK')
          PY

name: Bootstrap TURTO CRM 6.3.29 sources
on:
  push:
    branches: [feature/6.3.29-price-lists]
    paths:
      - .github/workflows/bootstrap-price-lists-6329.yml
permissions:
  contents: write
concurrency:
  group: turto-crm-6329-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Materialize publish script
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap_publish_6329/part_* | base64 -d | gzip -d > /tmp/publish-update.sh
          echo "e112f082b1600bc1346c7899e809cf3fcbef92dd9ab306715d370ab1447d1f73  /tmp/publish-update.sh" | sha256sum -c -
          bash -n /tmp/publish-update.sh

          mkdir -p scripts
          cp /tmp/publish-update.sh scripts/publish-update.sh
          chmod +x scripts/publish-update.sh
          rm -rf .bootstrap_publish_6329

          git config user.name "TURTO Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "TURTO CRM 6.3.29 — publish script"
          git push origin HEAD:feature/6.3.29-price-lists

name: Apply TURTO CRM 8.0 v770 SQLite lifecycle cleanup
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-v770-sqlite.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Close v770 SQLite connections explicitly
        shell: python
        run: |
          from pathlib import Path

          p = Path('ZakazkyApp_base_6.1/v770_runtime_policy.py')
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              s = s.replace('from datetime import date, datetime, timedelta\n', 'from contextlib import closing\nfrom datetime import date, datetime, timedelta\n', 1)
          s = s.replace('with M.db() as con:', 'with closing(M.db()) as con, con:')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/validate-770-runtime-policy.py')
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              s = s.replace('import ast\n', 'import ast\nfrom contextlib import closing\n', 1)
          s = s.replace('with db() as con:', 'with closing(db()) as con, con:')
          p.write_text(s, encoding='utf-8')
      - name: Validate on Windows
        run: |
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-7616-requests-plexus-assets.py ZakazkyApp_base_6.1
          python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
          python scripts/validate-768-clean-table-markers.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add ZakazkyApp_base_6.1/v770_runtime_policy.py scripts/validate-770-runtime-policy.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: close final runtime SQLite connections explicitly'
          git push origin HEAD:refactor/8.0.0-big-cleanup

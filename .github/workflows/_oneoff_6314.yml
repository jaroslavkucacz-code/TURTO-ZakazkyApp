name: One-off Outlook foreground and staging 6.3.14
on:
  push:
    branches: [fix/outlook-foreground-staging-6314]
    paths: [.github/workflows/_oneoff_6314.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outlook-foreground-staging-6314
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python .tmp_patch_6314.py
          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py
          python - <<'PY'
          from pathlib import Path
          app=Path('ZakazkyApp_base_6.1/app.py').read_text(encoding='utf-8')
          base=Path('post_baseline.py').read_text(encoding='utf-8')
          drop=Path('ZakazkyApp_base_6.1/v631_diskdrop.py').read_text(encoding='utf-8')
          assert 'TURTO_OUTLOOK_HWND=' in app
          assert 'SetForegroundWindow(hwnd)' in app
          assert 'SwitchToThisWindow(hwnd,True)' in app
          assert 'def cleanup_legacy_offer_staging' in base
          assert "child.name.casefold() in {'dokumenty', 'documents'}" in base
          assert 'source_blob IS NOT NULL' in base
          assert 'content_blob IS NOT NULL' in base
          assert 'if digest(file_path) in known_hashes:' in base
          assert 'archive in resolved_root.parents' in base
          assert "getattr(M, 'cleanup_legacy_offer_staging', None)" in drop
          assert Path('release_version.txt').read_text(encoding='utf-8').strip()=='6.3.14'
          print('6.3.14 foreground/staging contract OK')
          PY
          git config user.name "TURTO Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .tmp_patch_6314.py
          git add ZakazkyApp_base_6.1/app.py ZakazkyApp_base_6.1/v631_diskdrop.py post_baseline.py release_version.txt release_notes.txt
          git commit -m "TURTO CRM 6.3.14 — foreground draft and safe staging cleanup"
          git push origin HEAD:fix/outlook-foreground-staging-6314

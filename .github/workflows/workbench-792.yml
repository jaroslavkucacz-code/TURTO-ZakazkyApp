name: Customer PDF workbench 792
on:
  push:
    branches: [fix/7.9.2-customer-pdf-and-dialogs]
    paths: [.github/workflows/workbench-792.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: crm792-source
          include-hidden-files: true
          path: |
            ZakazkyApp_base_6.1/
            scripts/
            .github/workflows/
            post_baseline.py
            release_version.txt
            release_notes.txt
            ARCHITECTURE_AUDIT_7.7.md
          retention-days: 3

name: Apply TURTO CRM 8.0 Windows SQLite lifecycle fix
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-sqlite-windows.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Close PLEXUS SQLite connections explicitly
        shell: python
        run: |
          from pathlib import Path

          p = Path('ZakazkyApp_base_6.1/v7616_requests_plexus_assets.py')
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              s = s.replace('import hashlib\n', 'import hashlib\nfrom contextlib import closing\n', 1)
          s = s.replace('with M.db() as con:', 'with closing(M.db()) as con, con:')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/validate-7616-requests-plexus-assets.py')
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              marker = 'import tempfile\n'
              if marker not in s:
                  raise SystemExit('validate-7616 import marker not found')
              s = s.replace(marker, marker + 'from contextlib import closing\n', 1)
          s = s.replace('with self.db() as con:', 'with closing(self.db()) as con, con:')
          s = s.replace('with module.db() as con:', 'with closing(module.db()) as con, con:')
          p.write_text(s, encoding='utf-8')
      - name: Validate on Windows
        run: |
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-7616-requests-plexus-assets.py ZakazkyApp_base_6.1
          python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add ZakazkyApp_base_6.1/v7616_requests_plexus_assets.py scripts/validate-7616-requests-plexus-assets.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: close shared PLEXUS SQLite connections explicitly'
          git push origin HEAD:refactor/8.0.0-big-cleanup

name: Publish TURTO CRM 8.x Windows release

on:
  push:
    branches: [main]
    paths:
      - windows_release_request.json

permissions:
  contents: write

concurrency:
  group: turto-crm-windows-release
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Validate explicit Windows release request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content windows_release_request.json -Raw | ConvertFrom-Json
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          if ($request.channel -ne 'windows') { throw 'Windows release request has wrong channel' }
          if ($request.version -ne $version) { throw "Release request/version.txt mismatch: $($request.version) != $version" }
          if ($version -match '(?i)preview|alpha|beta|rc') { throw 'Production Windows release cannot use a prerelease version' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Production Windows release must use x.y.z versioning' }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Validate installer and updater architecture
        shell: pwsh
        run: |
          python scripts/validate-800-installation.py
          python scripts/validate-800-updater-transaction.py

      - name: Build TURTO CRM application and updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean build/windows/TURTO_CRM.spec
          pyinstaller --noconfirm --clean build/windows/TURTO_CRM_Updater.spec

      - name: Assemble release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          Copy-Item 'dist/TURTO CRM Updater.exe' 'dist/TURTO CRM/TURTO CRM Updater.exe' -Force
          $runtimeManifest = [ordered]@{
            version = $version
            channel = 'windows'
            build = 'release'
          } | ConvertTo-Json
          Set-Content -Path 'dist/TURTO CRM/version.json' -Value $runtimeManifest -Encoding utf8
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM.exe')) { throw 'Main EXE missing' }
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM Updater.exe')) { throw 'Updater EXE missing' }

          $stage = "dist/TURTO_CRM_$version"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist/TURTO CRM' $stage -Recurse
          $updateZip = "dist/TURTO_CRM_Update_$version.zip"
          Remove-Item $updateZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath $updateZip -CompressionLevel Optimal

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build production installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after Inno Setup installation.' }
          & $iscc "/DMyAppVersion=$version" 'build/windows/TURTO_CRM.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test final installer on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $setup = (Resolve-Path "dist/installer/TURTO_CRM_Setup_$version.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'turto-crm-release-installed'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'turto-crm-release-data'
          $smokeResult = Join-Path $env:RUNNER_TEMP 'turto-crm-release-smoke.json'
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeResult -Force -ErrorAction SilentlyContinue

          $setupProc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installRoot") -PassThru
          if (-not $setupProc.WaitForExit(90000)) { Stop-Process -Id $setupProc.Id -Force; throw 'Production setup smoke install timed out' }
          if ($setupProc.ExitCode -ne 0) { throw "Production setup failed: $($setupProc.ExitCode)" }

          $mainExe = Join-Path $installRoot 'TURTO CRM.exe'
          if (-not (Test-Path $mainExe)) { throw 'Installed production main EXE missing' }
          $env:TURTO_CRM_DATA_ROOT = $dataRoot
          $env:TURTO_CRM_SMOKE_RESULT = $smokeResult
          $env:TURTO_DISABLE_AUTO_UPDATE = '1'
          $runtimeProc = Start-Process -FilePath $mainExe -ArgumentList @('--smoke-test') -PassThru
          if (-not $runtimeProc.WaitForExit(90000)) { Stop-Process -Id $runtimeProc.Id -Force; throw 'Production frozen runtime timed out' }
          if ($runtimeProc.ExitCode -ne 0) { throw "Production frozen runtime failed: $($runtimeProc.ExitCode)" }
          $smoke = Get-Content $smokeResult -Raw | ConvertFrom-Json
          if (-not $smoke.ok -or -not $smoke.frozen -or $smoke.version -ne $version) { throw 'Production frozen smoke result invalid' }

          $database = [string]$smoke.database
          $hashBefore = (Get-FileHash $database -Algorithm SHA256).Hash
          $uninstaller = Get-ChildItem $installRoot -File -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Production uninstaller missing' }
          $unProc = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (-not $unProc.WaitForExit(90000)) { Stop-Process -Id $unProc.Id -Force; throw 'Production uninstall timed out' }
          if (-not (Test-Path $database)) { throw 'Production uninstall removed business DB' }
          $hashAfter = (Get-FileHash $database -Algorithm SHA256).Hash
          if ($hashAfter -ne $hashBefore) { throw 'Production uninstall modified business DB' }

      - name: Publish immutable GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content windows_release_request.json -Raw | ConvertFrom-Json
          $version = [string]$request.version
          $tag = "v$version"
          $setup = (Resolve-Path "dist/installer/TURTO_CRM_Setup_$version.exe").Path
          $updateZip = (Resolve-Path "dist/TURTO_CRM_Update_$version.zip").Path
          $notesFile = Join-Path $env:RUNNER_TEMP 'turto-crm-release-notes.md'
          @(
            "# TURTO CRM $version",
            "",
            [string]$request.notes,
            "",
            "Databáze ani uživatelská data nejsou součástí instalačního balíčku a odinstalace je nemaže."
          ) | Set-Content $notesFile -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $updateZip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $setup $updateZip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TURTO CRM $version" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

      - name: Publish Windows update manifest and preview bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content windows_release_request.json -Raw | ConvertFrom-Json
          $version = [string]$request.version
          $package = "TURTO_CRM_Update_$version.zip"
          $installer = "TURTO_CRM_Setup_$version.exe"
          $updateZip = "dist/$package"
          $setup = "dist/installer/$installer"
          $updateSha = (Get-FileHash $updateZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseRoot = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version"
          $manifest = [ordered]@{
            format = 'turto-crm-windows-update-v1'
            channel = 'windows'
            version = $version
            package = $package
            sha256 = $updateSha
            download_url = "$releaseRoot/$package"
            installer = $installer
            installer_sha256 = $setupSha
            installer_url = "$releaseRoot/$installer"
          } | ConvertTo-Json

          git pull --rebase origin main
          Set-Content -Path latest-windows.json -Value $manifest -Encoding utf8
          git add latest-windows.json

          if ([bool]$request.bridge_legacy_preview) {
            Copy-Item $updateZip $package -Force
            git add $package
          }

          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish TURTO CRM Windows $version"
            git push origin HEAD:main
          }

      - name: Verify published release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json tagName,name,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published GitHub Release cannot be read back' }

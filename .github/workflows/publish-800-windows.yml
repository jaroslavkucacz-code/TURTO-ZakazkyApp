name: Publish TURTO CRM 8.x Windows release

on:
  push:
    branches: [main]
    paths:
      - windows_release_request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: turto-crm-windows-release
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Promote exact validated Windows installer and update package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-windows-808.py

name: Apply TURTO CRM 6.3.41 offer catalogue separation
on:
  push:
    branches:
      - feature/6.3.41-offer-catalog-separation
    paths:
      - .github/workflows/apply-6341-offer-catalog-separation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Apply corrected direct source-owner changes
        run: |
          python scripts/fix-6341-transformer.py
          python scripts/apply-6341-offer-catalog-core.py .
          python scripts/apply-6341-offer-catalog-tests.py .

      - name: Compile canonical source
        run: python -m compileall -q ZakazkyApp_base_6.1

      - name: Validate catalogue, workspaces and issued offers
        run: |
          python scripts/validate-6334-product-catalog.py ZakazkyApp_base_6.1
          python scripts/validate-6335-product-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6336-commercial-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

      - name: Validate platform and release scripts
        run: |
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Commit clean implementation
        run: |
          # Workflow files are updated separately through the repository API,
          # because a GitHub Actions token may not modify workflow definitions.
          git restore --source=HEAD -- .github/workflows/publish-update.yml
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f scripts/fix-6341-transformer.py
          rm -f scripts/apply-6341-offer-catalog-core.py
          rm -f scripts/apply-6341-offer-catalog-tests.py
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Separate received offers from the product catalogue"
          git push origin HEAD:feature/6.3.41-offer-catalog-separation

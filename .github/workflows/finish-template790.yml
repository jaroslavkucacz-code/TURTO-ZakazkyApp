name: Finalize reviewed TURTO 7.9 templates
on:
  push:
    branches: [feature/7.9.0-editable-standard-offer]
    paths:
      - .github/workflows/finish-template790.yml
      - _template790/finalize.py
permissions:
  contents: write
jobs:
  reviewed-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TURTO_DISABLE_AUTO_UPDATE: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/7.9.0-editable-standard-offer
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 2ba16f3357dd1ec30fd2e498e0aca10f455b9413
          path: .old-template790
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore reviewed source without modifying existing workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_template790/finalize.py');s=p.read_text()
          s=s.replace("'apply', '--check', handle.name", "'apply', '--exclude=.github/workflows/*', '--check', handle.name")
          s=s.replace("'apply', handle.name", "'apply', '--exclude=.github/workflows/*', handle.name")
          exec(compile(s,str(p),'exec'))
          PY
          python _template790/dialog_safety.py
          python _template790/source_paths.py
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Focused PDF, template and compatibility checks
        run: |
          python scripts/validate-7900-corporate-templates.py ZakazkyApp_base_6.1
          python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7616-requests-plexus-assets.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
      - name: Real Tk integration, three consecutive independent runs
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 120s xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/validate-7900-corporate-templates.py ZakazkyApp_base_6.1 --ui
          for sample in 1 2 3; do
            echo "Full application sample $sample/3 (all must pass)"
            timeout 120s xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1 || { find /tmp -path '*turto_790_full*' -name '*crash*' -exec tail -n 100 {} \; ; exit 1; }
          done
          timeout 180s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit only reviewed application files
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          files=[p for p in json.loads(Path('.applied790.json').read_text()) if not p.startswith('.github/')]
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','rm','-rf','--','_template790'],check=True)
          PY
          git config user.name 'TURTO Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Add TURTO Standard quotations and editable templates; validate actual release composition'
          git push origin HEAD:feature/7.9.0-editable-standard-offer

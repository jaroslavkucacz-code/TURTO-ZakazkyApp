name: Fix TURTO CRM 7.4 internal identity guard

on:
  push:
    branches:
      - feature/7.4.0-issued-pricing-columns-ui-consistency
    paths:
      - .github/workflows/fix-7400-identity-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Apply identity-state and final-output guard
        run: python scripts/_tmp740_identity_guard.py

      - name: Compile and validate
        shell: bash
        run: |
          python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7300-polish.py ZakazkyApp_base_6.1
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

      - name: Ensure virtual display
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Validate composed Tk application
        run: timeout 150s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit guard
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/v740_offer_defaults.py scripts/validate-7400-issued-pricing-columns.py
          git diff --cached --check
          git commit -m "Require TURTO internal identity for issued customer output"
          git push origin HEAD:feature/7.4.0-issued-pricing-columns-ui-consistency

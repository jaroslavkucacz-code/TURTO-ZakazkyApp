name: Apply TURTO CRM 6.3.33 review fixes

on:
  push:
    branches:
      - feature/6.3.33-product-taxonomy
    paths:
      - .github/workflows/apply-6333-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply TURTO CRM 6.3.33 review fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6.3.33-product-taxonomy
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'ZakazkyApp_base_6.1/price_lists_domain/platform/categories.py',
              '''        category_id, subgroup_id = classify_item_taxonomy(M, row)\n        category_id = old_category or category_id or fallback\n        if old_subgroup:\n            subgroup_id = old_subgroup\n            category_id = subgroup_parent_id(M, old_subgroup) or category_id\n        elif category_id:\n            subgroup_id = classify_subgroup_text(M, category_id, _row_text(row))\n        if only_empty:\n            category_id = old_category or category_id\n            subgroup_id = old_subgroup or subgroup_id\n''',
              '''        text = _row_text(row)\n        guessed_category = classify_text(M, text) or fallback\n        guessed_subgroup = classify_subgroup_text(M, guessed_category, text) if guessed_category else None\n        if only_empty:\n            category_id = old_category or guessed_category\n            subgroup_id = old_subgroup or (\n                classify_subgroup_text(M, category_id, text) if category_id else None\n            )\n            if old_subgroup:\n                category_id = subgroup_parent_id(M, old_subgroup) or category_id\n        else:\n            category_id = guessed_category\n            subgroup_id = guessed_subgroup\n''',
          )
          replace(
              'ZakazkyApp_base_6.1/price_lists_domain/platform/price_dialogs.py',
              'UPDATE price_list_items SET category_id=NULL WHERE price_list_id=?',
              'UPDATE price_list_items SET category_id=NULL,subgroup_id=NULL WHERE price_list_id=?',
          )
          replace(
              'ZakazkyApp_base_6.1/price_lists_domain/platform/price_page.py',
              '"Produktová skupina", "Název", "Skupina", "Větev",',
              '"Produktová skupina", "Název", "Rozsah / cenová řada", "Větev",',
          )
          replace(
              'ZakazkyApp_base_6.1/price_lists_domain/platform/categories.py',
              '''                              (SELECT COUNT(*) FROM supplier_offer_items WHERE category_id=?) +\n                              (SELECT COUNT(*) FROM product_subgroups WHERE category_id=?)""",\n                    (row_id, row_id, row_id, row_id),\n''',
              '''                              (SELECT COUNT(*) FROM supplier_offer_items WHERE category_id=?) +\n                              (SELECT COUNT(*) FROM business_document_items WHERE category_id=?) +\n                              (SELECT COUNT(*) FROM product_subgroups WHERE category_id=?)""",\n                    (row_id, row_id, row_id, row_id, row_id),\n''',
          )
          PY

      - name: Validate review fixes
        run: |
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f -name '*.pyc' -delete
          python -m compileall -q ZakazkyApp_base_6.1
          python scripts/validate-6333-taxonomy.py ZakazkyApp_base_6.1
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f -name '*.pyc' -delete

      - name: Commit source fixes
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/price_lists_domain/platform/categories.py \
                  ZakazkyApp_base_6.1/price_lists_domain/platform/price_dialogs.py \
                  ZakazkyApp_base_6.1/price_lists_domain/platform/price_page.py
          git commit -m "Harden 6.3.33 taxonomy consistency"
          git push origin HEAD:feature/6.3.33-product-taxonomy

name: Prepare TURTO CRM release request
on:
  push:
    branches: [main]
    paths:
      - release_request.json
      - .github/workflows/prepare-release-request.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: turto-release-request
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ hashFiles('release_request.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Validate source and requested feature
        run: |
          python -m compileall -q ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
      - name: Materialize release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('release_request.json').read_text(encoding='utf-8'))
          version = str(request['version']).strip()
          notes = str(request.get('notes') or '').strip()
          if not version or not notes:
              raise SystemExit('release_request.json requires version and notes')
          Path('release_version.txt').write_text(version + '\n', encoding='utf-8')
          Path('release_notes.txt').write_text(notes + '\n', encoding='utf-8')
          PY
      - name: Commit release metadata and consume request
        run: |
          git config user.name "TURTO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm release_request.json
          git add release_version.txt release_notes.txt
          git commit -m "Prepare ZakazkyApp v$(tr -d ' \r\n' < release_version.txt) release"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((try*2))
          done
          exit 1

name: Debug TURTO CRM 7.6 generated source

on:
  push:
    branches:
      - feature/7.6.0-table-activity-performance
    paths:
      - .github/workflows/debug-760-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct generated sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          payload = Path("scripts/_tmp760_payload")
          specifications = (
              ("module_*.b64", Path("/tmp/v760.py"), "96eb4f0253ff5c1317fddc85e83de2c1fb045b8f0311e2ee38b38b08b4f87e3f"),
              ("integrate_*.b64", Path("/tmp/integrate.py"), "03e20dd842786bffb9a6ef3801b288ea888dd69d039557bc88dda9ad443d8682"),
              ("validator_*.b64", Path("/tmp/validate760.py"), "884d87708bd73f58b55d4ed3a519a18680de0dd54a6099cd5687ea63f181171d"),
          )
          for pattern, output, expected in specifications:
              encoded = "".join(
                  "".join(part.read_text(encoding="ascii").split())
                  for part in sorted(payload.glob(pattern))
              )
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected:
                  raise SystemExit((output, digest, expected))
              output.write_bytes(data)
          PY
      - name: Show project and delayed callback implementation
        shell: bash
        run: |
          echo '--- project activity column ---'
          nl -ba /tmp/v760.py | sed -n '810,955p'
          echo '--- project toolbar/build/timestamp ---'
          nl -ba /tmp/v760.py | sed -n '1030,1225p'
          echo '--- task workspace ---'
          nl -ba /tmp/v760.py | sed -n '1220,1450p'
          echo '--- app initialization and delayed callbacks ---'
          tail -n 360 /tmp/v760.py | nl -ba
          echo '--- all after(...) calls ---'
          grep -n -C 3 '\.after(' /tmp/v760.py
          echo '--- build wrappers ---'
          grep -n -C 5 'def build_' /tmp/v760.py

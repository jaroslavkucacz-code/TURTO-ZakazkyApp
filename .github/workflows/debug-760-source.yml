name: Debug TURTO CRM 7.6 Treeview columns

on:
  push:
    branches:
      - feature/7.6.0-table-activity-performance
    paths:
      - .github/workflows/debug-760-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Reconstruct and apply generated 7.6 sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          payload = Path("scripts/_tmp760_payload")
          specifications = (
              ("module_*.b64", Path("ZakazkyApp_base_6.1/v760_table_activity_performance.py"), "96eb4f0253ff5c1317fddc85e83de2c1fb045b8f0311e2ee38b38b08b4f87e3f"),
              ("integrate_*.b64", Path("/tmp/integrate.py"), "03e20dd842786bffb9a6ef3801b288ea888dd69d039557bc88dda9ad443d8682"),
          )
          for pattern, output, expected in specifications:
              parts = sorted(payload.glob(pattern))
              if not parts:
                  raise SystemExit(f"Missing payload {pattern}")
              encoded = "".join(
                  "".join(part.read_text(encoding="ascii").split())
                  for part in parts
              )
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected:
                  raise SystemExit((output, digest, expected))
              output.write_bytes(data)
          PY
          python /tmp/integrate.py

      - name: Apply current integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("ZakazkyApp_base_6.1/app.py")
          text = app_path.read_text(encoding="utf-8")
          old = (
              '        for c,w in zip(cols,widths):\n'
              '            t.heading(c,text=c,command=lambda col=c,tree=t:self.sort_tree(tree,col))\n'
              '            t.column(c,width=w,anchor="w")\n'
          )
          new = (
              '        for c,w in zip(cols,widths):\n'
              '            t.column(c,width=w,anchor="w")\n'
              '            t.heading(c,text=c,anchor=t.column(c,"anchor"),\n'
              '                      command=lambda col=c,tree=t:self.sort_tree(tree,col))\n'
          )
          if old not in text:
              raise SystemExit("App.tree block missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '        widths=(300,300,220,220,100,100,90)\n',
              '        widths=(300,300,220,220,100,100,90,150)\n',
              1,
          )
          text = text.replace(
              '        self.project_tree=self.tree(p,("Název Akce","Adresa","Investor","Generální dodavatel","Zahájení","Dokončení","Příležitostí"),list(widths))\n',
              '        self.project_tree=self.tree(p,("Název Akce","Adresa","Investor","Generální dodavatel","Zahájení","Dokončení","Příležitostí","Poslední pohyb"),list(widths))\n',
              1,
          )
          app_path.write_text(text, encoding="utf-8")

          module_path = Path("ZakazkyApp_base_6.1/v760_table_activity_performance.py")
          module = module_path.read_text(encoding="utf-8")
          start = module.index("    def add_project_activity_column(app: Any) -> None:\n")
          end = module.index("\n    def refresh_projects(self: Any) -> None:\n", start)
          block = module[start:end]
          needle = "        install_tree_polish(tree)\n"
          replacement = (
              "        visible_now = _displayed_columns(tree)\n"
              "        if LAST_ACTIVITY_COLUMN not in visible_now:\n"
              "            tree.configure(displaycolumns=tuple(visible_now + [LAST_ACTIVITY_COLUMN]))\n"
              "        install_tree_polish(tree)\n"
          )
          if block.count(needle) != 1:
              raise SystemExit("Project activity insertion point missing")
          module = module[:start] + block.replace(needle, replacement, 1) + module[end:]
          module_path.write_text(module, encoding="utf-8")

          commercial_path = Path("ZakazkyApp_base_6.1/price_lists_domain/platform/commercial_workspace.py")
          commercial = commercial_path.read_text(encoding="utf-8")
          old_title = (
              '    app._offer_drop_area_ready = True\n'
              '    app.title_label(page, "Přijaté nabídky")\n'
          )
          new_title = (
              '    app._offer_drop_area_ready = True\n'
              '    offer_import = getattr(app, "import_offer_sources", None)\n'
              '    title_row = M.ttk.Frame(page, style="App.TFrame")\n'
              '    title_row.pack(fill="x", pady=(0, 12))\n'
              '    M.ttk.Label(title_row, text="Přijaté nabídky", style="Title.TLabel").pack(side="left", anchor="n")\n'
              '    if callable(offer_import):\n'
              '        M.ttk.Button(\n'
              '            title_row, text="📥 Zpracovat nabídku", style="Accent.TButton",\n'
              '            command=lambda: _run_after_invalidation(app, offer_import, offers=True),\n'
              '        ).pack(side="right", anchor="n", pady=(2, 0))\n'
          )
          old_button = (
              '    if callable(getattr(app, "import_offer_sources", None)):\n'
              '        M.ttk.Button(\n'
              '            command, text="📥 Zpracovat nabídku", style="Accent.TButton",\n'
              '            command=lambda: _run_after_invalidation(app, app.import_offer_sources, offers=True),\n'
              '        ).pack(side="left")\n'
          )
          if old_title not in commercial or old_button not in commercial:
              raise SystemExit("Received-offer title/button blocks missing")
          commercial = commercial.replace(old_title, new_title, 1)
          commercial = commercial.replace(old_button, "", 1)
          commercial_path.write_text(commercial, encoding="utf-8")
          PY

      - name: Instrument the Treeview alignment loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate-real-ui.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '        for tree in all_trees:\n'
              '            for column in tree["columns"]:\n'
              '                assert tree.heading(column, "anchor") == tree.column(column, "anchor"), (\n'
          )
          new = (
              '        for tree in all_trees:\n'
              '            print("V760-TREE", str(tree), "parent=", str(tree.master), "exists=", tree.winfo_exists(), "mapped=", tree.winfo_ismapped(), "columns=", tuple(tree["columns"]), flush=True)\n'
              '            for column in tree["columns"]:\n'
              '                print("V760-COLUMN", str(tree), repr(column), "current=", tuple(tree["columns"]), flush=True)\n'
              '                assert tree.heading(column, "anchor") == tree.column(column, "anchor"), (\n'
          )
          if old not in text:
              raise SystemExit("Alignment loop missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Ensure virtual display
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Run instrumented real UI
        run: timeout 180s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

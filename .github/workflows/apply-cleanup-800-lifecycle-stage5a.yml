name: Apply TURTO CRM 8.0 late App lifecycle consolidation
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-lifecycle-stage5a.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Migrate safe late App init wrappers
        shell: python
        run: |
          from pathlib import Path
          root = Path('ZakazkyApp_base_6.1')

          def replace(path, old, new):
              p = root / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace('v740_offer_defaults.py', '''    previous_app_init = M.App.__init__

    def app_init(self, *args, **kwargs):
        result = previous_app_init(self, *args, **kwargs)

        def tidy():
            try:
                mivo = getattr(self, "tabs", {}).get("mivo")
                offers = getattr(self, "tabs", {}).get("offers")
                if mivo is not None:
                    remove_columns_buttons(mivo)
                if offers is not None:
                    remove_columns_buttons(offers)
                button = getattr(
                    self, "_v710_mivo_columns_button", None
                )
                if _widget_exists(button):
                    button.destroy()
                self._v710_mivo_columns_button = None
                install_offer_context(self)
            except Exception:
                pass

        for delay in (0, 80, 260, 760, 1650):
            try:
                self.after(delay, tidy)
            except Exception:
                pass
        return result

    M.App.__init__ = app_init''', '''    def after_app_init(self, _result, _args, _kwargs):
        def tidy():
            try:
                mivo = getattr(self, "tabs", {}).get("mivo")
                offers = getattr(self, "tabs", {}).get("offers")
                if mivo is not None:
                    remove_columns_buttons(mivo)
                if offers is not None:
                    remove_columns_buttons(offers)
                button = getattr(
                    self, "_v710_mivo_columns_button", None
                )
                if _widget_exists(button):
                    button.destroy()
                self._v710_mivo_columns_button = None
                install_offer_context(self)
            except Exception:
                pass

        for delay in (0, 80, 260, 760, 1650):
            try:
                self.after(delay, tidy)
            except Exception:
                pass

    M.register_app_init_hook("v740.offer_toolbar_tidy", after=after_app_init)''')

          replace('v750_context_filters_offer_format.py', '''    previous_app_init = M.App.__init__

    def app_init(self: Any, *args: Any, **kwargs: Any):
        result = previous_app_init(self, *args, **kwargs)
        for delay in (0, 80, 260, 760, 1650):
            try:
                self.after(delay, lambda current=self: configure_workspaces(current))
            except Exception:
                pass
        return result

    M.App.__init__ = app_init''', '''    def after_app_init(self: Any, _result: Any, _args: tuple[Any, ...], _kwargs: dict[str, Any]) -> None:
        for delay in (0, 80, 260, 760, 1650):
            try:
                self.after(delay, lambda current=self: configure_workspaces(current))
            except Exception:
                pass

    M.register_app_init_hook("v750.configure_workspaces", after=after_app_init)''')

          replace('price_lists_domain/issued_offers/professional_workflow.py', '''    previous_init = M.App.__init__

    def app_init(self: Any, *args: Any, **kwargs: Any):
        result = previous_init(self, *args, **kwargs)
        try:
            self.bind(
                "<F1>",
                lambda _event: (
                    _open_help_topic(M, self, "help_start"),
                    "break",
                )[1],
                add="+",
            )
        except Exception:
            pass
        return result

    M.App.__init__ = app_init''', '''    def after_app_init(self: Any, _result: Any, _args: tuple[Any, ...], _kwargs: dict[str, Any]) -> None:
        try:
            self.bind(
                "<F1>",
                lambda _event: (
                    _open_help_topic(M, self, "help_start"),
                    "break",
                )[1],
                add="+",
            )
        except Exception:
            pass

    M.register_app_init_hook("v780.help_shortcut", after=after_app_init)''')

          replace('v770_runtime_policy.py', '''    previous_init = M.App.__init__
    def app_init(self, *args, **kwargs):
        result = previous_init(self, *args, **kwargs)
        _configure_identity(M, self)
        try:
            self.title("TURTO CRM")
        except Exception:
            pass
        self.after_idle(lambda current=self: _apply_branding(M, current))
        self.after_idle(lambda current=self: _install_action_layout(current))
        self.after(250, lambda current=self: _install_action_layout(current))
        _schedule_plexus_backfill(M, self)
        return result
    M.App.__init__ = app_init''', '''    def after_app_init(self, _result, _args, _kwargs):
        _configure_identity(M, self)
        try:
            self.title("TURTO CRM")
        except Exception:
            pass
        self.after_idle(lambda current=self: _apply_branding(M, current))
        self.after_idle(lambda current=self: _install_action_layout(current))
        self.after(250, lambda current=self: _install_action_layout(current))
        _schedule_plexus_backfill(M, self)
    M.register_app_init_hook("v770.final_runtime_policy", after=after_app_init)''')

          p = Path('scripts/validate-800-app-lifecycle.py')
          s = p.read_text(encoding='utf-8')
          old = '''        "v631_diskdrop.py",\n    )'''
          new = '''        "v631_diskdrop.py",\n        "v740_offer_defaults.py",\n        "v750_context_filters_offer_format.py",\n        "price_lists_domain/issued_offers/professional_workflow.py",\n        "v770_runtime_policy.py",\n    )'''
          if old not in s:
              raise SystemExit('lifecycle migrated tuple marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/audit-runtime-overrides.py')
          s = p.read_text(encoding='utf-8')
          marker = 'CRITICAL_OWNER_BUDGETS = {\n'
          if marker not in s:
              raise SystemExit('owner budget marker not found')
          if '    "M.App.__init__": 3,\n' not in s:
              s = s.replace(marker, marker + '    "M.App.__init__": 3,\n', 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate late lifecycle migration
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 scripts
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1
          python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add \
            ZakazkyApp_base_6.1/v740_offer_defaults.py \
            ZakazkyApp_base_6.1/v750_context_filters_offer_format.py \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py \
            ZakazkyApp_base_6.1/v770_runtime_policy.py \
            scripts/validate-800-app-lifecycle.py \
            scripts/audit-runtime-overrides.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate safe late App initialization hooks'
          git push origin HEAD:refactor/8.0.0-big-cleanup

name: Apply TURTO CRM 8.0 late App lifecycle consolidation
# retry with exact production validator + runtime-faithful import path
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-lifecycle-stage5a.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Restore exact 7.9.2 professional workflow validator
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('scripts/validate-7800-professional-offer-workflow.py')
          text = subprocess.check_output(
              ['git','show','origin/main:scripts/validate-7800-professional-offer-workflow.py'],
              text=True,
              encoding='utf-8',
          )
          old = '''def load_layer(source: Path):\n    path = source / "price_lists_domain" / "issued_offers" / "professional_workflow.py"\n'''
          new = '''def load_layer(source: Path):\n    source_text = str(source)\n    if source_text not in sys.path:\n        sys.path.insert(0, source_text)\n    path = source / "price_lists_domain" / "issued_offers" / "professional_workflow.py"\n'''
          if old not in text:
              raise SystemExit('load_layer marker not found in production validator')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Migrate safe late App init wrappers
        run: python _cleanup800_stage5a.py
      - name: Validate late lifecycle migration
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 scripts
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1
          python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add \
            ZakazkyApp_base_6.1/v740_offer_defaults.py \
            ZakazkyApp_base_6.1/v750_context_filters_offer_format.py \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py \
            ZakazkyApp_base_6.1/v770_runtime_policy.py \
            scripts/validate-7800-professional-offer-workflow.py \
            scripts/validate-800-app-lifecycle.py \
            scripts/audit-runtime-overrides.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate safe late App initialization hooks'
          git push origin HEAD:refactor/8.0.0-big-cleanup

name: Apply TURTO CRM 7.6 integration

on:
  push:
    branches:
      - feature/7.6.0-table-activity-performance
    paths:
      - .github/workflows/apply-7600-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Reconstruct and apply 7.6 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          payload = Path("scripts/_tmp760_payload")
          specifications = (
              (
                  "module_*.b64",
                  Path("ZakazkyApp_base_6.1/v760_table_activity_performance.py"),
                  "96eb4f0253ff5c1317fddc85e83de2c1fb045b8f0311e2ee38b38b08b4f87e3f",
              ),
              (
                  "validator_*.b64",
                  Path("scripts/validate-7600-table-activity-performance.py"),
                  "884d87708bd73f58b55d4ed3a519a18680de0dd54a6099cd5687ea63f181171d",
              ),
              (
                  "integrate_*.b64",
                  Path("scripts/_tmp760_integrate.py"),
                  "03e20dd842786bffb9a6ef3801b288ea888dd69d039557bc88dda9ad443d8682",
              ),
          )
          for pattern, output, expected in specifications:
              parts = sorted(payload.glob(pattern))
              if not parts:
                  raise SystemExit(f"Missing payload: {pattern}")
              encoded = "".join(
                  "".join(part.read_text(encoding="ascii").split())
                  for part in parts
              )
              compressed = base64.b64decode(encoded, validate=True)
              data = gzip.decompress(compressed)
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected:
                  raise SystemExit(
                      f"Payload checksum mismatch for {output}: {digest} != {expected}"
                  )
              output.write_bytes(data)
              print(f"Reconstructed {output}: {len(data)} bytes, sha256={digest}")
          PY
          python scripts/_tmp760_integrate.py
          rm -rf scripts/_tmp760_payload scripts/_tmp760_integrate.py

      - name: Finalize canonical table and commercial title layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("ZakazkyApp_base_6.1/app.py")
          app_text = app_path.read_text(encoding="utf-8")

          old_tree = (
              '        for c,w in zip(cols,widths):\n'
              '            t.heading(c,text=c,command=lambda col=c,tree=t:self.sort_tree(tree,col))\n'
              '            t.column(c,width=w,anchor="w")\n'
          )
          new_tree = (
              '        for c,w in zip(cols,widths):\n'
              '            # Configure the data cell first, then mirror its alignment in the heading.\n'
              '            t.column(c,width=w,anchor="w")\n'
              '            t.heading(c,text=c,anchor=t.column(c,"anchor"),\n'
              '                      command=lambda col=c,tree=t:self.sort_tree(tree,col))\n'
          )
          if old_tree not in app_text:
              raise SystemExit("Canonical App.tree block was not found")
          app_text = app_text.replace(old_tree, new_tree, 1)

          old_widths = '        widths=(300,300,220,220,100,100,90)\n'
          new_widths = '        widths=(300,300,220,220,100,100,90,150)\n'
          if old_widths not in app_text:
              raise SystemExit("Project table widths were not found")
          app_text = app_text.replace(old_widths, new_widths, 1)

          old_project_tree = (
              '        self.project_tree=self.tree(p,("Název Akce","Adresa","Investor",'
              '"Generální dodavatel","Zahájení","Dokončení","Příležitostí"),list(widths))\n'
          )
          new_project_tree = (
              '        self.project_tree=self.tree(p,("Název Akce","Adresa","Investor",'
              '"Generální dodavatel","Zahájení","Dokončení","Příležitostí",'
              '"Poslední pohyb"),list(widths))\n'
          )
          if old_project_tree not in app_text:
              raise SystemExit("Canonical project Treeview definition was not found")
          app_text = app_text.replace(old_project_tree, new_project_tree, 1)
          app_path.write_text(app_text, encoding="utf-8")

          module_path = Path("ZakazkyApp_base_6.1/v760_table_activity_performance.py")
          module_text = module_path.read_text(encoding="utf-8")

          wrapper_start = module_text.index(
              "        def sync_heading_anchors(tree: Any) -> None:\n"
          )
          wrapper_end = module_text.index(
              "        def tree_xview(self: Any, *args: Any):\n",
              wrapper_start,
          )
          wrapper = '''        def _fallback_column_token(tree: Any, column: Any) -> Any:
            target = str(column)
            columns = _all_columns(tree)
            if target in columns:
                return f"#{columns.index(target) + 1}"
            return column

        def _original_heading_call(
            tree: Any, column: Any, option: Any = None, **kwargs: Any
        ):
            try:
                return original_heading(tree, column, option, **kwargs)
            except Exception:
                fallback = _fallback_column_token(tree, column)
                if str(fallback) == str(column):
                    raise
                return original_heading(tree, fallback, option, **kwargs)

        def _original_column_call(
            tree: Any, column: Any, option: Any = None, **kwargs: Any
        ):
            try:
                return original_column(tree, column, option, **kwargs)
            except Exception:
                fallback = _fallback_column_token(tree, column)
                if str(fallback) == str(column):
                    raise
                return original_column(tree, fallback, option, **kwargs)

        def sync_heading_anchors(tree: Any) -> None:
            for column in _all_columns(tree):
                try:
                    anchor = _normalize_anchor(
                        _original_column_call(tree, column, "anchor")
                    )
                    _original_heading_call(tree, column, anchor=anchor)
                except Exception:
                    pass

        def install_tree_polish(tree: Any) -> None:
            if not _exists(tree):
                return
            first_install = not getattr(tree, "_v760_table_polish", False)
            if first_install:
                tree._v760_table_polish = True
                for sequence in (
                    "<Configure>",
                    "<Map>",
                    "<B1-Motion>",
                    "<ButtonRelease-1>",
                ):
                    tree.bind(
                        sequence,
                        lambda _event, current=tree: schedule_separators(current),
                        add="+",
                    )
            sync_heading_anchors(tree)
            schedule_separators(tree, 0)
            if first_install:
                schedule_separators(tree, 90)

        def tree_init(self: Any, *args: Any, **kwargs: Any):
            original_init(self, *args, **kwargs)
            try:
                self.after_idle(lambda current=self: install_tree_polish(current))
            except Exception:
                pass

        def tree_heading(self: Any, column: Any, option: Any = None, **kwargs: Any):
            mutating = bool(kwargs)
            if mutating:
                try:
                    kwargs["anchor"] = _normalize_anchor(
                        _original_column_call(self, column, "anchor")
                    )
                except Exception:
                    pass
            result = _original_heading_call(self, column, option, **kwargs)
            if mutating:
                schedule_separators(self)
            return result

        def tree_column(self: Any, column: Any, option: Any = None, **kwargs: Any):
            mutating = bool(kwargs)
            result = _original_column_call(self, column, option, **kwargs)
            if mutating:
                try:
                    _original_heading_call(
                        self,
                        column,
                        anchor=_normalize_anchor(
                            _original_column_call(self, column, "anchor")
                        ),
                    )
                except Exception:
                    pass
                schedule_separators(self)
            return result

        def tree_configure(self: Any, cnf: Any = None, **kwargs: Any):
            result = original_configure(self, cnf, **kwargs)
            if cnf is not None or kwargs:
                try:
                    sync_heading_anchors(self)
                    schedule_separators(self)
                except Exception:
                    pass
            return result

'''
          module_text = (
              module_text[:wrapper_start] + wrapper + module_text[wrapper_end:]
          )

          start = module_text.index("    def add_project_activity_column(app: Any) -> None:\n")
          end = module_text.index("\n    def refresh_projects(self: Any) -> None:\n", start)
          block = module_text[start:end]
          polish = "        install_tree_polish(tree)\n"
          visible_guard = (
              "        # Existing user layouts from 7.5 may not yet contain the new column.\n"
              "        visible_now = _displayed_columns(tree)\n"
              "        if LAST_ACTIVITY_COLUMN not in visible_now:\n"
              "            tree.configure(displaycolumns=tuple(visible_now + [LAST_ACTIVITY_COLUMN]))\n"
              "        install_tree_polish(tree)\n"
          )
          if block.count(polish) != 1:
              raise SystemExit("Project activity polish point was not found exactly once")
          module_text = (
              module_text[:start]
              + block.replace(polish, visible_guard, 1)
              + module_text[end:]
          )
          module_path.write_text(module_text, encoding="utf-8")

          commercial_path = Path(
              "ZakazkyApp_base_6.1/price_lists_domain/platform/commercial_workspace.py"
          )
          commercial = commercial_path.read_text(encoding="utf-8")
          old_title = (
              '    app._offer_drop_area_ready = True\n'
              '    app.title_label(page, "Přijaté nabídky")\n'
          )
          new_title = (
              '    app._offer_drop_area_ready = True\n'
              '    offer_import = getattr(app, "import_offer_sources", None)\n'
              '    title_row = M.ttk.Frame(page, style="App.TFrame")\n'
              '    title_row.pack(fill="x", pady=(0, 12))\n'
              '    M.ttk.Label(\n'
              '        title_row, text="Přijaté nabídky", style="Title.TLabel"\n'
              '    ).pack(side="left", anchor="n")\n'
              '    if callable(offer_import):\n'
              '        M.ttk.Button(\n'
              '            title_row, text="📥 Zpracovat nabídku", style="Accent.TButton",\n'
              '            command=lambda: _run_after_invalidation(app, offer_import, offers=True),\n'
              '        ).pack(side="right", anchor="n", pady=(2, 0))\n'
          )
          old_button = (
              '    if callable(getattr(app, "import_offer_sources", None)):\n'
              '        M.ttk.Button(\n'
              '            command, text="📥 Zpracovat nabídku", style="Accent.TButton",\n'
              '            command=lambda: _run_after_invalidation(app, app.import_offer_sources, offers=True),\n'
              '        ).pack(side="left")\n'
          )
          if old_title not in commercial:
              raise SystemExit("Received-offer title block was not found")
          if old_button not in commercial:
              raise SystemExit("Received-offer toolbar action block was not found")
          commercial = commercial.replace(old_title, new_title, 1)
          commercial = commercial.replace(old_button, "", 1)
          commercial_path.write_text(commercial, encoding="utf-8")
          PY

      - name: Compile source
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py

      - name: Validate 7.6 and all commercial regressions
        shell: bash
        run: |
          python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1
          python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7300-polish.py ZakazkyApp_base_6.1
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Ensure virtual display
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Validate composed Tk application
        run: timeout 180s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit integration
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            ZakazkyApp_base_6.1/app.py \
            ZakazkyApp_base_6.1/ZakazkyCRM.pyw \
            ZakazkyApp_base_6.1/v760_table_activity_performance.py \
            ZakazkyApp_base_6.1/price_lists_domain/platform/commercial_workspace.py \
            release_version.txt \
            release_notes.txt \
            scripts/publish-update.sh \
            scripts/validate-7500-context-filters-offer-format.py \
            scripts/validate-7600-table-activity-performance.py \
            scripts/validate-real-ui.py
          git add -u scripts/_tmp760_payload
          git diff --cached --check
          git commit -m "Integrate TURTO CRM 7.6 tables, activity and performance"
          git push origin HEAD:feature/7.6.0-table-activity-performance

# retry with numeric Treeview fallback for dynamically composed columns

name: Apply TURTO CRM 6.3.34 catalogue UI hardening

on:
  push:
    branches:
      - feature/6.3.34-product-catalog-pricing
    paths:
      - .github/workflows/apply-6334-ui-review.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run TURTO CRM 6.3.34 catalogue UI hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6.3.34-product-catalog-pricing
          fetch-depth: 0

      - name: Apply catalogue UI review
        run: python scripts/_apply_6334_ui_review2.py

      - name: Validate catalogue UI review
        run: |
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f -name '*.pyc' -delete
          python -m compileall -q ZakazkyApp_base_6.1
          python scripts/validate-6334-product-catalog.py ZakazkyApp_base_6.1
          python scripts/validate-6333-taxonomy.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          python scripts/validate-6332-clarity.py ZakazkyApp_base_6.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          timeout 90s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh
          find ZakazkyApp_base_6.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find ZakazkyApp_base_6.1 -type f -name '*.pyc' -delete

      - name: Commit catalogue UI hardening
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/price_lists_domain/platform/categories.py \
                  ZakazkyApp_base_6.1/price_lists_domain/platform/product_catalog.py \
                  scripts/validate-real-ui.py scripts/validate-6334-product-catalog.py
          git commit -m "Harden TURTO CRM 6.3.34 catalogue UI"
          git push origin HEAD:feature/6.3.34-product-catalog-pricing

      - name: Validate composed Tk application
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 150s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit integration
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/ZakazkyCRM.pyw \
                  ZakazkyApp_base_6.1/v730_polish.py \
                  scripts/publish-update.sh scripts/validate-real-ui.py \
                  scripts/validate-7300-polish.py \
                  .github/workflows/publish-update.yml \
                  .github/workflows/validate-6330.yml \
                  .github/workflows/validate-7300-polish.yml \
                  release_version.txt release_notes.txt
          git diff --cached --check
          git commit -m "TURTO CRM 7.3.0 — stable preview, offer columns and company merge"
          git push origin HEAD:feature/7.3.0-preview-offers-company-merge

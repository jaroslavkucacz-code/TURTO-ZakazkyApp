name: Apply TURTO CRM 7.3 integration

on:
  push:
    branches:
      - feature/7.3.0-preview-offers-company-merge
    paths:
      - .github/workflows/apply-7300-integration.yml
  workflow_dispatch:

permissions:
  contents: write


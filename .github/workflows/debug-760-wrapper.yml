name: Inspect TURTO CRM 7.6 Treeview wrapper

on:
  push:
    branches:
      - feature/7.6.0-table-activity-performance
    paths:
      - .github/workflows/debug-760-wrapper.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct module and show Treeview implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = Path("scripts/_tmp760_payload")
          encoded = "".join(
              "".join(part.read_text(encoding="ascii").split())
              for part in sorted(payload.glob("module_*.b64"))
          )
          Path("/tmp/v760.py").write_bytes(
              gzip.decompress(base64.b64decode(encoded, validate=True))
          )
          PY
          nl -ba /tmp/v760.py | sed -n '500,625p'
          echo '--- project activity function ---'
          nl -ba /tmp/v760.py | sed -n '810,875p'

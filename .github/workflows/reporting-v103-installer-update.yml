name: Publish TURTO reporting 1.0.3 installer updater

on:
  push:
    branches: [mesicni-prehledy-stable]
    paths:
      - release_sources/1.0.3/publish.json

permissions:
  contents: write

concurrency:
  group: reporting-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input pyinstaller==6.16.0 XlsxWriter>=3.2
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and verify TURTO 1.0.3
        shell: pwsh
        run: python release_sources/1.0.3/build_release.py
      - name: Publish verified packages and stable manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'TURTO Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add releases/1.0.3/TURTO_update_1.0.3.zip releases/1.0.3/TURTO_Mesicni_Prehledy_Setup_1.0.3.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m 'Build verified TURTO reporting 1.0.3 packages' }
          $env:PACKAGE_COMMIT=(git rev-parse HEAD)
          $env:PACKAGE_SHA=(Get-Content _v103_update_sha.txt -Raw).Trim()
          $env:SETUP_SHA=(Get-Content _v103_setup_sha.txt -Raw).Trim()
          @'
          import json,os,pathlib
          r=json.loads(pathlib.Path('release_sources/1.0.3/publish.json').read_text(encoding='utf-8'))
          base='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['PACKAGE_COMMIT']+'/releases/1.0.3/'
          m={
              'app_id':'cz.turto.mesicni-prehledy',
              'version':'1.0.3',
              'minimum_version':'1.0.1',
              'sha256':os.environ['PACKAGE_SHA'],
              'notes':r['notes'],
              'channel':'stable',
              'url':base+'TURTO_update_1.0.3.zip',
              'installer_url':base+'TURTO_Mesicni_Prehledy_Setup_1.0.3.exe',
              'installer_sha256':os.environ['SETUP_SHA'],
              'install_scope':'current_user',
              'update_mode':'installer',
          }
          pathlib.Path('update_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          '@ | python -
          git add update_manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m 'Publish TURTO reporting 1.0.3 stable manifest' }
          git push origin HEAD:mesicni-prehledy-stable

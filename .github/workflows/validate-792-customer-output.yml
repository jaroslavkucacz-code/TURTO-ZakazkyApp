name: Validate 7.9.2 customer privacy and dialogs
on:
  pull_request:
    paths: ['ZakazkyApp_base_6.1/**', 'scripts/**', 'release_version.txt', '.github/workflows/validate-792-customer-output.yml']
  push:
    branches: [main]
    paths: ['ZakazkyApp_base_6.1/**', 'scripts/**', 'release_version.txt']
permissions:
  contents: read
jobs:
  customer-output:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TURTO_DISABLE_AUTO_UPDATE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts
      - name: Linux public PDF and actual widget regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 160s xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/validate-792-customer-output.py ZakazkyApp_base_6.1
      - name: Windows public PDF and native maximize regression
        if: runner.os == 'Windows'
        run: python scripts/validate-792-customer-output.py ZakazkyApp_base_6.1

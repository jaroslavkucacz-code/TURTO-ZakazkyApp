name: Apply TURTO CRM 7.2 visual issued offers

on:
  push:
    branches:
      - feature/7.2.0-visual-issued-offers
    paths:
      - .github/workflows/apply-7200-visual-offer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt


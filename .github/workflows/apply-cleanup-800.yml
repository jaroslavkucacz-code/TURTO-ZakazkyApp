name: Apply TURTO CRM 8.0 cleanup patch
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths:
      - '.github/workflows/apply-cleanup-800.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - name: Apply verified local cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          cat _cleanup800/p1 _cleanup800/p2 _cleanup800/p3 _cleanup800/p4 _cleanup800/p5 _cleanup800/p6 > /tmp/cleanup.patch.gz.b64
          base64 -d /tmp/cleanup.patch.gz.b64 | gzip -dc > /tmp/cleanup.patch
          git apply --check -p1 /tmp/cleanup.patch
          git apply -p1 /tmp/cleanup.patch
          # The Actions token may write source files but may not create/update workflow files.
          # Keep workflow changes out of this commit; they are managed separately via the connector.
          rm -f .github/workflows/validate-800-architecture.yml
          git restore --worktree .github/workflows
          git status --short
      - name: Commit cleanup source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate runtime ownership and hidden layer chaining'
          git push origin HEAD:refactor/8.0.0-big-cleanup

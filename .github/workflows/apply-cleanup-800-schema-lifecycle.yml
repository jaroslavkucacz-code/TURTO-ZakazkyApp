name: Apply TURTO CRM 8.0 schema lifecycle cleanup
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths:
      - '.github/workflows/apply-cleanup-800-schema-lifecycle.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Apply tested schema lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat _cleanup800_schema/p0 _cleanup800_schema/p1 > /tmp/schema.patch.gz.b64
          base64 -d /tmp/schema.patch.gz.b64 | gzip -dc > /tmp/schema.patch
          git apply --check /tmp/schema.patch
          git apply /tmp/schema.patch
          rm -rf _cleanup800_schema
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Run schema lifecycle gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py scripts
          python scripts/validate-800-schema-lifecycle.py ZakazkyApp_base_6.1
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-7300-polish.py ZakazkyApp_base_6.1
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1
          python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1
          python scripts/validate-7616-requests-plexus-assets.py ZakazkyApp_base_6.1
          python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
          python scripts/validate-769-nevoga-rich-description.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          env -u DISPLAY python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          rm -f runtime-audit.json
      - name: Commit schema lifecycle consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/apply-cleanup-800-schema-lifecycle.yml
          rm -f runtime-audit.json
          git add -A
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate schema migrations'
          git push origin HEAD:refactor/8.0.0-big-cleanup

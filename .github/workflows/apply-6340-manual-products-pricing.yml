name: Apply TURTO CRM 6.3.40 source update

on:
  push:
    branches:
      - feature/6.3.40-manual-products-context-pricing
    paths:
      - .github/workflows/apply-6340-manual-products-pricing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Reconstruct implementation payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turto6340
          cat scripts/.6340_payload_00.b64 scripts/.6340_payload_01.b64 | base64 -d > /tmp/turto6340/payload.tar.gz
          tar -xzf /tmp/turto6340/payload.tar.gz -C /tmp/turto6340
          install -m 0644 /tmp/turto6340/pricing_profiles.py ZakazkyApp_base_6.1/price_lists_domain/platform/pricing_profiles.py
          install -m 0644 /tmp/turto6340/apply_6340_local.py scripts/apply-6340-manual-products-pricing.py
          install -m 0644 /tmp/turto6340/scripts/validate-6340-manual-products-pricing.py scripts/validate-6340-manual-products-pricing.py

      - name: Apply source changes
        run: python scripts/apply-6340-manual-products-pricing.py .

      - name: Preserve previous platform compatibility marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ZakazkyApp_base_6.1/price_lists_domain/platform/__init__.py')
          text = path.read_text(encoding='utf-8')
          current = '    module._turto_platform_v6340 = True'
          previous = '    module._turto_platform_v6339 = True'
          if previous not in text:
              if current not in text:
                  raise SystemExit('6.3.40 platform marker not found')
              text = text.replace(current, previous + '\n' + current, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Keep catalog readable during additive migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ZakazkyApp_base_6.1/price_lists_domain/platform/product_workspace.py')
          text = path.read_text(encoding='utf-8')
          select_anchor = '    select_sql = """SELECT cp.id,cp.active,cp.category_id,cp.subgroup_id,'
          if select_anchor not in text:
              raise SystemExit('catalog select anchor not found')
          schema_block = (
              "    with M.db() as _schema_con:\n"
              "        _catalog_columns = {\n"
              "            str(row[1]) for row in _schema_con.execute(\"PRAGMA table_info(catalog_products)\")\n"
              "        }\n"
              "    _manual_price_sql = (\n"
              "        \"nullif(cp.manual_purchase_price,0)\"\n"
              "        if \"manual_purchase_price\" in _catalog_columns else \"NULL\"\n"
              "    )\n"
              "    _manual_currency_sql = (\n"
              "        \"nullif(trim(cp.manual_purchase_currency),'')\"\n"
              "        if \"manual_purchase_currency\" in _catalog_columns else \"NULL\"\n"
              "    )\n"
              "    select_sql = f\"\"\"SELECT cp.id,cp.active,cp.category_id,cp.subgroup_id,"
          )
          text = text.replace(select_anchor, schema_block, 1)
          price_old = 'nullif(cp.manual_purchase_price,0)) current_price,'
          currency_old = "nullif(trim(cp.manual_purchase_currency),''),'CZK') current_currency"
          if price_old not in text or currency_old not in text:
              raise SystemExit('manual price fallback anchors not found')
          text = text.replace(price_old, '{_manual_price_sql}) current_price,', 1)
          text = text.replace(currency_old, "{_manual_currency_sql},'CZK') current_currency", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source and compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1
          python scripts/validate-6334-product-catalog.py ZakazkyApp_base_6.1
          python scripts/validate-6335-product-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6336-commercial-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.6340_payload_00.b64 scripts/.6340_payload_01.b64
          rm -f scripts/apply-6340-manual-products-pricing.py
          rm -f .github/workflows/apply-6340-manual-products-pricing.yml
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add manual products and contextual customer pricing"
          git push origin HEAD:feature/6.3.40-manual-products-context-pricing

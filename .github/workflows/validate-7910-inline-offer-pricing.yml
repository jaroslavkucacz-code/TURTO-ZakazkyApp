name: Validate TURTO CRM 7.9.1 inline offer pricing
on:
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/price_lists_domain/issued_offers/**'
      - 'ZakazkyApp_base_6.1/runtime_bootstrap.py'
      - 'scripts/validate-7910-offer-workspace-inline-pricing.py'
      - 'release_version.txt'
      - '.github/workflows/validate-7910-inline-offer-pricing.yml'
  push:
    branches: [main]
    paths:
      - 'ZakazkyApp_base_6.1/price_lists_domain/issued_offers/**'
      - 'ZakazkyApp_base_6.1/runtime_bootstrap.py'
      - 'scripts/validate-7910-offer-workspace-inline-pricing.py'
      - 'release_version.txt'
permissions:
  contents: read
jobs:
  inline-pricing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TURTO_DISABLE_AUTO_UPDATE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile changed runtime
        run: python -m compileall -q ZakazkyApp_base_6.1/price_lists_domain/issued_offers/inline_pricing_workspace.py ZakazkyApp_base_6.1/runtime_bootstrap.py scripts/validate-7910-offer-workspace-inline-pricing.py
      - name: Previous issued-offer compatibility
        run: |
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1
          python scripts/validate-7900-corporate-templates.py ZakazkyApp_base_6.1
      - name: Real Linux workspace test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 120s xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          timeout 120s xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/validate-7910-offer-workspace-inline-pricing.py ZakazkyApp_base_6.1
      - name: Real Windows workspace test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-7910-offer-workspace-inline-pricing.py ZakazkyApp_base_6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Repair 7.9.2 test harness contracts
on:
  push:
    branches: [fix/7.9.2-customer-pdf-and-dialogs]
    paths: [.github/workflows/repair-792-tests.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/7.9.2-customer-pdf-and-dialogs
      - name: Apply exact test-harness corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('scripts')
          def change(name,old,new):
              p=root/name;s=p.read_text(encoding='utf-8')
              assert s.count(old)==1,(name,old)
              p.write_text(s.replace(old,new),encoding='utf-8')
          change('validate-7100-commercial-cleanup.py', '    assert "import v710_cleanup" in real_ui\n    assert "v710_cleanup.apply(app)" in real_ui', '    import runtime_bootstrap\n    assert "runtime_bootstrap.apply_all(app)" in real_ui\n    assert "v710_cleanup" in runtime_bootstrap.LATE_LAYERS')
          change('validate-7200-visual-issued-offers.py', '    assert "v720_visual_offer.apply(app)" in real_ui', '    import runtime_bootstrap\n    assert "runtime_bootstrap.apply_all(app)" in real_ui\n    assert "v720_visual_offer" in runtime_bootstrap.LATE_LAYERS')
          change('validate-7400-issued-pricing-columns.py', '    class Module:\n', '''    class ClosingConnection(sqlite3.Connection):
                  def __exit__(self, *args):
                      try:
                          return super().__exit__(*args)
                      finally:
                          self.close()
          
              class Module:
          ''')
          change('validate-7400-issued-pricing-columns.py','con = sqlite3.connect(self.DB)', 'con = sqlite3.connect(self.DB, factory=ClosingConnection)')
          change('validate-792-customer-output.py','\n\ndef main():', '''\n\ndef normalized_pdf_text(value):
              # Calibri's PDF ToUnicode may map an ASCII hyphen to U+2010 and spaces to
              # NBSP on Windows. Normalize typography only; keep every number and label.
              return value.translate(str.maketrans({'\\u2010':'-', '\\u2011':'-', '\\u00a0':' ', '\\u202f':' '}))
          
          
          def main():''')
          change('validate-792-customer-output.py', "text='\\n'.join(p.get_text() for p in pdf)", "text=normalized_pdf_text('\\n'.join(p.get_text() for p in pdf))")
          change('validate-792-customer-output.py', "bounds=pdf[0].search_for('CN26-00042');assert len(bounds)==1 and bounds[0].y1<90,bounds", "bounds=[fitz.Rect(word[:4]) for word in pdf[0].get_text('words')\n                    if normalized_pdf_text(word[4])=='CN26-00042']\n            assert len(bounds)==1 and bounds[0].y1<90,bounds")
          change('validate-792-customer-output.py', "assert page.get_text().count('CN26-00042')==1", "assert normalized_pdf_text(page.get_text()).count('CN26-00042')==1")
          change('validate-7900-runtime-integration.py', "    workspace=sys.argv[sys.argv.index('--worker')+1]", '''    import faulthandler
              faulthandler.dump_traceback_later(30, repeat=True)
              workspace=sys.argv[sys.argv.index('--worker')+1]''')
          change('validate-7900-runtime-integration.py', '        M.messagebox.showinfo=lambda *a,**kw:None', '''        M.messagebox.showinfo=lambda *a,**kw:None
                  # An unexpected modal question must fail the test, not hang CI unseen.
                  def unexpected_question(*args, **kwargs):
                      errors.append("Unexpected confirmation: " + repr(args))
                      print(errors[-1], file=sys.stderr, flush=True)
                      return False
                  M.messagebox.askyesno=unexpected_question''')
          change('validate-7900-runtime-integration.py', '                        controller.save();controller.close();return', '''                        controller.save()
                                  if errors:
                                      controller.win.destroy()
                                      return
                                  controller.close()
                                  if controller.win.winfo_exists():
                                      errors.append("Template did not close: " + controller.status.get())
                                      controller.win.destroy()
                                  return''')
          expected={
            'validate-7100-commercial-cleanup.py':'94e955f9879ccdeaa7e629c6154dba00840f2d9ba7453ccc7fecd85991d07f02',
            'validate-7200-visual-issued-offers.py':'aee9c23e788be3c2c531e4c836ca91b16c71f92b058e9cd99d461efb39bf1ad3',
            'validate-7400-issued-pricing-columns.py':'9107e3eae61935e26924d738fbc9fe55af2ad498448472a17d13905b7034751f',
            'validate-7900-runtime-integration.py':'e3b2828839b181fdf58efb031519324173e1a5b474029827fb9134482271e4e5',
            'validate-792-customer-output.py':'cb5324a2a8b7e0ffe59d0b807a7c61c4afc5dd20692879ac87f25211c597b005'}
          for name,wanted in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==wanted,(name,actual,wanted)
          PY
          python -m compileall -q scripts
      - name: Commit harness changes and remove this temporary workflow
        run: |
          git rm .github/workflows/repair-792-tests.yml
          git add -u scripts
          git diff --cached --check
          git config user.name 'TURTO Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Use canonical bootstrap contracts, close test DBs and normalize PDF glyphs on Windows'
          git push origin HEAD:fix/7.9.2-customer-pdf-and-dialogs

name: Validate TURTO CRM 8.0 architecture cleanup
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/**'
      - 'post_baseline.py'
      - 'scripts/audit-runtime-overrides.py'
      - 'scripts/validate-767-offer-reprocess-images.py'
      - 'scripts/validate-771-runtime-bootstrap-stability.py'
      - 'ARCHITECTURE_AUDIT_8.0.md'
      - '.github/workflows/validate-800-architecture.yml'
permissions:
  contents: read
jobs:
  architecture:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile runtime
        run: python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py scripts
      - name: Architecture ownership guard
        run: python scripts/audit-runtime-overrides.py . --check
      - name: Reprocess compatibility
        run: python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
      - name: Bootstrap stability contract
        run: python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1

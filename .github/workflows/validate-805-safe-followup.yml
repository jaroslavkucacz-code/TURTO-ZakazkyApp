name: Validate TURTO CRM 8.0.5 safe follow-up

on:
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/idle_cleanup_804.py'
      - 'scripts/validate-804-same-user-startup.py'
      - '.github/workflows/validate-805-safe-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile changed runtime
        run: |
          python -m compileall -q \
            ZakazkyApp_base_6.1/price_lists_domain/platform/idle_cleanup_804.py \
            scripts/validate-804-same-user-startup.py
      - name: Validate same-user startup fast path
        run: python scripts/validate-804-same-user-startup.py ZakazkyApp_base_6.1

name: Apply TURTO CRM 7.4 integration

on:
  push:
    branches:
      - feature/7.4.0-issued-pricing-columns-ui-consistency
    paths:
      - .github/workflows/apply-7400-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Reconstruct and apply reviewed 7.4 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import zlib

          root = pathlib.Path('scripts/_tmp740')
          parts = sorted(root.glob('patch_*.txt'))
          if not parts:
              raise SystemExit('Staged 7.4 patch payload was not found')
          encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          source = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          source = source.replace(
              'assert not callback_errors, "\\n".join(callback_errors)',
              'assert not callback_errors, "\\\\n".join(callback_errors)',
          )
          pathlib.Path('/tmp/apply_7400.py').write_text(source, encoding='utf-8')
          PY
          python /tmp/apply_7400.py

      - name: Compile source
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py

      - name: Validate 7.4 and commercial regressions
        shell: bash
        run: |
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7300-polish.py ZakazkyApp_base_6.1
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Ensure virtual display
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Validate composed Tk application
        run: timeout 180s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            ZakazkyApp_base_6.1/ZakazkyCRM.pyw \
            ZakazkyApp_base_6.1/v740_offer_defaults.py \
            scripts/validate-7400-issued-pricing-columns.py \
            scripts/validate-7300-polish.py \
            scripts/validate-real-ui.py \
            scripts/publish-update.sh \
            release_version.txt release_notes.txt
          git diff --cached --check
          git commit -m "TURTO CRM 7.4.0 — pricing defaults and uniform table controls"
          git push origin HEAD:feature/7.4.0-issued-pricing-columns-ui-consistency

# retry with escaped source pattern

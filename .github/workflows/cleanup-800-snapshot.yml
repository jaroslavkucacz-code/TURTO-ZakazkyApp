name: Cleanup 8.0 source snapshot
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: [.github/workflows/cleanup-800-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-800-source
          include-hidden-files: true
          path: |
            ZakazkyApp_base_6.1/
            scripts/
            .github/workflows/
            release_version.txt
            release_notes.txt
            post_baseline.py
            ARCHITECTURE_AUDIT_7.7.md
          retention-days: 3

name: Diagnose TURTO CRM 8.0.4 dashboard palette overwrite

on:
  pull_request:
    paths:
      - 'scripts/diagnose-804-refresh-palette.py'
      - '.github/workflows/diagnose-804-refresh-palette.yml'
      - 'ZakazkyApp_base_6.1/**'

permissions:
  contents: read

jobs:
  trace-dashboard-palette:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Trace refresh_dash palette writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TURTO_DISABLE_AUTO_UPDATE = '1'
          $env:TURTO_CRM_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'turto-804-palette-trace-data'
          python scripts/diagnose-804-refresh-palette.py

name: Offer template source workbench
on:
  push:
    branches: [feature/7.9.0-editable-standard-offer]
    paths: [.github/workflows/template-790-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: template-790-baseline
          path: |
            post_baseline.py
            ARCHITECTURE_AUDIT_7.7.md
          retention-days: 2

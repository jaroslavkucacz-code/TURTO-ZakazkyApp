name: Diagnose 8.0.6 cleanup source snapshot
on:
  push:
    branches: [cleanup-806-menu-lifecycle]
    paths: [.github/workflows/diagnose-806-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: TURTO-806-cleanup-source-snapshot
          path: |
            ZakazkyApp_base_6.1/**/*.py
            ZakazkyApp_base_6.1/*.pyw
            ZakazkyApp_base_6.1/requirements.txt
            ZakazkyApp_base_6.1/turto_logo.*
            scripts/*.py
            .github/workflows/*.yml
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

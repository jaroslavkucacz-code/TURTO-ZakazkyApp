name: Validate TURTO CRM 8.0 Windows installer

on:
  workflow_dispatch:
  push:
    branches: [hotfix-808-updater-safety, feature/8.0.9-new-turto-logo, fix/8.0.10-transparent-branding, fix/8.0.11-taskbar-icon, feature/8.0.12-manual-update-progress, feature/8.0.13-remove-quick-actions, fix/8.0.14-table-initial-layout, feature/8.0.15-persistent-table-layouts, fix/8.0.16-autocomplete-focus, feature/8.0.17-form-navigation-unsaved, feature/8.0.18-large-dialogs, fix/8.0.19-dialog-first-show, feature/8.0.20-calm-theme, feature/8.0.21-universal-search, fix/8.0.22-filter-highlights-separators, feature/8.0.23-issued-delete-project-activity, feature/8.0.24-received-offer-detail, feature/8.0.25-offer-request-received]
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/price_lists_domain/platform/offer_request_receipt.py
      - ZakazkyApp_base_6.1/v621_prices.py
      - ZakazkyApp_base_6.1/v633_offerassign_deadlines.py
      - ZakazkyApp_base_6.1/v637_project_offer_model.py
      - scripts/validate-825-offer-request-receipt.py
      - ZakazkyApp_base_6.1/updater_safety.py
      - ZakazkyApp_base_6.1/update_progress.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/automatic_updates.py
      - scripts/validate-auto-update.py
      - scripts/validate-812-update*.py
      - scripts/validate-823-issued-delete-activity.py
      - scripts/validate-824-received-offer-detail.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/received_item_labels.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/project_activity.py
      - scripts/validate-822-filter-presentation.py
      - scripts/validate-821-universal-search.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/universal_search.py
      - scripts/validate-820-calm-theme.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/calm_theme_820.py
      - scripts/validate-819-dialog-first-show.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/dialog_presentation_819.py
      - scripts/validate-818-dialog-size.py
      - ZakazkyApp_base_6.1/dialog_chrome.py
      - ZakazkyApp_base_6.1/v770_runtime_policy.py
      - scripts/validate-817-form-behavior-ui.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/form_behavior_817.py
      - scripts/validate-816-autocomplete-ui.py
      - scripts/validate-814-table-layout-ui.py
      - scripts/validate-815-table-preferences*.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/table_preferences_815.py
      - ZakazkyApp_base_6.1/v760_table_activity_performance.py
      - ZakazkyApp_base_6.1/v710_cleanup.py
      - ZakazkyApp_base_6.1/v644_default_date_sort.py
      - ZakazkyApp_base_6.1/data_location.py
      - ZakazkyApp_base_6.1/data_onboarding.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
      - build/windows/**
      - ZakazkyApp_base_6.1/windows_branding.py
      - scripts/validate-811-taskbar.py
      - ZakazkyApp_base_6.1/branding.py
      - ZakazkyApp_base_6.1/turto_logo.*
      - ZakazkyApp_base_6.1/turto_icon.png
      - scripts/validate-809-branding*.py
      - scripts/*808*
      - scripts/validate-800-installation.py
      - scripts/validate-800-updater-transaction.py
      - .github/workflows/validate-800-windows-installer.yml

permissions:
  contents: read

concurrency:
  group: turto-installer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Behavioral source regressions on Linux
        run: |
          python scripts/validate-800-updater-transaction.py
          python scripts/validate-808-handshake.py
          python scripts/validate-auto-update.py
          python scripts/validate-812-update-progress.py
          python scripts/validate-815-table-preferences.py
          python scripts/validate-821-universal-search.py --source-only
          python scripts/validate-822-filter-presentation.py --source-only
          python scripts/validate-823-issued-delete-activity.py --source-only
          python scripts/validate-824-received-offer-detail.py --source-only
          python scripts/validate-825-offer-request-receipt.py --source-only

  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Validate installer architecture and real Windows updater semantics
        shell: pwsh
        run: |
          python scripts/validate-800-installation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-800-updater-transaction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-808-handshake.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-auto-update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-812-update-progress.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-812-update-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-823-issued-delete-activity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-824-received-offer-detail.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-825-offer-request-receipt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-822-filter-presentation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-821-universal-search.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-820-calm-theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-819-dialog-first-show.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-818-dialog-size.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-817-form-behavior-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-816-autocomplete-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-814-table-layout-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-815-table-preferences.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-815-table-preferences-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive received offer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-received-offer-preview
          path: build/validation/received-824/
          if-no-files-found: ignore
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Validate company artwork and real UI in both themes
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $failed = $false
          foreach ($validation in @('scripts/validate-803-icon-assets.py', 'scripts/validate-809-branding.py', 'scripts/validate-811-taskbar.py', 'scripts/validate-809-branding-ui.py')) {
            python $validation
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Archive branding previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-branding-preview
          path: dist/branding-preview/*.png
          if-no-files-found: warn
      - name: Build onedir application, onedir updater and final installer
        shell: pwsh
        run: ./scripts/build-windows-808.ps1
      - name: Upload Windows preview packages
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installer/TURTO_CRM_Setup_*.exe
            dist/TURTO_CRM_Update_*.zip
            dist/latest-windows.preview.json
      - name: Archive exact updater test sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-updater-sources
          retention-days: 14
          path: |
            build/windows/updater_800.pyw
            build/windows/TURTO_CRM_Updater.spec
            ZakazkyApp_base_6.1/updater_safety.py
            ZakazkyApp_base_6.1/update_progress.py
            ZakazkyApp_base_6.1/price_lists_domain/platform/automatic_updates.py
            scripts/validate-auto-update.py
            scripts/validate-812-update*.py
            ZakazkyApp_base_6.1/data_location.py
            ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
            scripts/*808*
            scripts/validate-800-updater-transaction.py

  clean-install-smoke:
    name: clean-install-smoke
    needs: build-windows-preview
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          path: package
      - name: Cold frozen runtime first start and Frozen updater integration
        shell: pwsh
        run: |
          python -m pip install Pillow pywin32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-windows-808.py package
      - name: Archive frozen validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-smoke-report
          if-no-files-found: warn
          path: dist/808-smoke-report.json

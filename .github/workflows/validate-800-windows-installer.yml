name: Validate TURTO CRM 8.0 Windows installer

on:
  workflow_dispatch:
  push:
    # Complete branch validation is also required before promoting Windows releases.
    branches: [hotfix-808-updater-safety, feature/8.0.9-new-turto-logo, fix/8.0.10-transparent-branding, fix/8.0.11-taskbar-icon, feature/8.0.12-manual-update-progress, feature/8.0.13-remove-quick-actions, fix/8.0.14-table-initial-layout, feature/8.0.15-persistent-table-layouts, fix/8.0.16-autocomplete-focus, feature/8.0.17-form-navigation-unsaved, feature/8.0.18-large-dialogs, fix/8.0.19-dialog-first-show, feature/8.0.20-calm-theme, feature/8.0.21-universal-search, fix/8.0.22-filter-highlights-separators, feature/8.0.23-issued-delete-project-activity, feature/8.0.24-received-offer-detail, feature/8.0.25-offer-request-received, feature/8.0.26-grouped-navigation, feature/8.0.27-work-processing-catalogs, feature/8.0.28-company-roles-orders, feature/8.0.29-request-mail-profiles, feature/8.0.30-backup-retention, fix/8.0.31-legacy-backup-cleanup, feature/8.0.32-monthly-reports, feature/8.0.33-request-assignees-company-links, feature/8.0.34-user-permissions-assignees, feature/crm-map, codex/online-gps-parcels, codex/map-orthophoto, codex/map-company-layout, codex/mivo-offers-layout, codex/portfolio-tasks-mail, codex/portfolio-contacts-centers, codex/portfolio-row-details, fix/outlook-sent-reconciliation, feature/8.0.44-offer-workspace, feature/8.0.45-pdf-pricing-rows, fix/settings-vector-offers]
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/price_lists_domain/maps/**
      - scripts/validate-835-map.py
      - scripts/validate-836-online-map.py
      - scripts/validate-837-basemaps.py
      - scripts/validate-837-map-renderer.js
      - scripts/validate-838-company-layout.py
      - scripts/validate-839-mail-offers.py
      - scripts/validate-840-portfolios-tasks-mail.py
      - scripts/validate-841-centers-contacts.py
      - scripts/validate-842-portfolio-details.py
      - scripts/validate-843-mail-selection.py
      - scripts/validate-845-pdf-rows.py
      - scripts/validate-settings-vector-pdf.py
      - scripts/validate-subgroup-templates.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/**
      - scripts/validate-844-offer-workspace.py
      - scripts/validate-840-outlook.ps1
      - ZakazkyApp_base_6.1/price_lists_domain/platform/mail_tracking*.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/outlook_tracking.ps1
      - scripts/build-map-host.py
      - ZakazkyApp_base_6.1/price_lists_domain/monthly_reports/**
      - scripts/validate-832-monthly-reports.py
      - scripts/validate-833-company-links.py
      - scripts/validate-834-user-access.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/*access*.py
      - scripts/reporting_832_import_tests.py
      - ZakazkyApp_base_6.1/storage_maintenance.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/storage_ui.py
      - scripts/validate-830-storage.py
      - scripts/validate-831-legacy-backups.py
      - ZakazkyApp_base_6.1/storage_windows.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/request_mail.py
      - scripts/validate-829-request-mail.py
      - ZakazkyApp_base_6.1/price_lists_domain/received_orders/**
      - ZakazkyApp_base_6.1/price_lists_domain/platform/company_roles.py
      - scripts/validate-828-company-roles-orders.py
      - ZakazkyApp_base_6.1/app.py
      - ZakazkyApp_base_6.1/v618_inputfix.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/action_assignees.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/catalog_selection.py
      - scripts/validate-827-processing-catalogs.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/grouped_navigation.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/lazy_refresh.py
      - scripts/validate-826-grouped-navigation.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/offer_request_receipt.py
      - ZakazkyApp_base_6.1/v621_prices.py
      - ZakazkyApp_base_6.1/v633_offerassign_deadlines.py
      - ZakazkyApp_base_6.1/v637_project_offer_model.py
      - scripts/validate-825-offer-request-receipt.py
      - ZakazkyApp_base_6.1/updater_safety.py
      - ZakazkyApp_base_6.1/update_progress.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/automatic_updates.py
      - scripts/validate-auto-update.py
      - scripts/validate-812-update*.py
      - scripts/validate-823-issued-delete-activity.py
      - scripts/validate-824-received-offer-detail.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/received_item_labels.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/project_activity.py
      - scripts/validate-822-filter-presentation.py
      - scripts/validate-821-universal-search.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/universal_search.py
      - scripts/validate-820-calm-theme.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/calm_theme_820.py
      - scripts/validate-819-dialog-first-show.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/dialog_presentation_819.py
      - scripts/validate-818-dialog-size.py
      - ZakazkyApp_base_6.1/dialog_chrome.py
      - ZakazkyApp_base_6.1/v770_runtime_policy.py
      - scripts/validate-817-form-behavior-ui.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/form_behavior_817.py
      - scripts/validate-816-autocomplete-ui.py
      - scripts/validate-814-table-layout-ui.py
      - scripts/validate-815-table-preferences*.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/table_preferences_815.py
      - ZakazkyApp_base_6.1/v760_table_activity_performance.py
      - ZakazkyApp_base_6.1/v710_cleanup.py
      - ZakazkyApp_base_6.1/v644_default_date_sort.py
      - ZakazkyApp_base_6.1/data_location.py
      - ZakazkyApp_base_6.1/data_onboarding.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
      - build/windows/**
      - ZakazkyApp_base_6.1/windows_branding.py
      - scripts/validate-811-taskbar.py
      - ZakazkyApp_base_6.1/branding.py
      - ZakazkyApp_base_6.1/turto_logo.*
      - ZakazkyApp_base_6.1/turto_icon.png
      - scripts/validate-809-branding*.py
      - scripts/*808*
      - scripts/validate-800-installation.py
      - scripts/validate-800-updater-transaction.py
      - .github/workflows/validate-800-windows-installer.yml

permissions:
  contents: read

concurrency:
  group: turto-installer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Behavioral source regressions on Linux
        run: |
          python -m pip install XlsxWriter 'pyproj>=3.7,<4' PyMuPDF
          python scripts/validate-845-pdf-rows.py
          python scripts/validate-settings-vector-pdf.py
          python scripts/validate-subgroup-templates.py
          python scripts/validate-844-offer-workspace.py --source-only
          python scripts/validate-843-mail-selection.py --source-only
          python scripts/validate-841-centers-contacts.py --source-only
          python scripts/validate-840-portfolios-tasks-mail.py --source-only
          python scripts/validate-837-basemaps.py --source-only
          python scripts/validate-836-online-map.py --source-only
          python scripts/validate-835-map.py --source-only
          python scripts/validate-834-user-access.py --source-only
          python scripts/validate-833-company-links.py --source-only
          python scripts/validate-832-monthly-reports.py --source-only
          python scripts/validate-830-storage.py --source-only
          python scripts/validate-831-legacy-backups.py
          python scripts/validate-800-updater-transaction.py
          python scripts/validate-808-handshake.py
          python scripts/validate-auto-update.py
          python scripts/validate-812-update-progress.py
          python scripts/validate-815-table-preferences.py
          python scripts/validate-821-universal-search.py --source-only
          python scripts/validate-822-filter-presentation.py --source-only
          python scripts/validate-823-issued-delete-activity.py --source-only
          python scripts/validate-824-received-offer-detail.py --source-only
          python scripts/validate-825-offer-request-receipt.py --source-only
          python scripts/validate-826-grouped-navigation.py --source-only
          python scripts/validate-829-request-mail.py --source-only
          python scripts/validate-828-company-roles-orders.py --source-only
          python scripts/validate-827-processing-catalogs.py --source-only

  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Validate offer workspace, directory actions, search and synchronized scroll
        shell: pwsh
        timeout-minutes: 6
        run: |
          python scripts/validate-845-pdf-rows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-844-offer-workspace.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-7900-corporate-templates.py ZakazkyApp_base_6.1
      - name: Archive offer workspace previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-workspace-844-preview
          path: build/validation/workspace-844/
          if-no-files-found: ignore
      - name: Validate small settings windows and selectable vector stationery
        shell: pwsh
        timeout-minutes: 3
        run: |
          python scripts/validate-settings-vector-pdf.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-settings-vector-pdf.py --ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive settings and vector PDF previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-settings-vector-preview
          path: build/validation/settings-vector/
          if-no-files-found: ignore
      - name: Validate subgroup columns and interactive template preview
        shell: pwsh
        timeout-minutes: 4
        run: |
          python scripts/validate-subgroup-templates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-subgroup-templates.py --ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive subgroup template previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-subgroup-template-preview
          path: build/validation/subgroup-templates/
          if-no-files-found: ignore
      - name: Validate selected Outlook checks and portfolio controls
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/validate-843-mail-selection.py
      - name: Archive selected mail checks and portfolio controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-mail-843-preview
          path: build/validation/mail-843/
          if-no-files-found: ignore
      - name: Validate portfolio hierarchy, details and context menus
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/validate-842-portfolio-details.py
      - name: Archive portfolio hierarchy and menus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-portfolio-842-preview
          path: build/validation/portfolio-842/
          if-no-files-found: ignore
      - name: Validate dated centers and inline portfolio contacts
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/validate-841-centers-contacts.py
      - name: Archive dated centers and contact previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-portfolio-841-preview
          path: build/validation/portfolio-841/
          if-no-files-found: ignore
      - name: Build pinned embedded map host
        shell: pwsh
        run: python scripts/build-map-host.py
      - name: Validate canonical map data and real embedded Windows map
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/validate-835-map.py
      - name: Validate online addresses, parcel preview and selected batches
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/validate-836-online-map.py
      - name: Validate map and live orthophoto switching
        shell: pwsh
        timeout-minutes: 5
        run: python scripts/validate-837-basemaps.py
      - name: Validate collapsed company details and read-only controls
        shell: pwsh
        timeout-minutes: 3
        run: python scripts/validate-838-company-layout.py
      - name: Validate MIVO mail and received offer controls
        shell: pwsh
        timeout-minutes: 3
        run: python scripts/validate-839-mail-offers.py
      - name: Archive MIVO mail and received offer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-mail-offers-preview
          path: build/validation/mail-offers-839/
          if-no-files-found: ignore
      - name: Validate portfolios, private tasks and Outlook evidence
        shell: pwsh
        timeout-minutes: 4
        run: |
          python scripts/validate-840-portfolios-tasks-mail.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/validate-840-outlook.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive portfolio, private task and mail previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-portfolio-840-preview
          path: build/validation/portfolio-840/
          if-no-files-found: ignore
      - name: Validate installer architecture and real Windows updater semantics
        shell: pwsh
        run: |
          python scripts/validate-834-user-access.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-833-company-links.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-832-monthly-reports.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-830-storage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-831-legacy-backups.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-800-installation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-800-updater-transaction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-808-handshake.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-auto-update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-812-update-progress.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-812-update-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-829-request-mail.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-816-autocomplete-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-828-company-roles-orders.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-827-processing-catalogs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-823-issued-delete-activity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-824-received-offer-detail.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-826-grouped-navigation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-825-offer-request-receipt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-822-filter-presentation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-821-universal-search.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-820-calm-theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-819-dialog-first-show.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-818-dialog-size.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-817-form-behavior-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-814-table-layout-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-815-table-preferences.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-815-table-preferences-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive embedded map previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-map-preview
          path: |
            build/validation/map-835/
            build/validation/online-map-836/
            build/validation/basemaps-837/
            build/validation/layout-838/
          if-no-files-found: ignore
      - name: Archive user permissions previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-user-access-preview
          path: build/validation/user-access-834/
          if-no-files-found: ignore
      - name: Archive company matching previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-company-links-preview
          path: build/validation/company-links-833/
          if-no-files-found: ignore
      - name: Archive embedded reporting previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-reporting-preview
          path: build/validation/reports-832/
          if-no-files-found: ignore
      - name: Archive grouped navigation previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-grouped-navigation-preview
          path: build/validation/navigation-826/
          if-no-files-found: ignore
      - name: Archive received offer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-received-offer-preview
          path: build/validation/received-824/
          if-no-files-found: ignore
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Validate company artwork and real UI in both themes
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $failed = $false
          foreach ($validation in @('scripts/validate-803-icon-assets.py', 'scripts/validate-809-branding.py', 'scripts/validate-811-taskbar.py', 'scripts/validate-809-branding-ui.py')) {
            python $validation
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Archive branding previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-branding-preview
          path: dist/branding-preview/*.png
          if-no-files-found: warn
      - name: Build onedir application, onedir updater and final installer
        shell: pwsh
        run: ./scripts/build-windows-808.ps1
      - name: Upload Windows preview packages
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installer/TURTO_CRM_Setup_*.exe
            dist/TURTO_CRM_Update_*.zip
            dist/latest-windows.preview.json
      - name: Archive exact updater test sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-updater-sources
          retention-days: 14
          path: |
            build/windows/updater_800.pyw
            build/windows/TURTO_CRM_Updater.spec
            ZakazkyApp_base_6.1/updater_safety.py
            ZakazkyApp_base_6.1/update_progress.py
            ZakazkyApp_base_6.1/price_lists_domain/platform/automatic_updates.py
            scripts/validate-auto-update.py
            scripts/validate-812-update*.py
            ZakazkyApp_base_6.1/data_location.py
            ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
            scripts/*808*
            scripts/validate-800-updater-transaction.py

  clean-install-smoke:
    name: clean-install-smoke
    needs: build-windows-preview
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          path: package
      - name: Cold frozen runtime first start and Frozen updater integration
        shell: pwsh
        run: |
          python -m pip install Pillow pywin32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-windows-808.py package
      - name: Archive frozen validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-smoke-report
          if-no-files-found: warn
          path: dist/808-smoke-report.json

name: Validate TURTO CRM 8.0 Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/data_location.py
      - ZakazkyApp_base_6.1/data_onboarding.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/category_event_compat_800.py
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - build/windows/**
      - scripts/validate-800-installation.py
      - .github/workflows/validate-800-windows-installer.yml

permissions:
  contents: read

jobs:
  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Validate installer and data-location architecture
        shell: pwsh
        run: python scripts/validate-800-installation.py

      - name: Build TURTO CRM onedir application
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/windows/TURTO_CRM.spec

      - name: Build console diagnostic frozen application
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/windows/TURTO_CRM_Diagnostic.spec

      - name: Build one-file updater
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/windows/TURTO_CRM_Updater.spec

      - name: Assemble Windows payload
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          Copy-Item 'dist/TURTO CRM Updater.exe' 'dist/TURTO CRM/TURTO CRM Updater.exe' -Force
          $manifest = [ordered]@{
            version = $version
            channel = 'windows'
            build = 'preview'
          } | ConvertTo-Json
          Set-Content -Path 'dist/TURTO CRM/version.json' -Value $manifest -Encoding utf8
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM.exe')) { throw 'Main EXE missing' }
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM Updater.exe')) { throw 'Updater EXE missing' }

          $stage = "dist/TURTO_CRM_$version"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist/TURTO CRM' $stage -Recurse
          $updateZip = "dist/TURTO_CRM_Update_$version.zip"
          Remove-Item $updateZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath $updateZip -CompressionLevel Optimal

      - name: Run console diagnostic frozen startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP 'turto-crm-diagnostic-data'
          $diagnosticResult = Join-Path $env:RUNNER_TEMP 'turto-crm-diagnostic-smoke.json'
          Remove-Item $diagnosticRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $diagnosticResult -Force -ErrorAction SilentlyContinue
          $env:TURTO_CRM_DATA_ROOT = $diagnosticRoot
          $env:TURTO_CRM_SMOKE_RESULT = $diagnosticResult
          $env:TURTO_DISABLE_AUTO_UPDATE = '1'
          $diagnosticExe = (Resolve-Path 'dist/TURTO CRM Diagnostic/TURTO CRM Diagnostic.exe').Path
          & $diagnosticExe --smoke-test
          $code = $LASTEXITCODE
          if (Test-Path $diagnosticResult) {
            Write-Host '--- diagnostic frozen checkpoint ---'
            Get-Content $diagnosticResult -Raw | Write-Host
            Write-Host '------------------------------------'
          }
          if ($code -ne 0) { throw "Diagnostic frozen startup failed with exit code $code" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user setup package
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after Inno Setup installation.' }
          & $iscc "/DMyAppVersion=$version" 'build/windows/TURTO_CRM.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify produced packages
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $setup = "dist/installer/TURTO_CRM_Setup_$version.exe"
          $updateZip = "dist/TURTO_CRM_Update_$version.zip"
          if (-not (Test-Path $setup)) { throw 'Installer missing' }
          if (-not (Test-Path $updateZip)) { throw 'Update ZIP missing' }
          Get-FileHash $setup -Algorithm SHA256
          Get-FileHash $updateZip -Algorithm SHA256

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $updateZip))
          try {
            $forbidden = @($archive.Entries | Where-Object {
              $_.FullName -match '(?i)\.(db|sqlite|sqlite3|py|pyw)$' -or
              $_.FullName -match '(?i)(requirements\.txt|Spustit_Zakazky|Nainstalovat_knihovny)'
            })
            if ($forbidden.Count -gt 0) {
              throw ('Windows update payload contains forbidden legacy/data files: ' + (($forbidden | ForEach-Object FullName) -join ', '))
            }
            $names = @($archive.Entries | ForEach-Object FullName)
            if (-not ($names -match 'TURTO CRM\.exe$')) { throw 'Main EXE missing from update ZIP' }
            if (-not ($names -match 'TURTO CRM Updater\.exe$')) { throw 'Updater EXE missing from update ZIP' }
            if (-not ($names -match 'version\.json$')) { throw 'version.json missing from update ZIP' }
          }
          finally {
            $archive.Dispose()
          }

      - name: Smoke-install setup, frozen runtime and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $setup = (Resolve-Path "dist/installer/TURTO_CRM_Setup_$version.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'turto-crm-installed'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'turto-crm-data'
          $smokeResult = Join-Path $env:RUNNER_TEMP 'turto-crm-smoke.json'
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeResult -Force -ErrorAction SilentlyContinue

          function Show-SmokeCheckpoint {
            if (Test-Path $smokeResult) {
              Write-Host '--- frozen runtime checkpoint ---'
              Get-Content $smokeResult -Raw | Write-Host
              Write-Host '---------------------------------'
            }
          }

          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory=$true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [int]$TimeoutSeconds = 90,
              [string]$Label = 'Process'
            )
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
              Show-SmokeCheckpoint
              throw "$Label timed out after $TimeoutSeconds seconds."
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              Show-SmokeCheckpoint
              throw "$Label failed with exit code $($process.ExitCode)."
            }
            return $process
          }

          Invoke-BoundedProcess -FilePath $setup -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installRoot"
          ) -TimeoutSeconds 90 -Label 'Setup smoke install' | Out-Null

          $mainExe = Join-Path $installRoot 'TURTO CRM.exe'
          $updaterExe = Join-Path $installRoot 'TURTO CRM Updater.exe'
          if (-not (Test-Path $mainExe)) { throw 'Installed main EXE missing' }
          if (-not (Test-Path $updaterExe)) { throw 'Installed updater EXE missing' }
          $installedDb = @(Get-ChildItem $installRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object {
            $_.Extension -in '.db', '.sqlite', '.sqlite3'
          })
          if ($installedDb.Count -gt 0) { throw 'Installer incorrectly placed a business database inside the program directory' }

          $env:TURTO_CRM_DATA_ROOT = $dataRoot
          $env:TURTO_CRM_SMOKE_RESULT = $smokeResult
          $env:TURTO_DISABLE_AUTO_UPDATE = '1'
          Invoke-BoundedProcess -FilePath $mainExe -Arguments @('--smoke-test') -TimeoutSeconds 90 -Label 'Frozen runtime smoke test' | Out-Null
          if (-not (Test-Path $smokeResult)) { throw 'Frozen runtime did not create smoke result' }
          $smoke = Get-Content $smokeResult -Raw | ConvertFrom-Json
          if (-not $smoke.ok -or -not $smoke.frozen) { throw "Frozen runtime smoke result is invalid at phase '$($smoke.phase)'" }
          if ($smoke.version -ne $version) { throw "Frozen runtime version mismatch: $($smoke.version) != $version" }
          $database = [string]$smoke.database
          if (-not (Test-Path $database)) { throw 'Frozen runtime did not create the external test database' }
          $hashBefore = (Get-FileHash $database -Algorithm SHA256).Hash

          $uninstaller = Get-ChildItem $installRoot -File -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Inno uninstaller was not created' }
          Invoke-BoundedProcess -FilePath $uninstaller.FullName -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -TimeoutSeconds 90 -Label 'Uninstall smoke test' | Out-Null
          if (Test-Path $mainExe) { throw 'Main EXE remained after uninstall' }
          if (-not (Test-Path $database)) { throw 'Uninstall removed the business database' }
          $hashAfter = (Get-FileHash $database -Algorithm SHA256).Hash
          if ($hashAfter -ne $hashBefore) { throw 'Uninstall modified the business database' }

      - name: Upload frozen smoke checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-smoke-checkpoints
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/turto-crm-smoke.json
            ${{ runner.temp }}/turto-crm-diagnostic-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installer/TURTO_CRM_Setup_*.exe
            dist/TURTO_CRM_Update_*.zip

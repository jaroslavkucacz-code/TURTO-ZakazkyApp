name: Validate TURTO CRM 8.0 Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/data_location.py
      - ZakazkyApp_base_6.1/data_onboarding.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
      - build/windows/**
      - scripts/validate-800-installation.py
      - .github/workflows/validate-800-windows-installer.yml

permissions:
  contents: read

jobs:
  build-windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2

      - name: Validate installer and data-location architecture
        shell: pwsh
        run: python scripts/validate-800-installation.py

      - name: Build TURTO CRM onedir application
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/windows/TURTO_CRM.spec

      - name: Build one-file updater
        shell: pwsh
        run: pyinstaller --noconfirm --clean build/windows/TURTO_CRM_Updater.spec

      - name: Assemble Windows payload
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          Copy-Item 'dist/TURTO CRM Updater.exe' 'dist/TURTO CRM/TURTO CRM Updater.exe' -Force
          $manifest = [ordered]@{
            version = $version
            channel = 'windows'
            build = 'preview'
          } | ConvertTo-Json
          Set-Content -Path 'dist/TURTO CRM/version.json' -Value $manifest -Encoding utf8
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM.exe')) { throw 'Main EXE missing' }
          if (-not (Test-Path 'dist/TURTO CRM/TURTO CRM Updater.exe')) { throw 'Updater EXE missing' }

          $stage = "dist/TURTO_CRM_$version"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist/TURTO CRM' $stage -Recurse
          $updateZip = "dist/TURTO_CRM_Update_$version.zip"
          Remove-Item $updateZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath $updateZip -CompressionLevel Optimal

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user setup package
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after Inno Setup installation.' }
          & $iscc "/DMyAppVersion=$version" 'build/windows/TURTO_CRM.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify produced packages
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/version.txt -Raw).Trim()
          if (-not (Test-Path "dist/installer/TURTO_CRM_Setup_$version.exe")) { throw 'Installer missing' }
          if (-not (Test-Path "dist/TURTO_CRM_Update_$version.zip")) { throw 'Update ZIP missing' }
          Get-FileHash "dist/installer/TURTO_CRM_Setup_$version.exe" -Algorithm SHA256
          Get-FileHash "dist/TURTO_CRM_Update_$version.zip" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installer/TURTO_CRM_Setup_*.exe
            dist/TURTO_CRM_Update_*.zip

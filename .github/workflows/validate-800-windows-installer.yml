name: Validate TURTO CRM 8.0 Windows installer

on:
  workflow_dispatch:
  push:
    branches: [hotfix-808-updater-safety, feature/8.0.9-new-turto-logo]
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/updater_safety.py
      - ZakazkyApp_base_6.1/data_location.py
      - ZakazkyApp_base_6.1/data_onboarding.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
      - build/windows/**
      - ZakazkyApp_base_6.1/branding.py
      - ZakazkyApp_base_6.1/turto_logo.*
      - ZakazkyApp_base_6.1/turto_icon.png
      - scripts/validate-809-branding*.py
      - scripts/*808*
      - scripts/validate-800-installation.py
      - scripts/validate-800-updater-transaction.py
      - .github/workflows/validate-800-windows-installer.yml

permissions:
  contents: read

concurrency:
  group: turto-installer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Behavioral source regressions on Linux
        run: |
          python scripts/validate-800-updater-transaction.py
          python scripts/validate-808-handshake.py

  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
          python -m pip install pyinstaller==6.22.2
      - name: Validate installer architecture and real Windows updater semantics
        shell: pwsh
        run: |
          python scripts/validate-800-installation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-800-updater-transaction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-808-handshake.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Validate company artwork and real UI in both themes
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/validate-803-icon-assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-809-branding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-809-branding-ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive branding previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-branding-preview
          path: dist/branding-preview/*.png
          if-no-files-found: warn
      - name: Build onedir application, onedir updater and final installer
        shell: pwsh
        run: ./scripts/build-windows-808.ps1
      - name: Upload Windows preview packages
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installer/TURTO_CRM_Setup_*.exe
            dist/TURTO_CRM_Update_*.zip
            dist/latest-windows.preview.json
      - name: Archive exact updater test sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-updater-sources
          retention-days: 14
          path: |
            build/windows/updater_800.pyw
            build/windows/TURTO_CRM_Updater.spec
            ZakazkyApp_base_6.1/updater_safety.py
            ZakazkyApp_base_6.1/data_location.py
            ZakazkyApp_base_6.1/price_lists_domain/platform/exe_distribution.py
            scripts/*808*
            scripts/validate-800-updater-transaction.py

  clean-install-smoke:
    name: clean-install-smoke
    needs: build-windows-preview
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: TURTO-CRM-8.0-Windows-preview
          path: package
      - name: Cold frozen runtime first start and Frozen updater integration
        shell: pwsh
        run: python scripts/smoke-windows-808.py package
      - name: Archive frozen validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-808-smoke-report
          if-no-files-found: warn
          path: dist/808-smoke-report.json

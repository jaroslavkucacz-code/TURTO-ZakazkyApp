name: Apply TURTO CRM 8.0 App lifecycle consolidation
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-lifecycle-stage3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Migrate earliest App init wrappers to lifecycle hooks
        shell: python
        run: |
          from pathlib import Path
          root = Path('ZakazkyApp_base_6.1')

          def replace(path, old, new):
              p = root / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace('crm_features.py', '''    orig_init=module.App.__init__
              def init(self,*a,**kw):
                  try:module.set_setting("update_source",GITHUB_UPDATE)
                  except Exception:pass
                  return orig_init(self,*a,**kw)
              module.App.__init__=init''', '''    def before_app_init(self, _args, _kwargs):
                  try:module.set_setting("update_source",GITHUB_UPDATE)
                  except Exception:pass
              module.register_app_init_hook("crm_features.update_source", before=before_app_init)''')

          replace('crm_runtime.py', '''    old=module.App.__init__
              def init(self,*a,**k):
                  M._active_app=self
                  r=old(self,*a,**k);_restore_local_user(self);_force_calibri(self);_set_taskbar_identity(self);_window_identity_sweep(self);_apply_tree_palette(self);_live_update_checks(self)
                  try:self.footer_db.configure(text=f"Databáze: {'SÍŤOVÁ' if NETWORK_MODE else 'LOKÁLNÍ'} • {M.DB}")
                  except:pass
                  return r
              module.App.__init__=init''', '''    def before_app_init(self, _args, _kwargs):
                  M._active_app=self
              def after_app_init(self, _result, _args, _kwargs):
                  _restore_local_user(self);_force_calibri(self);_set_taskbar_identity(self);_window_identity_sweep(self);_apply_tree_palette(self);_live_update_checks(self)
                  try:self.footer_db.configure(text=f"Databáze: {'SÍŤOVÁ' if NETWORK_MODE else 'LOKÁLNÍ'} • {M.DB}")
                  except:pass
              module.register_app_init_hook("crm_runtime.integrations", before=before_app_init, after=after_app_init)''')

          replace('v608_stability.py', '''    old_init=M.App.__init__
              def init(self,*a,**k):
                  r=old_init(self,*a,**k)
                  try:self.after(120,lambda:self.state('zoomed'));self.after(250,lambda:recolor(self))
                  except:pass
                  return r
              M.App.__init__=init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:self.after(120,lambda:self.state('zoomed'));self.after(250,lambda:recolor(self))
                  except:pass
              M.register_app_init_hook("v608.startup_style", after=after_app_init)''')

          replace('v620_outlookdrop.py', '''    old_init = M.App.__init__

              def init(self, *args, **kwargs):
                  result = old_init(self, *args, **kwargs)
                  try:
                      self.after_idle(lambda: setup_drop_area(self))
                  except Exception:
                      pass
                  return result

              M.App.__init__ = init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:
                      self.after_idle(lambda: setup_drop_area(self))
                  except Exception:
                      pass

              M.register_app_init_hook("v620.offer_drop_area", after=after_app_init)''')

          replace('v623_exports.py', '''    # App init last: canonical palette + monitor-aware maximization.
              old_app_init=M.App.__init__
              def app_init(self,*a,**k):
                  old_app_init(self,*a,**k)
                  try:self.after(80,lambda:maximize_current_monitor(self))
                  except Exception:pass
                  try:self.after_idle(lambda:recolor(self))
                  except Exception:pass
              M.App.__init__=app_init''', '''    # App startup: canonical palette + monitor-aware maximization.
              def after_app_init(self, _result, _args, _kwargs):
                  try:self.after(80,lambda:maximize_current_monitor(self))
                  except Exception:pass
                  try:self.after_idle(lambda:recolor(self))
                  except Exception:pass
              M.register_app_init_hook("v623.palette_and_monitor", after=after_app_init)''')

          replace('v625_stability.py', '''    old_init = M.App.__init__

              def init(self, *args, **kwargs):
                  result = old_init(self, *args, **kwargs)
                  try:
                      self.after(1000, lambda: modal_safety(self))
                  except Exception:
                      pass
                  return result

              M.App.__init__ = init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:
                      self.after(1000, lambda: modal_safety(self))
                  except Exception:
                      pass

              M.register_app_init_hook("v625.modal_safety", after=after_app_init)''')

          replace('v628_modernui_resize.py', '''    old_init = M.App.__init__
              def init(self, *args, **kwargs):
                  result = old_init(self, *args, **kwargs)
                  try:
                      self.after(1450, lambda:detach_hidden_pages(self))
                  except Exception:
                      pass
                  try:
                      self.after(1550, lambda:apply_modern_palette(self))
                  except Exception:
                      pass
                  try:
                      self.after(1750, lambda:dashboard_layout(self))
                  except Exception:
                      pass
                  try:
                      self.after(1900, lambda:install_outlook_indicator(self))
                  except Exception:
                      pass
                  return result
              M.App.__init__ = init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:
                      self.after(1450, lambda:detach_hidden_pages(self))
                  except Exception:
                      pass
                  try:
                      self.after(1550, lambda:apply_modern_palette(self))
                  except Exception:
                      pass
                  try:
                      self.after(1750, lambda:dashboard_layout(self))
                  except Exception:
                      pass
                  try:
                      self.after(1900, lambda:install_outlook_indicator(self))
                  except Exception:
                      pass
              M.register_app_init_hook("v628.modern_ui", after=after_app_init)''')

          p = Path('scripts/validate-800-app-lifecycle.py')
          s = p.read_text(encoding='utf-8').replace('assert "app_lifecycle.register(" in text, filename', 'assert "register_app_init_hook(" in text, filename')
          p.write_text(s, encoding='utf-8')
      - name: Validate lifecycle and runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 scripts
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add ZakazkyApp_base_6.1 scripts/validate-800-app-lifecycle.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate early App initialization lifecycle'
          git push origin HEAD:refactor/8.0.0-big-cleanup

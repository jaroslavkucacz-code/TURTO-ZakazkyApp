name: Validate TURTO CRM 7.8 professional offers and help

on:
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py
      - scripts/validate-7800-professional-offer-workflow.py
      - .github/workflows/validate-7800-professional-offers-help.yml
      - release_version.txt
      - release_notes.txt
  push:
    branches:
      - main
      - feature/7.8.0-professional-offer-release-help
    paths:
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py
      - scripts/validate-7800-professional-offer-workflow.py
      - .github/workflows/validate-7800-professional-offers-help.yml
      - release_version.txt
      - release_notes.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Compile professional workflow
        run: |
          python -m compileall -q \
            ZakazkyApp_base_6.1/price_lists_domain/issued_offers/professional_workflow.py \
            ZakazkyApp_base_6.1/runtime_bootstrap.py \
            scripts/validate-7800-professional-offer-workflow.py

      - name: Validate controlled release and searchable help
        run: python scripts/validate-7800-professional-offer-workflow.py ZakazkyApp_base_6.1

      - name: Validate issued-offer compatibility
        run: |
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-7300-polish.py ZakazkyApp_base_6.1
          python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1
          python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1

      - name: Ensure virtual display
        if: matrix.python-version == '3.14'
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Real Tk editor and navigation validation
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            echo "TURTO CRM 7.8 real-Tk attempt ${attempt}/3"
            timeout 210s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -ne 134 ] && [ "$rc" -ne 139 ]; then
              exit "$rc"
            fi
            echo "Transient native Tk failure (${rc}); retrying..."
            sleep 2
          done
          exit "$rc"

name: One-off user notes 6.3.15
on:
  push:
    branches: [feat/user-notes-6315]
    paths: [.github/workflows/_oneoff_user_notes_6315.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/user-notes-6315
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python .tmp_patch_user_notes_6315.py
          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          app=Path('ZakazkyApp_base_6.1/app.py').read_text(encoding='utf-8')
          assert 'CREATE TABLE IF NOT EXISTS user_notes' in app
          assert 'idx_user_notes_user_archive' in app
          assert 'class UserNotesDialog' in app
          assert "text='✓ Přeškrtnout / archivovat'" in app
          assert "SET archived=1,archived_at=CURRENT_TIMESTAMP" in app
          assert "SET archived=0,archived_at=''" in app
          assert "self.notes_button=ttk.Button" in app
          assert "command=self.open_user_notes" in app
          assert "UPDATE user_notes SET user_name=? WHERE user_name=?" in app
          assert Path('release_version.txt').read_text(encoding='utf-8').strip()=='6.3.15'

          # Minimal DB contract: archive is the only crossed-out state and is reversible.
          con=sqlite3.connect(':memory:')
          con.executescript('''
          CREATE TABLE user_notes(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_name TEXT NOT NULL,
            created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
            text TEXT NOT NULL DEFAULT '',
            archived INTEGER NOT NULL DEFAULT 0,
            archived_at TEXT DEFAULT ''
          );
          ''')
          nid=con.execute("INSERT INTO user_notes(user_name,text) VALUES('A','poznámka')").lastrowid
          con.execute("UPDATE user_notes SET archived=1,archived_at=CURRENT_TIMESTAMP WHERE id=?",(nid,))
          assert con.execute('SELECT archived FROM user_notes WHERE id=?',(nid,)).fetchone()[0]==1
          con.execute("UPDATE user_notes SET archived=0,archived_at='' WHERE id=?",(nid,))
          assert con.execute('SELECT archived FROM user_notes WHERE id=?',(nid,)).fetchone()[0]==0
          print('user notes 6.3.15 contract OK')
          PY
          git config user.name "TURTO Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .tmp_patch_user_notes_6315.py
          git add ZakazkyApp_base_6.1/app.py release_version.txt release_notes.txt
          git commit -m "TURTO CRM 6.3.15 — osobní poznámky uživatelů"
          git push origin HEAD:feat/user-notes-6315

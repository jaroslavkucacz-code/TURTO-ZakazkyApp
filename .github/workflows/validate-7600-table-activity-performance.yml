name: Validate TURTO CRM 7.6 tables, activity and performance

on:
  pull_request:
    branches:
      - main
    paths:
      - ZakazkyApp_base_6.1/ZakazkyCRM.pyw
      - ZakazkyApp_base_6.1/v644_default_date_sort.py
      - ZakazkyApp_base_6.1/v750_context_filters_offer_format.py
      - ZakazkyApp_base_6.1/v760_table_activity_performance.py
      - ZakazkyApp_base_6.1/price_lists_domain/**
      - scripts/validate-7500-context-filters-offer-format.py
      - scripts/validate-7600-table-activity-performance.py
      - scripts/validate-762-startup-stability.py
      - scripts/validate-real-ui.py
      - scripts/publish-update.sh
      - release_version.txt
      - release_notes.txt
      - .github/workflows/validate-6330.yml
      - .github/workflows/validate-7600-table-activity-performance.yml
      - .github/workflows/publish-update.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Compile source and validations
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py

      - name: Validate 7.6.2 native Tk startup stability
        run: python scripts/validate-762-startup-stability.py ZakazkyApp_base_6.1

      - name: Validate table alignment, archives, activity and performance
        run: python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1

      - name: Validate 7.5 context menus, filters and A4 format
        run: python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1

      - name: Validate 7.4 pricing and internal product compatibility
        run: python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1

      - name: Validate 7.3 preview and received-offer compatibility
        run: python scripts/validate-7300-polish.py ZakazkyApp_base_6.1

      - name: Validate visual issued offers and numbering
        run: python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate persistent commercial table compatibility
        run: python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1

      - name: Validate issued offers and immutable PDF revisions
        run: python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate manual products and contextual pricing
        run: python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1

      - name: Validate received-offer catalogue separation
        run: python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

      - name: Validate scalability platform
        run: python scripts/validate-scalability.py ZakazkyApp_base_6.1

      - name: Validate responsive navigation
        run: python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1

      - name: Validate unattended automatic updates
        run: python scripts/validate-auto-update.py ZakazkyApp_base_6.1

      - name: Ensure virtual display
        if: matrix.python-version == '3.14'
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Validate the composed Tk application
        if: matrix.python-version == '3.14'
        run: timeout 180s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Validate release script syntax
        run: bash -n scripts/publish-update.sh

name: Validate GEROtop offer parser

on:
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/offers_engine/**'
      - 'scripts/validate-764-gerotop-geometry.py'
      - 'release_version.txt'
  push:
    branches: [main]
    paths:
      - 'ZakazkyApp_base_6.1/offers_engine/**'
      - 'scripts/validate-764-gerotop-geometry.py'
      - 'release_version.txt'

jobs:
  validate-gerotop:
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile GEROtop engine
        run: python -m compileall -q ZakazkyApp_base_6.1/offers_engine
      - name: Validate word anchors and image-free extraction
        run: python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1

name: Apply TURTO CRM 7.1 commercial cleanup

on:
  push:
    branches:
      - feature/7.1.0-commercial-cleanup
    paths:
      - scripts/apply-7100-cleanup.py
      - .github/workflows/apply-7100-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Apply 7.1 cleanup
        run: python scripts/apply-7100-cleanup.py

      - name: Normalize generated sources
        run: |
          python - <<'PY'
          from pathlib import Path

          layer_path = Path('ZakazkyApp_base_6.1/v710_cleanup.py')
          text = layer_path.read_text(encoding='utf-8')
          text = text.replace(
              'podskupiny?\n\n"\n                "Ano = přepočítat ceny podle zařazení.\n"',
              'podskupiny?\\n\\n"\n                "Ano = přepočítat ceny podle zařazení.\\n"',
          )
          text = text.replace(
              'Vydanou nabídku:\n{exc}"',
              'Vydanou nabídku:\\n{exc}"',
          )
          layer_path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/validate-7100-commercial-cleanup.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '        import app\n        import crm_price_lists\n',
              '        import app\n        import crm_features\n        import crm_price_lists\n',
          )
          test = test.replace(
              '        app.ensure_schema()\n        crm_price_lists.apply(app)\n',
              '        app.ensure_schema()\n        crm_features.apply(app)\n        crm_price_lists.apply(app)\n',
          )
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Compile canonical source
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts

      - name: Validate 7.1 and commercial regressions
        run: |
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-6334-product-catalog.py ZakazkyApp_base_6.1
          python scripts/validate-6335-product-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6336-commercial-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1
          python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1
          python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1
          python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1
          python scripts/validate-scalability.py ZakazkyApp_base_6.1
          python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1
          python scripts/validate-auto-update.py ZakazkyApp_base_6.1
          bash -n scripts/publish-update.sh

      - name: Validate real Tk application
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          timeout 100s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1

      - name: Commit clean implementation
        run: |
          git restore --source=HEAD -- .github/workflows
          rm -f scripts/apply-7100-cleanup.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- ZakazkyApp_base_6.1 scripts release_version.txt release_notes.txt
          git diff --cached --check
          git commit -m "Implement TURTO CRM 7.1 commercial cleanup"
          git push origin HEAD:feature/7.1.0-commercial-cleanup

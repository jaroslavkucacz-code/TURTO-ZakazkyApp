name: Publish ZakazkyApp update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release_version.txt
      - scripts/publish-update.sh
      - .github/workflows/publish-update.yml
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false

jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build, validate and publish
        shell: bash
        run: bash scripts/publish-update.sh

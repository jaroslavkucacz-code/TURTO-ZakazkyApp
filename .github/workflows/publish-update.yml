name: Publish ZakazkyApp update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release_version.txt]
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false
jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare release
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < release_version.txt)"
          STAGE="ZakazkyApp_v${VERSION}"
          BASE_DIR="ZakazkyApp_base_6.1"
          test -d "$BASE_DIR"
          rm -rf "$STAGE"
          cp -a "$BASE_DIR" "$STAGE"
          cp post_baseline.py "$STAGE/post_baseline.py"
          rm -f "$STAGE/post_fix_613.py"
          python - "$STAGE/app.py" "$VERSION" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text(encoding='utf-8');v=sys.argv[2]
          s,n=re.subn(r'APP_VERSION\s*=\s*["\'][^"\']+["\']',f'APP_VERSION="{v}"',s,count=1)
          if n!=1:raise SystemExit('APP_VERSION replacement failed')
          p.write_text(s,encoding='utf-8')
          PY
          cat > "$STAGE/Spustit_Zakazky.vbs" <<'VBS'
          Set sh = CreateObject("WScript.Shell")
          sh.CurrentDirectory = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)
          sh.Run "py -m pip install -r requirements.txt --disable-pip-version-check --no-input", 0, True
          sh.Run "pyw ZakazkyCRM.pyw", 0, False
          VBS
          cp "$STAGE/Spustit_Zakazky.vbs" "$STAGE/Spustit_Zakazky_v5.vbs"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q "${{ steps.app.outputs.dir }}"
      - name: Build ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.app.outputs.dir }}"; VER="${{ steps.app.outputs.version }}"; ZIP="ZakazkyApp_v${VER}.zip"
          rm -f "$ZIP";zip -qr "$ZIP" "$DIR" -x '*/__pycache__/*' '*.pyc'
          SHA="$(sha256sum "$ZIP"|awk '{print $1}')"
          python - "$VER" "$ZIP" "$SHA" <<'PY'
          import json,sys,pathlib
          v,f,s=sys.argv[1:];p=pathlib.Path('release_notes.txt');n=p.read_text(encoding='utf-8').strip() if p.exists() else ''
          pathlib.Path('latest.json').write_text(json.dumps({'version':v,'file':f,'sha256':s,'notes':n},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.app.outputs.version }}";ZIP="ZakazkyApp_v${VER}.zip"
          git config user.name "TURTO Update Bot";git config user.email "actions@users.noreply.github.com"
          git add -f "$ZIP" latest.json
          git commit -m "Publish ZakazkyApp v${VER} update"
          for try in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0;sleep $((try*2));done
          exit 1

name: Publish ZakazkyApp update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release_version.txt]
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false
jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare release
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="ZakazkyApp_v5.7.2"; VERSION="$(tr -d ' \r\n' < release_version.txt)"; STAGE="ZakazkyApp_v${VERSION}"
          rm -rf "$STAGE"; cp -a "$APP_DIR" "$STAGE"
          cp v58_features.py "$STAGE/crm_features.py"; cp crm_runtime.py "$STAGE/crm_runtime.py"; cp crm_v605.py "$STAGE/crm_v605.py"; cp v606_features.py "$STAGE/v606_features.py"; cp v608_stability.py "$STAGE/v608_stability.py"; cp v611_audit.py "$STAGE/v611_audit.py"; cp v613_ui.py "$STAGE/v613_ui.py"; cp v614_next.py "$STAGE/v614_next.py"; cp v615_input.py "$STAGE/v615_input.py"; cp v616_stability.py "$STAGE/v616_stability.py"; cp v617_offerhub.py "$STAGE/v617_offerhub.py"; cp v618_inputfix.py "$STAGE/v618_inputfix.py"; cp v619_fixes.py "$STAGE/v619_fixes.py"; cp v620_outlookdrop.py "$STAGE/v620_outlookdrop.py"
          rm -f "$STAGE/v58_features.py" "$STAGE/v581_cleanup.py" "$STAGE/qt_preview_v5.py" "$STAGE/AUDIT_v2.22.txt" "$STAGE/DULEZITE_v2.8_JEDNORAZOVY_RESET.txt"
          python - "$STAGE/app.py" "$VERSION" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text(encoding='utf-8');v=sys.argv[2]
          s,n=re.subn(r'APP_VERSION\s*=\s*["\'][^"\']+["\']',f'APP_VERSION="{v}"',s,count=1)
          if n!=1:raise SystemExit('APP_VERSION replacement failed')
          start='        focus=ttk.Frame(p,style="Card.TFrame",padding=(14,10));focus.pack(fill="x",pady=(0,12))\n';end='        ttk.Button(focus,text="Otevřít upozornění",style="Toolbar.TButton",command=self.open_notifications).pack(side="right")\n';a=s.find(start);b=s.find(end,a)
          if a>=0 and b>=0:s=s[:a]+s[b+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          cat > "$STAGE/ZakazkyCRM.pyw" <<'PYW'
          import app,crm_features,crm_runtime,crm_v605,v606_features,v608_stability,v611_audit,v613_ui,v614_next,v615_input,v616_stability,v617_offerhub,v618_inputfix,v619_fixes,v620_outlookdrop
          crm_features.apply(app);crm_runtime.apply(app);crm_v605.apply(app);v606_features.apply(app);v608_stability.apply(app);v611_audit.apply(app);v613_ui.apply(app);v614_next.apply(app);v615_input.apply(app);v616_stability.apply(app);v617_offerhub.apply(app);v618_inputfix.apply(app);v619_fixes.apply(app);v620_outlookdrop.apply(app)
          app.cleanup_stale_test_session();app.ensure_schema();app.ensure_test_user();app.migrate_v41_visual_once();app.import_mail_contacts_v220_once();app.import_mail_contacts_v221_once();app.restore_people_from_v280_backup_once();app.post_import_cleanup_v222_once();app.App().mainloop()
          PYW
          cat > "$STAGE/Spustit_Zakazky.vbs" <<'VBS'
          Set sh = CreateObject("WScript.Shell")
          sh.CurrentDirectory = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)
          sh.Run "pyw ZakazkyCRM.pyw", 0, False
          VBS
          cp "$STAGE/Spustit_Zakazky.vbs" "$STAGE/Spustit_Zakazky_v5.vbs"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate Python
        run: python -m py_compile "${{ steps.app.outputs.dir }}/app.py" "${{ steps.app.outputs.dir }}/crm_features.py" "${{ steps.app.outputs.dir }}/crm_runtime.py" "${{ steps.app.outputs.dir }}/crm_v605.py" "${{ steps.app.outputs.dir }}/v606_features.py" "${{ steps.app.outputs.dir }}/v608_stability.py" "${{ steps.app.outputs.dir }}/v611_audit.py" "${{ steps.app.outputs.dir }}/v613_ui.py" "${{ steps.app.outputs.dir }}/v614_next.py" "${{ steps.app.outputs.dir }}/v615_input.py" "${{ steps.app.outputs.dir }}/v616_stability.py" "${{ steps.app.outputs.dir }}/v617_offerhub.py" "${{ steps.app.outputs.dir }}/v618_inputfix.py" "${{ steps.app.outputs.dir }}/v619_fixes.py" "${{ steps.app.outputs.dir }}/v620_outlookdrop.py" "${{ steps.app.outputs.dir }}/ZakazkyCRM.pyw"
      - name: Build ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.app.outputs.dir }}"; VER="${{ steps.app.outputs.version }}"; ZIP="ZakazkyApp_v${VER}.zip"; rm -f "$ZIP"; zip -qr "$ZIP" "$DIR" -x '*/__pycache__/*' '*.pyc'; SHA="$(sha256sum "$ZIP"|awk '{print $1}')"
          python - "$VER" "$ZIP" "$SHA" <<'PY'
          import json,sys,pathlib
          v,f,s=sys.argv[1:];p=pathlib.Path('release_notes.txt');n=p.read_text(encoding='utf-8').strip() if p.exists() else ''
          pathlib.Path('latest.json').write_text(json.dumps({'version':v,'file':f,'sha256':s,'notes':n},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.app.outputs.version }}"; ZIP="ZakazkyApp_v${VER}.zip"; git config user.name "TURTO Update Bot"; git config user.email "actions@users.noreply.github.com"; git add -f "$ZIP" latest.json; git diff --cached --quiet && exit 0; git commit -m "Publish ZakazkyApp v${VER} update"
          for try in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((try*2)); done; exit 1

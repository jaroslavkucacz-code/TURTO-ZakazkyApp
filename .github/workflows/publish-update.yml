name: Publish ZakazkyApp update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release_version.txt]
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false
jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare release
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < release_version.txt)"
          STAGE="ZakazkyApp_v${VERSION}"
          BASE_DIR="ZakazkyApp_base_6.1"
          test -d "$BASE_DIR"
          rm -rf "$STAGE"
          cp -a "$BASE_DIR" "$STAGE"
          cp post_baseline.py "$STAGE/post_baseline.py"

          RUNTIME="$STAGE/_runtime"
          mkdir -p "$RUNTIME"
          for f in \
            crm_features.py crm_runtime.py crm_v605.py \
            v606_features.py v608_stability.py v611_audit.py v613_ui.py v614_next.py \
            v615_input.py v616_stability.py v617_offerhub.py v618_inputfix.py v619_fixes.py \
            v620_outlookdrop.py v621_prices.py v622_palette.py v623_exports.py v624_legacy_exports.py \
            v625_stability.py v626_smoothui.py v627_fastui_dropfix.py v628_modernui_resize.py \
            v630_safeofferdrop.py v631_diskdrop.py v632_offerlinks.py v633_offerassign_deadlines.py \
            v634_assignment_search.py v636_action_offers_stabletable.py \
            v637_project_offer_model.py v638_table_updatefix.py v640_warning_cleanup.py \
            v644_default_date_sort.py post_baseline.py
          do
            [ -f "$STAGE/$f" ] && mv "$STAGE/$f" "$RUNTIME/$f"
          done

          rm -rf "$STAGE/__pycache__" "$STAGE/ZakazkyApp_v5.7" "$STAGE/original_source"
          rm -f "$STAGE/post_fix_613.py" "$STAGE/v635_actions_sort.py" \
                "$STAGE/v641_fill_tables.py" "$STAGE/v642_exact_table_fill.py" \
                "$STAGE/v645_project_table_fill.py" \
                "$STAGE/Spustit_DIAGNOSTIKA.bat" "$STAGE/Spustit_Qt_PREVIEW.bat" \
                "$STAGE/Spustit_Zakazky.bat" "$STAGE/Spustit_Zakazky_v5.bat" "$STAGE/Spustit_Zakazky_v5.vbs" \
                "$STAGE/Vytvorit_EXE.bat" "$STAGE/Vytvorit_manifest_aktualizace.py" "$STAGE/latest.example.json"

          python - "$STAGE/app.py" "$VERSION" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text(encoding='utf-8');v=sys.argv[2]
          s,n=re.subn(r'APP_VERSION\s*=\s*["\'][^"\']+["\']',f'APP_VERSION="{v}"',s,count=1)
          if n!=1:raise SystemExit('APP_VERSION replacement failed')
          p.write_text(s,encoding='utf-8')
          PY

          cat > "$STAGE/ZakazkyCRM.pyw" <<'PYW'
          import sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parent
          RUNTIME=ROOT/'_runtime'
          if str(RUNTIME) not in sys.path:sys.path.insert(0,str(RUNTIME))
          import app,crm_features,crm_runtime,crm_v605,v606_features,v608_stability,v611_audit,v613_ui,v614_next,v615_input,v616_stability,v617_offerhub,v618_inputfix,v619_fixes,v620_outlookdrop,v621_prices,v622_palette,v623_exports,v624_legacy_exports,v625_stability,v626_smoothui,v627_fastui_dropfix,v628_modernui_resize,v630_safeofferdrop,v631_diskdrop,v632_offerlinks,v633_offerassign_deadlines,v634_assignment_search,v636_action_offers_stabletable,v637_project_offer_model,v638_table_updatefix,v640_warning_cleanup,v644_default_date_sort,post_baseline
          crm_features.apply(app);crm_runtime.apply(app);crm_v605.apply(app);v606_features.apply(app);v608_stability.apply(app);v611_audit.apply(app);v613_ui.apply(app);v614_next.apply(app);v615_input.apply(app);v616_stability.apply(app);v617_offerhub.apply(app);v618_inputfix.apply(app);v619_fixes.apply(app);v620_outlookdrop.apply(app);v621_prices.apply(app);v622_palette.apply(app);v623_exports.apply(app);v624_legacy_exports.apply(app);v625_stability.apply(app);v626_smoothui.apply(app);v627_fastui_dropfix.apply(app);v628_modernui_resize.apply(app);v630_safeofferdrop.apply(app);v631_diskdrop.apply(app);v632_offerlinks.apply(app);v633_offerassign_deadlines.apply(app);v634_assignment_search.apply(app);v636_action_offers_stabletable.apply(app);v637_project_offer_model.apply(app);v638_table_updatefix.apply(app);v640_warning_cleanup.apply(app);post_baseline.apply(app);v644_default_date_sort.apply(app)
          app.cleanup_stale_test_session();app.ensure_schema();app.ensure_test_user();app.migrate_v41_visual_once();app.import_mail_contacts_v220_once();app.import_mail_contacts_v221_once();app.restore_people_from_v280_backup_once();app.post_import_cleanup_v222_once();app.App().mainloop()
          PYW

          cat > "$STAGE/Spustit_Zakazky.vbs" <<'VBS'
          Set sh = CreateObject("WScript.Shell")
          sh.CurrentDirectory = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)
          sh.Run "py -m pip install -r requirements.txt --disable-pip-version-check --no-input", 0, True
          sh.Run "pyw ZakazkyCRM.pyw", 0, False
          VBS

          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q "${{ steps.app.outputs.dir }}"
      - name: Validate clean runtime layout
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.app.outputs.dir }}"
          test -d "$DIR/_runtime"
          test -e "$DIR/_runtime/v644_default_date_sort.py"
          test ! -e "$DIR/_runtime/v635_actions_sort.py"
          test ! -e "$DIR/_runtime/v641_fill_tables.py"
          test ! -e "$DIR/_runtime/v642_exact_table_fill.py"
          test ! -e "$DIR/_runtime/v645_project_table_fill.py"
          test ! -e "$DIR/post_fix_613.py"
          test -e "$DIR/ZakazkyCRM.pyw"
          test -e "$DIR/Spustit_Zakazky.vbs"
          grep -q "post_baseline.apply(app);v644_default_date_sort.apply(app)" "$DIR/ZakazkyCRM.pyw"
          ! grep -q "v635_actions_sort" "$DIR/ZakazkyCRM.pyw"
          grep -q "rmtree(target/'_runtime'" "$DIR/crm_updater.pyw"
      - name: Build ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.app.outputs.dir }}"; VER="${{ steps.app.outputs.version }}"; ZIP="ZakazkyApp_v${VER}.zip"
          rm -f "$ZIP";zip -qr "$ZIP" "$DIR" -x '*/__pycache__/*' '*.pyc'
          SHA="$(sha256sum "$ZIP"|awk '{print $1}')"
          python - "$VER" "$ZIP" "$SHA" <<'PY'
          import json,sys,pathlib
          v,f,s=sys.argv[1:];p=pathlib.Path('release_notes.txt');n=p.read_text(encoding='utf-8').strip() if p.exists() else ''
          pathlib.Path('latest.json').write_text(json.dumps({'version':v,'file':f,'sha256':s,'notes':n},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.app.outputs.version }}";ZIP="ZakazkyApp_v${VER}.zip"
          git config user.name "TURTO Update Bot";git config user.email "actions@users.noreply.github.com"
          git add -f "$ZIP" latest.json
          git commit -m "Publish ZakazkyApp v${VER} update"
          for try in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0;sleep $((try*2));done
          exit 1

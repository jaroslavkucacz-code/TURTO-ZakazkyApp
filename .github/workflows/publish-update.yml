name: Publish ZakazkyApp update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release_version.txt
      - release_notes.txt
      - release_request.json
      - scripts/publish-update.sh
      - scripts/validate-scalability.py
      - scripts/validate-ui-navigation.py
      - scripts/validate-auto-update.py
      - scripts/validate-6337-issued-offers.py
      - scripts/validate-6339-catalog-price-ux.py
      - scripts/validate-6340-manual-products-pricing.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/**
      - ZakazkyApp_base_6.1/price_lists_domain/platform/categories.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/product_catalog.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/product_workspace.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/commercial_workspace.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/customer_pricing.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/__init__.py
      - ZakazkyApp_base_6.1/price_lists_domain/__init__.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/automatic_updates.py
      - .github/workflows/publish-update.yml
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false

jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Validate scalability platform
        shell: bash
        run: python scripts/validate-scalability.py ZakazkyApp_base_6.1

      - name: Validate responsive navigation
        shell: bash
        run: python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1

      - name: Validate unattended automatic updates
        shell: bash
        run: python scripts/validate-auto-update.py ZakazkyApp_base_6.1

      - name: Validate issued offers, numbering and PDF revisions
        shell: bash
        run: python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate catalogue hierarchy and current-price UX
        shell: bash
        run: python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1

      - name: Validate manual products and customer pricing hierarchy
        shell: bash
        run: python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1

      - name: Build, validate and publish
        shell: bash
        run: bash scripts/publish-update.sh

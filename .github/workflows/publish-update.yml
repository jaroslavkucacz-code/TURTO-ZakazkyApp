name: Publish ZakazkyApp legacy update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release_version.txt
      - release_notes.txt
      - release_request.json
permissions:
  contents: write
concurrency:
  group: zakazkyapp-publish-legacy
  cancel-in-progress: false

jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Validate release version advances
        shell: bash
        run: python scripts/validate-release-version.py

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Validate scalability platform
        shell: bash
        run: python scripts/validate-scalability.py ZakazkyApp_base_6.1

      - name: Validate responsive navigation
        shell: bash
        run: python scripts/validate-ui-navigation.py ZakazkyApp_base_6.1

      - name: Validate unattended automatic updates
        shell: bash
        run: python scripts/validate-auto-update.py ZakazkyApp_base_6.1

      - name: Validate issued offers, numbering and PDF revisions
        shell: bash
        run: python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate catalogue hierarchy and current-price UX
        shell: bash
        run: python scripts/validate-6339-catalog-price-ux.py ZakazkyApp_base_6.1

      - name: Validate manual products and contextual customer pricing
        shell: bash
        run: python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1

      - name: Validate received-offer and catalogue separation
        shell: bash
        run: python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

      - name: Validate 7.1 commercial cleanup compatibility
        shell: bash
        run: python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1

      - name: Validate 7.2 visual editor and persistent widths
        shell: bash
        run: python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate 7.3 preview resilience, received offers and company merge
        shell: bash
        run: python scripts/validate-7300-polish.py ZakazkyApp_base_6.1

      - name: Validate 7.4 pricing defaults and uniform table controls
        shell: bash
        run: python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1

      - name: Validate 7.5 context menus, filters and A4 offer format
        shell: bash
        run: python scripts/validate-7500-context-filters-offer-format.py ZakazkyApp_base_6.1

      - name: Validate 7.6 table alignment, archive activity and performance
        shell: bash
        run: python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1

      - name: Validate 7.6.2 native Tk startup stability
        shell: bash
        run: python scripts/validate-762-startup-stability.py ZakazkyApp_base_6.1

      - name: Validate GEROtop word anchors and restored images
        shell: bash
        run: python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1

      - name: Validate identical-offer reprocessing
        shell: bash
        run: python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1

      - name: Validate Nevoga one-description persistence
        shell: bash
        run: python scripts/validate-769-nevoga-rich-description.py ZakazkyApp_base_6.1

      - name: Validate Nevoga exact red and 4+2 Excel layout
        shell: bash
        run: python scripts/validate-7610-nevoga-exact-red-excel.py ZakazkyApp_base_6.1

      - name: Validate 7.9.3 contextual UI policy
        shell: bash
        run: python scripts/validate-793-ui-cleanup.py ZakazkyApp_base_6.1

      - name: Validate 7.9.4 UI optimization
        shell: bash
        run: python scripts/validate-794-ui-optimization.py ZakazkyApp_base_6.1

      - name: Validate 7.9.4 startup optimization
        shell: bash
        run: python scripts/validate-794-startup-optimization.py ZakazkyApp_base_6.1

      - name: Build, validate and publish
        shell: bash
        run: bash scripts/publish-update.sh

name: Publish ZakazkyApp update

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'release_version.txt'

permissions:
  contents: write

concurrency:
  group: zakazkyapp-publish
  cancel-in-progress: false

jobs:
  build-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=$(find . -maxdepth 1 -type d -name 'ZakazkyApp_v*' -printf '%f\n' | sort -V | tail -n 1)
          test -n "$APP_DIR"
          VERSION=$(tr -d ' \r\n' < release_version.txt)
          test -n "$VERSION"
          STAGE="ZakazkyApp_v${VERSION}"
          rm -rf "$STAGE"
          cp -a "$APP_DIR" "$STAGE"

          cp v58_features.py "$STAGE/crm_features.py"
          cp crm_runtime.py "$STAGE/crm_runtime.py"

          rm -f "$STAGE/v58_features.py" "$STAGE/v581_cleanup.py"
          rm -f "$STAGE/Spustit_Zakazky_v5.bat" "$STAGE/Spustit_Zakazky_v5.vbs"
          rm -f "$STAGE/Spustit_QT_PREVIEW.bat" "$STAGE/qt_preview_v5.py"
          rm -f "$STAGE/AUDIT_v2.22.txt" "$STAGE/DULEZITE_v2.8_JEDNORAZOVY_RESET.txt"
          rm -f "$STAGE/latest.example.json" "$STAGE/Vytvorit_EXE.bat" "$STAGE/Vytvorit_manifest_aktualizace.py"

          printf '%s\n' \
            'Set sh = CreateObject("WScript.Shell")' \
            'sh.CurrentDirectory = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)' \
            'sh.Run "pyw app.py", 0, False' \
            > "$STAGE/Spustit_Zakazky.vbs"
          printf '%s\n' \
            '@echo off' \
            'cd /d "%~dp0"' \
            'start "" pyw app.py' \
            > "$STAGE/Spustit_Zakazky.bat"

          python - "$STAGE/app.py" "$VERSION" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);v=sys.argv[2];s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'APP_VERSION\s*=\s*["\'][^"\']+["\']',f'APP_VERSION="{v}"',s,count=1)
          if n!=1:raise SystemExit('APP_VERSION replacement failed')
          s=s.replace("VALUES('schema_version','5.7')","VALUES('schema_version','5.8')",1)
          marker='\nif __name__=="__main__":\n'
          hook='''\n# --- TURTO stable CRM layers ---\ntry:\n    import crm_features as _crm_features\n    _crm_features.apply(sys.modules[__name__])\nexcept Exception as _e:\n    try:(ROOT/"crm_features_error.log").write_text(str(_e),encoding="utf-8")\n    except Exception:pass\ntry:\n    import crm_runtime as _crm_runtime\n    _crm_runtime.apply(sys.modules[__name__])\nexcept Exception as _e:\n    try:(ROOT/"crm_runtime_error.log").write_text(str(_e),encoding="utf-8")\n    except Exception:pass\n\n'''
          if 'crm_features as _crm_features' not in s:
              if marker not in s:raise SystemExit('main marker not found')
              s=s.replace(marker,hook+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Python
        shell: bash
        run: |
          DIR='${{ steps.app.outputs.dir }}'
          python -m py_compile "$DIR/app.py" "$DIR/crm_features.py" "$DIR/crm_runtime.py"

      - name: Build ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          DIR='${{ steps.app.outputs.dir }}'; VER='${{ steps.app.outputs.version }}'; ZIP="ZakazkyApp_v${VER}.zip"
          rm -f "$ZIP"
          zip -qr "$ZIP" "$DIR" -x '*/__pycache__/*' '*.pyc' '*/v5_error.log' '*/crm_features_error.log' '*/crm_runtime_error.log'
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          python - <<PY
          import json
          open('latest.json','w',encoding='utf-8').write(json.dumps({'version':'${VER}','file':'${ZIP}','sha256':'${SHA}'},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Publish generated package
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.app.outputs.version }}'; ZIP="ZakazkyApp_v${VER}.zip"
          git config user.name 'TURTO Update Bot'; git config user.email 'actions@users.noreply.github.com'
          git add -f "$ZIP" latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish ZakazkyApp v${VER} update"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((try*2))
          done
          exit 1

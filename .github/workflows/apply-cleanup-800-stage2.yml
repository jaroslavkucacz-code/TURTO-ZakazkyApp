name: Apply TURTO CRM 8.0 cleanup stage 2
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-stage2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply stage 2 ownership cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')

          p = root/'ZakazkyApp_base_6.1/v767_offer_reprocess_images.py'
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              s = s.replace('import hashlib\nimport re\n', 'import hashlib\nimport re\nfrom contextlib import closing\n')
          s = s.replace('with M.db() as con:', 'with closing(M.db()) as con, con:')
          p.write_text(s, encoding='utf-8')

          p = root/'scripts/validate-767-offer-reprocess-images.py'
          s = p.read_text(encoding='utf-8')
          if 'from contextlib import closing' not in s:
              s = s.replace('import hashlib\nimport importlib.util\n', 'import hashlib\nimport importlib.util\nfrom contextlib import closing\n')
          s = s.replace('with db() as c:', 'with closing(db()) as c, c:')
          p.write_text(s, encoding='utf-8')

          p = root/'ZakazkyApp_base_6.1/v7616_requests_plexus_assets.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('OVERDUE_TAG = "req_overdue_bold"\n', '')
          start = s.find('def _clean_date_text(value):\n')
          if start != -1:
              end = s.find('\n\ndef ', start + 1)
              if end == -1:
                  raise SystemExit('v7616 _clean_date_text end not found')
              s = s[:start] + s[end+2:]
          s = s.replace('    M.resolve_offer_item_image = _resolve_image\n    M.plexus_image_asset_key = _asset_key\n', '')
          start = s.find('    def request_date_highlights(self, tree, rows):\n')
          if start != -1:
              end = s.find('\n    try:\n        import crm_features', start)
              if end == -1:
                  raise SystemExit('v7616 request highlight end not found')
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')

          p = root/'ZakazkyApp_base_6.1/v768_clean_table_markers.py'
          s = p.read_text(encoding='utf-8')
          start = s.find('def apply(M):\n')
          if start == -1:
              raise SystemExit('v768 apply not found')
          s = s[:start] + '''def apply(M):\n    """Retain the legacy layer marker without owning UI callbacks.\n\n    Since 7.7 the final runtime policy owns both deadline/request highlighting\n    and also strips historical glyph markers. Keeping another callback owner\n    here only creates ordering-dependent behavior, so v768 is intentionally a\n    compatibility marker plus the reusable _plain_date helper.\n    """\n    if getattr(M, "_turto_v768_clean_table_markers", False):\n        return\n    M._turto_v768_clean_table_markers = True\n    M.V768_TABLE_MARKERS_CLEAN = True\n'''
          p.write_text(s, encoding='utf-8')

          p = root/'ZakazkyApp_base_6.1/v730_polish.py'
          s = p.read_text(encoding='utf-8')
          start = s.find('    # ------------------------------------------------------------------\n    # Help additions.\n')
          if start != -1:
              end = s.find('    M._turto_v730_polish_installed = True', start)
              if end == -1:
                  raise SystemExit('v730 help block end not found')
              s = s[:start] + '    # Help ownership moved to issued_offers.professional_workflow.\n\n' + s[end:]
          p.write_text(s, encoding='utf-8')

          p = root/'scripts/audit-runtime-overrides.py'
          s = p.read_text(encoding='utf-8')
          old = '''CRITICAL_OWNER_BUDGETS = {\n    "M.App.build_help": 1,\n    "M.enable_dialog_maximize": 1,\n}\n'''
          new = '''CRITICAL_OWNER_BUDGETS = {\n    "M.App.build_help": 1,\n    "M.App.show_help_topic": 1,\n    "M.enable_dialog_maximize": 1,\n    "M.resolve_offer_item_image": 1,\n    "M.plexus_image_asset_key": 1,\n    "M.App._refresh_action_deadline_highlights": 1,\n    "M.App._refresh_request_date_highlights": 1,\n}\n'''
          if old in s:
              s = s.replace(old, new)
          elif '"M.resolve_offer_item_image": 1' not in s:
              raise SystemExit('architecture budget block not found')
          p.write_text(s, encoding='utf-8')

          p = root/'scripts/validate-7616-requests-plexus-assets.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('resolved = module.resolve_offer_item_image(con, nevoga_rows[0], "Nevoga")', 'resolved = layer._resolve_image(con, nevoga_rows[0], "Nevoga")')
          s = s.replace('resolved_c = module.resolve_offer_item_image(con, c_row, "Nevoga")', 'resolved_c = layer._resolve_image(con, c_row, "Nevoga")')
          block = '''        app._refresh_request_date_highlights(\n            tree,\n            (("r1", True), ("r2", False)),\n        )\n        assert tree.rows["r1"]["Poptáno"] == "01.08.2026"\n        assert "req_old" in tree.rows["r1"]["tags"]\n        assert layer.OVERDUE_TAG in tree.rows["r1"]["tags"]\n        assert layer.OVERDUE_TAG not in tree.rows["r2"]["tags"]\n        assert tree.tags[layer.OVERDUE_TAG]["font"][-1] == "bold"\n'''
          repl = '''        # v7616 prepares request geometry/assets only. Final date highlighting and\n        # public PLEXUS resolver ownership belong to v770_runtime_policy.\n        assert not hasattr(App, "_refresh_request_date_highlights")\n        assert not hasattr(module, "resolve_offer_item_image")\n        assert not hasattr(module, "plexus_image_asset_key")\n'''
          if block in s:
              s = s.replace(block, repl)
          elif 'public PLEXUS resolver ownership belong to v770_runtime_policy' not in s:
              raise SystemExit('v7616 validation highlight block not found')
          p.write_text(s, encoding='utf-8')

          p = root/'scripts/validate-768-clean-table-markers.py'
          s = p.read_text(encoding='utf-8')
          start = s.find('    class FakeTree:\n')
          end = s.find('\n    text = (source / "v768_clean_table_markers.py")', start)
          if start != -1 and end != -1:
              repl = '''    class App:\n        pass\n    class Module:\n        pass\n    Module.App = App\n    module = Module()\n    layer.apply(module)\n    assert module.V768_TABLE_MARKERS_CLEAN is True\n    assert not hasattr(App, "_refresh_action_deadline_highlights")\n    assert not hasattr(App, "_refresh_request_date_highlights")\n'''
              s = s[:start] + repl + s[end:]
          needle = '''    assert bootstrap.index('"v7616_requests_plexus_assets"') < bootstrap.index('"v770_runtime_policy"')\n'''
          if needle in s and 'policy = (source / "v770_runtime_policy.py")' not in s:
              s = s.replace(needle, needle + '''    policy = (source / "v770_runtime_policy.py").read_text(encoding="utf-8")\n    assert "M.App._refresh_action_deadline_highlights = _attention_callback" in policy\n    assert "M.App._refresh_request_date_highlights = _request_attention_callback" in policy\n''', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate stage 2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
          python scripts/validate-7616-requests-plexus-assets.py ZakazkyApp_base_6.1
          python scripts/validate-768-clean-table-markers.py ZakazkyApp_base_6.1
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
      - name: Commit stage 2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add ZakazkyApp_base_6.1 scripts
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate PLEXUS, deadlines and DB connection ownership'
          git push origin HEAD:refactor/8.0.0-big-cleanup

name: Apply TURTO CRM 8.0 lifecycle cleanup stage 2
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths:
      - '.github/workflows/apply-cleanup-800-stage2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - name: Apply tested lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          cat _cleanup800_stage2/p1 _cleanup800_stage2/p2 _cleanup800_stage2/p3 > /tmp/stage2.patch.gz.b64
          base64 -d /tmp/stage2.patch.gz.b64 | gzip -dc > /tmp/stage2.patch
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          rm -rf _cleanup800_stage2
          git status --short
      - name: Run focused Linux checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-767-offer-reprocess-images.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1
          python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1
      - name: Commit lifecycle consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate App lifecycle ownership'
          git push origin HEAD:refactor/8.0.0-big-cleanup

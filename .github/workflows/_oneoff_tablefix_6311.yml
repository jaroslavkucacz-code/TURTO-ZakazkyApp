name: One-off table fix 6.3.11
on:
  push:
    branches: [fix/table-refresh-multidelete-6311]
    paths: [.github/workflows/_oneoff_tablefix_6311.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/table-refresh-multidelete-6311
          fetch-depth: 0
      - name: Patch canonical table mechanisms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # post_baseline: one final layout pass after all nested refresh
          # wrappers have queued their after_idle table mutations.
          # ------------------------------------------------------------
          p = Path('post_baseline.py')
          s = p.read_text(encoding='utf-8')
          old = '''    for name in (\n        'refresh_dash', 'refresh_dashboard', 'refresh_actions', 'refresh_requests',\n        'refresh_mivo_requests', 'refresh_mivo', 'refresh_projects',\n        'refresh_offers', 'refresh_tasks', 'refresh_companies',\n        'refresh_people', 'refresh_all',\n    ):\n        old = getattr(M.App, name, None)\n        if not callable(old):\n            continue\n\n        def make(fn):\n            def wrapped(self, *args, **kwargs):\n                result = fn(self, *args, **kwargs)\n                normalize(self)\n                try:\n                    self.after_idle(lambda: recolor_dashboard(self))\n                except Exception:\n                    recolor_dashboard(self)\n                return result\n\n            return wrapped\n\n        setattr(M.App, name, make(old))\n\n    old_show = getattr(M.App, 'show_page', None)\n    if callable(old_show):\n        def show_page(self, *args, **kwargs):\n            result = old_show(self, *args, **kwargs)\n            normalize(self)\n            recolor_dashboard(self)\n            return result\n\n        M.App.show_page = show_page\n'''
          new = '''    def schedule_final_layout(app):\n        \"\"\"Run geometry after older refresh layers finish their idle callbacks.\"\"\"\n        try:\n            previous = getattr(app, '_turto_final_layout_after', None)\n            if previous is not None:\n                try:\n                    app.after_cancel(previous)\n                except Exception:\n                    pass\n\n            def finish():\n                try:\n                    app._turto_final_layout_after = None\n                except Exception:\n                    pass\n                normalize(app)\n                recolor_dashboard(app)\n\n            app._turto_final_layout_after = app.after_idle(finish)\n        except Exception:\n            normalize(app)\n            recolor_dashboard(app)\n\n    M.schedule_final_tree_layout = schedule_final_layout\n\n    for name in (\n        'refresh_dash', 'refresh_dashboard', 'refresh_actions', 'refresh_requests',\n        'refresh_mivo_requests', 'refresh_mivo', 'refresh_projects',\n        'refresh_offers', 'refresh_tasks', 'refresh_companies',\n        'refresh_people', 'refresh_all',\n    ):\n        old = getattr(M.App, name, None)\n        if not callable(old):\n            continue\n\n        def make(fn):\n            def wrapped(self, *args, **kwargs):\n                result = fn(self, *args, **kwargs)\n                schedule_final_layout(self)\n                return result\n\n            return wrapped\n\n        setattr(M.App, name, make(old))\n\n    old_show = getattr(M.App, 'show_page', None)\n    if callable(old_show):\n        def show_page(self, *args, **kwargs):\n            result = old_show(self, *args, **kwargs)\n            schedule_final_layout(self)\n            return result\n\n        M.App.show_page = show_page\n'''
          if old not in s:
              raise SystemExit('post_baseline refresh wrapper block not found')
          s = s.replace(old, new, 1)

          # ------------------------------------------------------------
          # Offers: canonical multi-selection and one transactional DB delete.
          # ------------------------------------------------------------
          start = s.index('    def delete_offer(self):')
          end = s.index('    M.App.delete_offer = delete_offer', start)
          replacement = '''    def selected_offer_ids(self):\n        tree = getattr(self, 'offer_tree', None)\n        if tree is None:\n            return []\n        result = []\n        try:\n            for iid in tree.selection():\n                text = str(iid)\n                if not text.startswith('o'):\n                    continue\n                try:\n                    offer_id = int(text[1:])\n                except Exception:\n                    continue\n                if offer_id not in result:\n                    result.append(offer_id)\n        except Exception:\n            pass\n        return result\n\n    M.App._selected_offer_ids = selected_offer_ids\n\n    def delete_offer(self):\n        offer_ids = self._selected_offer_ids()\n        if not offer_ids:\n            return M.messagebox.showinfo(\n                'Nabídky',\n                'Vyberte jednu nebo více nabídek.',\n                parent=self,\n            )\n\n        count = len(offer_ids)\n        if count == 1:\n            question = 'Opravdu odstranit vybranou nabídku z databáze CRM?'\n        else:\n            question = f'Opravdu odstranit {count} vybraných nabídek z databáze CRM?'\n        question += '\\n\\nSoubory na disku zůstanou beze změny.'\n        if not M.messagebox.askyesno('Odstranit nabídky', question, parent=self):\n            return\n\n        placeholders = ','.join('?' for _ in offer_ids)\n        params = tuple(offer_ids)\n        try:\n            with M.db() as con:\n                try:\n                    con.execute(\n                        f'UPDATE offer_source_attachments SET offer_id=NULL '\n                        f'WHERE offer_id IN ({placeholders})',\n                        params,\n                    )\n                except Exception:\n                    pass\n                con.execute(\n                    f'DELETE FROM supplier_offers WHERE id IN ({placeholders})',\n                    params,\n                )\n            self.refresh_offers()\n        except Exception as exc:\n            M.messagebox.showerror('Nabídky', str(exc), parent=self)\n\n'''
          s = s[:start] + replacement + s[end:]

          # Explicitly keep Offers in extended selection mode.
          init_old = '''    def init(self, *args, **kwargs):\n        result = old_init(self, *args, **kwargs)\n        try:\n            self.update_idletasks()\n'''
          init_new = '''    def init(self, *args, **kwargs):\n        result = old_init(self, *args, **kwargs)\n        try:\n            tree = getattr(self, 'offer_tree', None)\n            if tree is not None:\n                tree.configure(selectmode='extended')\n        except Exception:\n            pass\n        try:\n            self.update_idletasks()\n'''
          if init_old not in s:
              raise SystemExit('post_baseline init block not found')
          s = s.replace(init_old, init_new, 1)
          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # v632: opportunity offer-count column is obsolete (v637 owns real
          # Action/project offer counts). Keep Request counts only, and show the
          # related-offers context menu only on an actual data cell.
          # ------------------------------------------------------------
          p = Path('ZakazkyApp_base_6.1/v632_offerlinks.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    def _refresh_counts(app):')
          end = s.index('    def _selected_id_from_iid', start)
          refresh = '''    def _refresh_counts(app):\n        # Opportunity offer-count columns were superseded by the real\n        # Action/project model in v637. Keep only the Request-side count here.\n        try:\n            rt = getattr(app, 'request_tree', None)\n            if rt is not None:\n                _add_offer_column(rt)\n                with M.db() as c:\n                    rows = c.execute(\n                        'SELECT request_id,count(*) n FROM supplier_offers '\n                        'WHERE request_id IS NOT NULL GROUP BY request_id'\n                    ).fetchall()\n                counts = {int(r['request_id']): int(r['n']) for r in rows}\n                for iid in rt.get_children():\n                    rid = _selected_id_from_iid(iid, 'r')\n                    rt.set(iid, 'Nabídky', str(counts.get(rid, 0)) if rid else '')\n        except Exception:\n            pass\n\n'''
          s = s[:start] + refresh + s[end:]

          old_popup = '''        def popup(e):\n            try:\n                row=tree.identify_row(e.y)\n                if row:\n                    tree.selection_set(row);tree.focus(row)\n                menu.delete(0,'end')\n'''
          new_popup = '''        def popup(e):\n            try:\n                # Never show the related-offers row menu on headings, separators\n                # or empty table space. Other header bindings remain untouched.\n                if tree.identify_region(e.x, e.y) != 'cell':\n                    return\n                row = tree.identify_row(e.y)\n                if not row:\n                    return\n                tree.selection_set(row);tree.focus(row)\n                menu.delete(0,'end')\n'''
          if old_popup not in s:
              raise SystemExit('v632 popup block not found')
          s = s.replace(old_popup, new_popup, 1)
          p.write_text(s, encoding='utf-8')

          Path('release_version.txt').write_text('6.3.11\\n', encoding='utf-8')
          Path('release_notes.txt').write_text('''• Opraveno rozhození šířek tabulek po změně stavu. Finální Treeview layout se nyní přepočítá až po dokončení všech starších `after_idle` refresh callbacků, takže není nutné přepínat na jinou záložku a zpět. Oprava je společná pro Příležitosti, Poptávky a ostatní hlavní tabulky.\n• Odstraněna zbytečná mezifáze, kdy v632 po každém refreshi znovu přidával sloupec Nabídky do Příležitostí a v637 jej následně odebíral. Související nabídky Příležitosti zůstávají dostupné z datového řádku; počty nabídek hlavní Akce/projektu nadále vlastní v637.\n• Pravé tlačítko na záhlaví Příležitostí nebo Poptávek již neotevře menu „Související nabídky (0)“. Toto menu se zobrazí pouze po kliknutí na skutečný datový řádek.\n• V seznamu Nabídek je explicitně povolen vícenásobný výběr. Pomocí Ctrl/Shift lze označit více nabídek a tlačítkem Smazat je odstranit z databáze jednou transakcí.\n• Hromadné mazání nabídek zachovává dosavadní bezpečné chování: odpojí databázové vazby příloh a odstraní pouze záznamy CRM; fyzické soubory a archiv na disku zůstávají beze změny.\n• Databázové schéma, parsery nabídek, Excel exporty ani Outlook drag & drop se touto verzí nemění.\n''', encoding='utf-8')
          PY

          python -m compileall -q ZakazkyApp_base_6.1 post_baseline.py
          python - <<'PY'
          from pathlib import Path
          b = Path('post_baseline.py').read_text(encoding='utf-8')
          v = Path('ZakazkyApp_base_6.1/v632_offerlinks.py').read_text(encoding='utf-8')
          assert 'def schedule_final_layout' in b
          assert "app.after_idle(finish)" in b
          assert 'def selected_offer_ids' in b
          assert "selectmode='extended'" in b
          assert "DELETE FROM supplier_offers WHERE id IN" in b
          counts = v.split('def _refresh_counts', 1)[1].split('def _selected_id_from_iid', 1)[0]
          assert 'action_tree' not in counts
          assert 'request_tree' in counts
          popup = v.split('def popup(e):', 1)[1].split("tree.bind('<Button-3>'", 1)[0]
          assert "identify_region(e.x, e.y) != 'cell'" in popup
          PY

          git config user.name "TURTO Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add post_baseline.py ZakazkyApp_base_6.1/v632_offerlinks.py release_version.txt release_notes.txt
          git commit -m "TURTO CRM 6.3.11 — stable refresh and offer multi-delete"
          git push origin HEAD:fix/table-refresh-multidelete-6311

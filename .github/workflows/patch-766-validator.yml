name: Patch 7.6.6 validator
on:
  push:
    branches: [hotfix/7.6.6-gerotop-word-anchors-no-images]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Patch 7.6 validator for 7.6.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-7600-table-activity-performance.py')
          s=p.read_text(encoding='utf-8')
          old='assert version in {"7.6.1", "7.6.2", "7.6.3", "7.6.4", "7.6.5"}, version'
          new='assert version in {"7.6.1", "7.6.2", "7.6.3", "7.6.4", "7.6.5", "7.6.6"}, version'
          assert old in s, 'version assertion not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate-7600-table-activity-performance.py
          git commit -m "Allow TURTO CRM 7.6.6 in 7.6 validation"
          git push

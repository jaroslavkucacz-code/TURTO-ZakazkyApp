name: Validate TURTO CRM received-offer catalogue separation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ZakazkyApp_base_6.1/price_lists_domain/platform/product_catalog.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/product_workspace.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/commercial_workspace.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/service.py
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/editor.py
      - scripts/validate-6334-product-catalog.py
      - scripts/validate-6335-product-workspace.py
      - scripts/validate-6336-commercial-workspace.py
      - scripts/validate-6341-offer-catalog-separation.py
      - .github/workflows/validate-6341-offer-catalog-separation.yml

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile canonical source
        run: python -m compileall -q ZakazkyApp_base_6.1
      - name: Validate existing catalogue contracts
        run: |
          python scripts/validate-6334-product-catalog.py ZakazkyApp_base_6.1
          python scripts/validate-6335-product-workspace.py ZakazkyApp_base_6.1
          python scripts/validate-6336-commercial-workspace.py ZakazkyApp_base_6.1
      - name: Validate received-offer separation and transfer
        run: python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

name: Validate TURTO CRM manual products and pricing
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ZakazkyApp_base_6.1/crm_price_lists.py
      - ZakazkyApp_base_6.1/price_lists_domain/platform/customer_pricing.py
      - scripts/validate-6340-manual-products-pricing.py
      - .github/workflows/validate-6340-manual-pricing.yml

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Compile source
        run: python -m compileall -q ZakazkyApp_base_6.1
      - name: Validate manual products and pricing hierarchy
        run: python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1

name: Validate TURTO CRM 8.0.4 visual contract

on:
  pull_request:
    paths:
      - 'ZakazkyApp_base_6.1/app.py'
      - 'ZakazkyApp_base_6.1/runtime_bootstrap.py'
      - 'ZakazkyApp_base_6.1/v623_exports.py'
      - 'ZakazkyApp_base_6.1/v628_modernui_resize.py'
      - 'ZakazkyApp_base_6.1/v638_table_updatefix.py'
      - 'ZakazkyApp_base_6.1/crm_runtime.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/ui_polish_801.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/branding_polish_802.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/runtime_optimization_803.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/worksets.py'
      - 'scripts/validate-804-visual-contract.py'
      - '.github/workflows/validate-804-visual-contract.yml'
  push:
    branches: [main]
    paths:
      - 'ZakazkyApp_base_6.1/app.py'
      - 'ZakazkyApp_base_6.1/runtime_bootstrap.py'
      - 'ZakazkyApp_base_6.1/v623_exports.py'
      - 'ZakazkyApp_base_6.1/v628_modernui_resize.py'
      - 'ZakazkyApp_base_6.1/v638_table_updatefix.py'
      - 'ZakazkyApp_base_6.1/crm_runtime.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/ui_cleanup_793.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/startup_optimization.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/ui_polish_801.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/branding_polish_802.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/runtime_optimization_803.py'
      - 'ZakazkyApp_base_6.1/price_lists_domain/platform/worksets.py'
      - 'scripts/validate-804-visual-contract.py'
      - '.github/workflows/validate-804-visual-contract.yml'

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Verify formatting survives theme switches and refreshes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:TURTO_DISABLE_AUTO_UPDATE = '1'
          $env:TURTO_CRM_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'turto-804-visual-data'
          $env:TURTO_CRM_VISUAL_RESULT = Join-Path $env:RUNNER_TEMP 'turto-804-visual-contract.json'
          python scripts/validate-804-visual-contract.py
          $result = Get-Content $env:TURTO_CRM_VISUAL_RESULT -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Visual formatting contract failed' }
          Get-Content $env:TURTO_CRM_VISUAL_RESULT
      - name: Upload visual contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TURTO-CRM-804-visual-contract
          path: ${{ runner.temp }}\turto-804-visual-contract.json
          if-no-files-found: warn
          retention-days: 14

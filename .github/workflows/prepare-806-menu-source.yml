name: Prepare hash-verified 8.0.6 menu source
on:
  push:
    branches: [cleanup-806-menu-lifecycle]
    paths: [.github/workflows/prepare-806-menu-source.yml]
permissions:
  contents: write
jobs:
  source-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cleanup-806-menu-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source edits, no application execution or release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib
          base = Path('ZakazkyApp_base_6.1')
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def once(text, old, new):
              assert text.count(old) == 1, repr(old)
              return text.replace(old, new)
          cases = (
              ('v740_offer_defaults.py', '924bdb7120bd506a873c490163580eb22348c773', '770939dccc63ce198de4d5a610b93490181cb3ed'),
              ('v750_context_filters_offer_format.py', '7675fb238d64328dcb20bc4630bc792a25b70f6e', '8f2877b91fb4547e3bf7042c921a93eec5004f19'),
          )
          for name, old_sha, new_sha in cases:
              path = base / name
              raw = path.read_bytes()
              assert digest(raw) == old_sha, (name, 'Unexpected source checkpoint')
              text = raw.decode('utf-8')
              anchor = '        from price_lists_domain.issued_offers import service\n'
              text = once(text, anchor, anchor + '        from price_lists_domain.platform.context_menu_lifecycle import (\n            reuse_context_menus, replace_context_menus,\n        )\n')
              if name.startswith('v740'):
                  anchor = '        header_menu = M.tk.Menu(tree, tearoff=False)\n        header_menu.add_command(\n'
                  guard = '        if reuse_context_menus(tree, "v740:offers", (\n            getattr(tree, "_v740_header_menu", None),\n            getattr(tree, "_v740_row_menu", None),\n        )):\n            return\n\n'
                  text = once(text, anchor, guard + anchor)
                  text = once(text, '        tree.bind("<Button-3>", popup, add=False)\n', '        replace_context_menus(tree, "v740:offers", (header_menu, row_menu), popup)\n')
              else:
                  anchor = '    def install_workspace_context(app: Any, key: str, tree: Any) -> None:\n        if not _widget_exists(tree):\n            return\n'
                  guard = '        if reuse_context_menus(tree, f"v750:{key}", (\n            getattr(tree, "_v750_header_menu", None),\n            getattr(tree, "_v750_row_menu", None),\n        )):\n            return\n'
                  text = once(text, anchor, anchor + guard)
                  anchor = '        tree.bind("<Button-3>", popup, add=False)\n        tree._v750_header_menu = header_menu\n        tree._v750_row_menu = row_menu\n        tree._v750_context_owner = key'
                  replacement = '        replace_context_menus(tree, f"v750:{key}", (header_menu, row_menu), popup)\n        tree._v750_header_menu = header_menu\n        tree._v750_row_menu = row_menu\n        tree._v750_context_owner = key'
                  text = once(text, anchor, replacement)
              ast.parse(text)
              data = text.encode('utf-8')
              assert digest(data) == new_sha, (name, 'Result differs from locally tested source')
              path.write_bytes(data)
              print(name, new_sha)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ZakazkyApp_base_6.1/v740_offer_defaults.py ZakazkyApp_base_6.1/v750_context_filters_offer_format.py
          git commit -m 'refactor: reuse existing menus and release obsolete popup commands'
          git push origin HEAD:refs/heads/cleanup-806-menu-lifecycle
          git rev-parse HEAD

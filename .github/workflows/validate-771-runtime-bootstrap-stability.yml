name: Validate 7.7.1 runtime bootstrap stability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/v644_default_date_sort.py
      - scripts/validate-771-runtime-bootstrap-stability.py
      - .github/workflows/validate-771-runtime-bootstrap-stability.yml
  push:
    branches: [main]
    paths:
      - ZakazkyApp_base_6.1/runtime_bootstrap.py
      - ZakazkyApp_base_6.1/v644_default_date_sort.py
      - scripts/validate-771-runtime-bootstrap-stability.py
      - .github/workflows/validate-771-runtime-bootstrap-stability.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate runtime bootstrap ordering
        run: python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1

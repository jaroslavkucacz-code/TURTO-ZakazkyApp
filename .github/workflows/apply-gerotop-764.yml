name: Apply GEROtop 7.6.4 fix
on:
  push:
    branches: [fix/7.6.4-gerotop-geometry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply parser and release changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          parser = Path('ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py')
          text = parser.read_text(encoding='utf-8')

          old = """LEGACY_CODE_RE = re.compile(r'^\\d{3}-\\d{3}-\\d{3}$')\nMODERN_CODE_RE = re.compile(\n    r'^\\d{3}-\\d{3,4}-[A-Z0-9]{3}(?:-[A-Z0-9]{2,8})?$'\n)\n"""
          new = """LEGACY_CODE_RE = re.compile(r'^\\d{3}-\\d{3}-\\d{3}$')\n# Current GEROtop sheets mix classic and extended product codes in one table.\n# The optional last component may contain a decimal comma (for example 044,5).\nPRODUCT_CODE_RE = re.compile(\n    r'^\\d{3}-\\d{3,4}-[A-Z0-9]{3}(?:-[A-Z0-9.,]{2,12})?$',\n    re.I,\n)\n# Compatibility name retained for older tests/extensions.\nMODERN_CODE_RE = PRODUCT_CODE_RE\n"""
          assert old in text, 'product-code regex block not found'
          text = text.replace(old, new, 1)

          old = """def _modern_anchors(page):\n    rows = []\n    for block in page.get_text('blocks'):\n        text = clean_text(block[4])\n        if (\n            MODERN_CODE_RE.fullmatch(text)\n            and not LEGACY_CODE_RE.fullmatch(text)\n        ):\n            rows.append((text, (block[1] + block[3]) / 2))\n    rows.sort(key=lambda item: item[1])\n    return rows\n"""
          new = """def _row_anchors(page):\n    \"\"\"Return every real product row in visual top-to-bottom order.\"\"\"\n    rows = []\n    for block in page.get_text('blocks'):\n        code = clean_text(block[4])\n        if PRODUCT_CODE_RE.fullmatch(code):\n            rows.append((code, (block[1] + block[3]) / 2))\n    rows.sort(key=lambda item: item[1])\n    return rows\n\n\ndef _modern_anchors(page):\n    # Compatibility helper: modern-layout parsing now includes classic codes.\n    return _row_anchors(page)\n"""
          assert old in text, 'anchor function not found'
          text = text.replace(old, new, 1)

          old = """def _is_modern_pdf(pdf_path):\n    try:\n        with fitz.open(pdf_path) as doc:\n            text = '\\n'.join(\n                page.get_text('text')\n                for page in doc[:2]\n            ).upper()\n            return (\n                'GEROTOP' in text\n                and 'NABÍDK' in text\n                and any(_modern_anchors(page) for page in doc[:2])\n            )\n    except Exception:\n        return False\n"""
          new = """def _is_modern_pdf(pdf_path):\n    # Detect the geometry-driven layout by its table/header, not by code length.\n    try:\n        with fitz.open(pdf_path) as doc:\n            text = '\\n'.join(page.get_text('text') for page in doc[:2]).upper()\n            return (\n                'GEROTOP' in text\n                and 'NABÍDK' in text\n                and 'ČÍSLO NÁVRHU' in text\n                and 'PRACOVNÍ NÁZEV AKCE' in text\n                and 'JEDNOTKOVÁ' in text\n                and 'CENA PO SLEVĚ' in text\n                and any(_row_anchors(page) for page in doc[:2])\n            )\n    except Exception:\n        return False\n"""
          assert old in text, 'modern detector not found'
          text = text.replace(old, new, 1)

          start = text.index('def _extract_row_image(doc, page, top, bottom):')
          end = text.index('\n\ndef _parse_modern(pdf_path):', start)
          image_fn = '''def _extract_row_image(doc, page, top, bottom):\n    \"\"\"Render the dominant product image exactly as displayed in the PDF.\n\n    Rendering the visual rectangle avoids fragile manual SMask reconstruction\n    and works for the mixed image variants in current GEROtop documents.\n    \"\"\"\n    candidates = []\n    for image in page.get_images(full=True):\n        try:\n            rects = page.get_image_rects(image[0])\n        except Exception:\n            continue\n        for rect in rects:\n            center_y = (rect.y0 + rect.y1) / 2\n            if not (top <= center_y < bottom):\n                continue\n            if rect.width < 18 or rect.height < 18:\n                continue\n            if rect.x0 < page.rect.width * 0.42 or rect.x1 > page.rect.width * 0.72:\n                continue\n            candidates.append((rect.width * rect.height, rect))\n    if not candidates:\n        return None, None\n    _area, rect = max(candidates, key=lambda item: item[0])\n    try:\n        pixmap = page.get_pixmap(matrix=fitz.Matrix(2, 2), clip=rect, alpha=False)\n        return pixmap.tobytes('png'), 'png'\n    except Exception:\n        return None, None\n'''
          text = text[:start] + image_fn + text[end:]
          text = text.replace('anchors = _modern_anchors(page)', 'anchors = _row_anchors(page)')
          text = text.replace("'item_key': title,", "'item_key': f'{position}:{code}:{title}',", 1)

          old = '# Keep one proven Excel implementation for both generations.\nexport_excel = legacy.export_excel\n'
          new = '''# Keep the proven workbook layout, but use ordinary inserted pictures instead\n# of Excel's newer Place-in-Cell image formula. This prevents #VALUE! in\n# clients/viewers that do not support that feature yet.\ndef export_excel(data, output_path, price_alerts=None):\n    try:\n        from xlsxwriter.worksheet import Worksheet\n        from PIL import Image\n        import io\n    except Exception:\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n\n    original_embed = getattr(Worksheet, 'embed_image', None)\n    if not callable(original_embed):\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n\n    def compatible_embed(sheet, row, col, filename, options=None):\n        opts = dict(options or {})\n        image_data = opts.get('image_data')\n        scale = 1.0\n        if image_data is not None:\n            try:\n                image_data.seek(0)\n                with Image.open(image_data) as image:\n                    width, height = image.size\n                image_data.seek(0)\n                if width and height:\n                    scale = min(220.0 / width, 120.0 / height, 1.0)\n            except Exception:\n                scale = 1.0\n        opts.update({\n            'object_position': 1,\n            'x_scale': scale,\n            'y_scale': scale,\n            'x_offset': 4,\n            'y_offset': 4,\n        })\n        return sheet.insert_image(row, col, filename, opts)\n\n    Worksheet.embed_image = compatible_embed\n    try:\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n    finally:\n        Worksheet.embed_image = original_embed\n'''
          assert old in text, 'export alias not found'
          text = text.replace(old, new, 1)
          parser.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate-7600-table-activity-performance.py')
          vtext = validator.read_text(encoding='utf-8')
          vtext, count = re.subn(
              r'assert version in \\{([^}]*)\\}, version',
              lambda m: 'assert version in {' + m.group(1).rstrip() + ', "7.6.4"}, version' if '7.6.4' not in m.group(1) else m.group(0),
              vtext,
              count=1,
          )
          assert count == 1, '7.6 validator version assertion not found'
          validator.write_text(vtext, encoding='utf-8')

          new_validator = Path('scripts/validate-764-gerotop-geometry.py')
          new_validator.write_text(r'''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport pathlib, sys\nfrom types import SimpleNamespace\n\ndef main():\n    source = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else "ZakazkyApp_base_6.1").resolve()\n    sys.path.insert(0, str(source / "offers_engine"))\n    import Gerotop_Parser as parser\n\n    for code in ("202-100-300", "286-250-000", "411-0400-030-355", "411-0100-030-044,5"):\n        assert parser.PRODUCT_CODE_RE.fullmatch(code), code\n    for bad in ("P12196-2026", "03.09.2026", "Standardní doprava"):\n        assert not parser.PRODUCT_CODE_RE.fullmatch(bad), bad\n\n    class Page:\n        def get_text(self, kind):\n            assert kind == "blocks"\n            return [\n                (0, 80, 10, 90, "202-100-300", 0, 0),\n                (0, 120, 10, 130, "411-0100-030-044,5", 0, 0),\n                (0, 170, 10, 180, "202-100-300", 0, 0),\n            ]\n    anchors = parser._row_anchors(Page())\n    assert [a[0] for a in anchors] == ["202-100-300", "411-0100-030-044,5", "202-100-300"]\n\n    text = (source / "offers_engine" / "Gerotop_Parser.py").read_text(encoding="utf-8")\n    assert "page.get_pixmap" in text\n    assert "Worksheet.embed_image = compatible_embed" in text\n    assert "sheet.insert_image" in text\n    assert "and not LEGACY_CODE_RE.fullmatch" not in text\n    assert "anchors = _row_anchors(page)" in text\n    print("TURTO CRM 7.6.4 GEROtop mixed-code geometry validation passed")\n\nif __name__ == "__main__":\n    main()\n'''.replace('\\n', '\n'), encoding='utf-8')

          publish = Path('scripts/publish-update.sh')
          ptext = publish.read_text(encoding='utf-8')
          needle = 'python scripts/validate-7600-table-activity-performance.py "$BASE_DIR"\n'
          if 'validate-764-gerotop-geometry.py' not in ptext:
              assert needle in ptext
              ptext = ptext.replace(needle, needle + 'python scripts/validate-764-gerotop-geometry.py "$BASE_DIR"\n', 1)
          publish.write_text(ptext, encoding='utf-8')

          workflow = Path('.github/workflows/publish-update.yml')
          wtext = workflow.read_text(encoding='utf-8')
          if 'scripts/validate-764-gerotop-geometry.py' not in wtext:
              path_needle = '      - scripts/validate-762-startup-stability.py\n'
              assert path_needle in wtext
              wtext = wtext.replace(path_needle, path_needle + '      - scripts/validate-764-gerotop-geometry.py\n', 1)
              step_needle = '      - name: Validate 7.6.2 native Tk startup stability\n        shell: bash\n        run: python scripts/validate-762-startup-stability.py ZakazkyApp_base_6.1\n'
              assert step_needle in wtext
              wtext = wtext.replace(step_needle, step_needle + '\n      - name: Validate 7.6.4 GEROtop mixed-code geometry\n        shell: bash\n        run: python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1\n', 1)
          if 'ZakazkyApp_base_6.1/offers_engine/**' not in wtext:
              marker = '      - ZakazkyApp_base_6.1/v760_table_activity_performance.py\n'
              assert marker in wtext
              wtext = wtext.replace(marker, marker + '      - ZakazkyApp_base_6.1/offers_engine/**\n', 1)
          workflow.write_text(wtext, encoding='utf-8')

          Path('release_version.txt').write_text('7.6.4\n', encoding='utf-8')
          Path('release_notes.txt').write_text(\n              '• Opravena extrakce současných nabídek GEROtop, které v jedné tabulce kombinují běžné kódy 202-100-300 s delšími kódy 411-0400-030-355.\\n'\n              '• Parser již nevynechává klasické třídílné kódy ani kódy s desetinnou čárkou, například 411-0100-030-044,5; opakovaný kód zůstává samostatnou položkou.\\n'\n              '• Řádky se dál čtou geometricky z PDF, takže množství, původní cena, sleva, cena po slevě a řádkový součet zůstávají navázané na správný výrobek.\\n'\n              '• Obrázky produktů se nově renderují z jejich skutečné oblasti v PDF, což odstraňuje problémy s některými průhlednostními maskami.\\n'\n              '• Excel export používá kompatibilní vložené obrázky místo funkce Place in Cell, aby se v nepodporovaných klientech nezobrazovalo #VALUE!.\\n'\n              '• Změna se týká pouze GEROtop parseru/exportu a nemění databázové schéma ani historická data.\\n',\n              encoding='utf-8'\n          )
          PY
      - name: Install parser dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Validate GEROtop parser change
        shell: bash
        run: |
          python -m py_compile ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py
          python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1
          python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1
      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py scripts/validate-764-gerotop-geometry.py scripts/validate-7600-table-activity-performance.py scripts/publish-update.sh .github/workflows/publish-update.yml release_version.txt release_notes.txt
          git commit -m "TURTO CRM 7.6.4: fix mixed GEROtop rows and images"
          git push origin HEAD:fix/7.6.4-gerotop-geometry

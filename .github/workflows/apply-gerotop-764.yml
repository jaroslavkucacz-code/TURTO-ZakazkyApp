name: Apply GEROtop 7.6.4 fix
on:
  push:
    branches: [fix/7.6.4-gerotop-geometry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "LEGACY_CODE_RE = re.compile(r'^\\d{3}-\\d{3}-\\d{3}$')\nMODERN_CODE_RE = re.compile(\n    r'^\\d{3}-\\d{3,4}-[A-Z0-9]{3}(?:-[A-Z0-9]{2,8})?$'\n)\n",
              "LEGACY_CODE_RE = re.compile(r'^\\d{3}-\\d{3}-\\d{3}$')\nPRODUCT_CODE_RE = re.compile(\n    r'^\\d{3}-\\d{3,4}-[A-Z0-9]{3}(?:-[A-Z0-9.,]{2,12})?$',\n    re.I,\n)\nMODERN_CODE_RE = PRODUCT_CODE_RE\n",
              1,
          )
          old_anchor = '''def _modern_anchors(page):\n    rows = []\n    for block in page.get_text('blocks'):\n        text = clean_text(block[4])\n        if (\n            MODERN_CODE_RE.fullmatch(text)\n            and not LEGACY_CODE_RE.fullmatch(text)\n        ):\n            rows.append((text, (block[1] + block[3]) / 2))\n    rows.sort(key=lambda item: item[1])\n    return rows\n'''
          new_anchor = '''def _row_anchors(page):\n    rows = []\n    for block in page.get_text('blocks'):\n        code = clean_text(block[4])\n        if PRODUCT_CODE_RE.fullmatch(code):\n            rows.append((code, (block[1] + block[3]) / 2))\n    rows.sort(key=lambda item: item[1])\n    return rows\n\n\ndef _modern_anchors(page):\n    return _row_anchors(page)\n'''
          assert old_anchor in s
          s = s.replace(old_anchor, new_anchor, 1)

          old_detect = '''def _is_modern_pdf(pdf_path):\n    try:\n        with fitz.open(pdf_path) as doc:\n            text = '\\n'.join(\n                page.get_text('text')\n                for page in doc[:2]\n            ).upper()\n            return (\n                'GEROTOP' in text\n                and 'NABÍDK' in text\n                and any(_modern_anchors(page) for page in doc[:2])\n            )\n    except Exception:\n        return False\n'''
          new_detect = '''def _is_modern_pdf(pdf_path):\n    try:\n        with fitz.open(pdf_path) as doc:\n            text = '\\n'.join(page.get_text('text') for page in doc[:2]).upper()\n            return (\n                'GEROTOP' in text\n                and 'NABÍDK' in text\n                and 'ČÍSLO NÁVRHU' in text\n                and 'PRACOVNÍ NÁZEV AKCE' in text\n                and 'JEDNOTKOVÁ' in text\n                and 'CENA PO SLEVĚ' in text\n                and any(_row_anchors(page) for page in doc[:2])\n            )\n    except Exception:\n        return False\n'''
          assert old_detect in s
          s = s.replace(old_detect, new_detect, 1)

          a = s.index('def _extract_row_image(doc, page, top, bottom):')
          b = s.index('\n\ndef _parse_modern(pdf_path):', a)
          new_image = '''def _extract_row_image(doc, page, top, bottom):\n    candidates = []\n    for image in page.get_images(full=True):\n        try:\n            rects = page.get_image_rects(image[0])\n        except Exception:\n            continue\n        for rect in rects:\n            center_y = (rect.y0 + rect.y1) / 2\n            if not (top <= center_y < bottom):\n                continue\n            if rect.width < 18 or rect.height < 18:\n                continue\n            if rect.x0 < page.rect.width * 0.42 or rect.x1 > page.rect.width * 0.72:\n                continue\n            candidates.append((rect.width * rect.height, rect))\n    if not candidates:\n        return None, None\n    _area, rect = max(candidates, key=lambda item: item[0])\n    try:\n        pixmap = page.get_pixmap(matrix=fitz.Matrix(2, 2), clip=rect, alpha=False)\n        return pixmap.tobytes('png'), 'png'\n    except Exception:\n        return None, None\n'''
          s = s[:a] + new_image + s[b:]
          s = s.replace('anchors = _modern_anchors(page)', 'anchors = _row_anchors(page)')
          s = s.replace("'item_key': title,", "'item_key': f'{position}:{code}:{title}',", 1)

          old_export = '# Keep one proven Excel implementation for both generations.\nexport_excel = legacy.export_excel\n'
          new_export = '''# Keep the proven workbook layout but avoid Excel Place-in-Cell images,\n# which can appear as #VALUE! in clients that do not support the feature.\ndef export_excel(data, output_path, price_alerts=None):\n    try:\n        from xlsxwriter.worksheet import Worksheet\n        from PIL import Image\n    except Exception:\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n    original_embed = getattr(Worksheet, 'embed_image', None)\n    if not callable(original_embed):\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n    def compatible_embed(sheet, row, col, filename, options=None):\n        opts = dict(options or {})\n        image_data = opts.get('image_data')\n        scale = 1.0\n        if image_data is not None:\n            try:\n                image_data.seek(0)\n                with Image.open(image_data) as image:\n                    width, height = image.size\n                image_data.seek(0)\n                if width and height:\n                    scale = min(220.0 / width, 120.0 / height, 1.0)\n            except Exception:\n                pass\n        opts.update({'object_position': 1, 'x_scale': scale, 'y_scale': scale, 'x_offset': 4, 'y_offset': 4})\n        return sheet.insert_image(row, col, filename, opts)\n    Worksheet.embed_image = compatible_embed\n    try:\n        return legacy.export_excel(data, output_path, price_alerts=price_alerts)\n    finally:\n        Worksheet.embed_image = original_embed\n'''
          assert old_export in s
          s = s.replace(old_export, new_export, 1)
          assert 'PRODUCT_CODE_RE' in s and 'anchors = _row_anchors(page)' in s
          p.write_text(s, encoding='utf-8')

          v = Path('scripts/validate-7600-table-activity-performance.py')
          t = v.read_text(encoding='utf-8')
          t, n = re.subn(
              r'assert version in \{([^}]*)\}, version',
              lambda m: 'assert version in {' + m.group(1) + ', "7.6.4"}, version' if '7.6.4' not in m.group(1) else m.group(0),
              t, count=1,
          )
          assert n == 1
          v.write_text(t, encoding='utf-8')

          Path('scripts/validate-764-gerotop-geometry.py').write_text('''#!/usr/bin/env python3\nimport pathlib, sys\n\ndef main():\n    source = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else "ZakazkyApp_base_6.1").resolve()\n    sys.path.insert(0, str(source / "offers_engine"))\n    import Gerotop_Parser as parser\n    for code in ("202-100-300", "286-250-000", "411-0400-030-355", "411-0100-030-044,5"):\n        assert parser.PRODUCT_CODE_RE.fullmatch(code), code\n    class Page:\n        def get_text(self, kind):\n            return [(0,80,10,90,"202-100-300",0,0),(0,120,10,130,"411-0100-030-044,5",0,0),(0,170,10,180,"202-100-300",0,0)]\n    assert [x[0] for x in parser._row_anchors(Page())] == ["202-100-300", "411-0100-030-044,5", "202-100-300"]\n    text = (source / "offers_engine" / "Gerotop_Parser.py").read_text(encoding="utf-8")\n    assert "page.get_pixmap" in text\n    assert "sheet.insert_image" in text\n    assert "and not LEGACY_CODE_RE.fullmatch" not in text\n    print("TURTO CRM 7.6.4 GEROtop geometry validation passed")\n\nif __name__ == "__main__": main()\n''', encoding='utf-8')

          pub = Path('scripts/publish-update.sh')
          t = pub.read_text(encoding='utf-8')
          needle = 'python scripts/validate-7600-table-activity-performance.py "$BASE_DIR"\n'
          if 'validate-764-gerotop-geometry.py' not in t:
              assert needle in t
              t = t.replace(needle, needle + 'python scripts/validate-764-gerotop-geometry.py "$BASE_DIR"\n', 1)
          pub.write_text(t, encoding='utf-8')

          wf = Path('.github/workflows/publish-update.yml')
          t = wf.read_text(encoding='utf-8')
          if 'scripts/validate-764-gerotop-geometry.py' not in t:
              t = t.replace('      - scripts/validate-762-startup-stability.py\n', '      - scripts/validate-762-startup-stability.py\n      - scripts/validate-764-gerotop-geometry.py\n', 1)
              marker = '      - name: Validate 7.6.2 native Tk startup stability\n        shell: bash\n        run: python scripts/validate-762-startup-stability.py ZakazkyApp_base_6.1\n'
              assert marker in t
              t = t.replace(marker, marker + '\n      - name: Validate 7.6.4 GEROtop mixed-code geometry\n        shell: bash\n        run: python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1\n', 1)
          if 'ZakazkyApp_base_6.1/offers_engine/**' not in t:
              t = t.replace('      - ZakazkyApp_base_6.1/v760_table_activity_performance.py\n', '      - ZakazkyApp_base_6.1/v760_table_activity_performance.py\n      - ZakazkyApp_base_6.1/offers_engine/**\n', 1)
          wf.write_text(t, encoding='utf-8')
          PY
          printf '7.6.4\n' > release_version.txt
          cat > release_notes.txt <<'EOF'
          • Opravena extrakce současných nabídek GEROtop, které v jedné tabulce kombinují běžné kódy 202-100-300 s delšími kódy 411-0400-030-355.
          • Parser již nevynechává klasické třídílné kódy ani kódy s desetinnou čárkou, například 411-0100-030-044,5; opakovaný kód zůstává samostatnou položkou.
          • Řádky se dál čtou geometricky z PDF, takže množství, ceny, sleva a řádkový součet zůstávají navázané na správný výrobek.
          • Obrázky produktů se renderují z jejich skutečné oblasti v PDF a Excel export používá kompatibilní vložené obrázky místo Place in Cell.
          • Změna se týká pouze GEROtop parseru/exportu a nemění databázové schéma ani historická data.
          EOF
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Validate
        shell: bash
        run: |
          python -m py_compile ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py
          python scripts/validate-764-gerotop-geometry.py ZakazkyApp_base_6.1
          python scripts/validate-7600-table-activity-performance.py ZakazkyApp_base_6.1
      - name: Commit
        shell: bash
        run: |
          git config user.name "TURTO Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ZakazkyApp_base_6.1/offers_engine/Gerotop_Parser.py scripts/validate-764-gerotop-geometry.py scripts/validate-7600-table-activity-performance.py scripts/publish-update.sh .github/workflows/publish-update.yml release_version.txt release_notes.txt
          git commit -m "TURTO CRM 7.6.4: fix mixed GEROtop rows and images"
          git push origin HEAD:fix/7.6.4-gerotop-geometry

name: TURTO CRM 8.0 post-baseline warning cleanup
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths:
      - '.github/workflows/cleanup-800-fix-post-baseline-escape.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - name: Remove invalid escape warning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('post_baseline.py')
          text = path.read_text(encoding='utf-8')
          old = r'DATA_ROOT\Dokumenty/Documents'
          new = r'DATA_ROOT\\Dokumenty/Documents'
          if old not in text:
              raise SystemExit('Expected post_baseline path text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile post_baseline.py
      - name: Commit cleanup and remove transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/cleanup-800-fix-post-baseline-escape.yml
          git add post_baseline.py .github/workflows/cleanup-800-fix-post-baseline-escape.yml
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: remove post-baseline escape warning'
          git push origin HEAD:refactor/8.0.0-big-cleanup

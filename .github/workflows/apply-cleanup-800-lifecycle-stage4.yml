name: Apply TURTO CRM 8.0 App lifecycle consolidation stage 4
on:
  push:
    branches: [refactor/8.0.0-big-cleanup]
    paths: ['.github/workflows/apply-cleanup-800-lifecycle-stage4.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/8.0.0-big-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt
      - name: Migrate next App init wrappers to lifecycle hooks
        shell: python
        run: |
          from pathlib import Path
          root = Path('ZakazkyApp_base_6.1')

          def replace(path, old, new):
              p = root / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace('v632_offerlinks.py', '''    old_init=M.App.__init__
              def init(self,*a,**k):
                  r=old_init(self,*a,**k)
                  def later():
                      _refresh_counts(self)
                      _install_context(self,getattr(self,'action_tree',None),'action')
                      _install_context(self,getattr(self,'request_tree',None),'request')
                  try:self.after(1800,later)
                  except Exception:pass
                  return r
              M.App.__init__=init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  def later():
                      _refresh_counts(self)
                      _install_context(self,getattr(self,'action_tree',None),'action')
                      _install_context(self,getattr(self,'request_tree',None),'request')
                  try:self.after(1800,later)
                  except Exception:pass
              M.register_app_init_hook("v632.offer_links", after=after_app_init)''')

          replace('v636_action_offers_stabletable.py', '''    old_app_init=M.App.__init__
              def app_init(self,*a,**k):
                  r=old_app_init(self,*a,**k)
                  try:self.after(3000,lambda:remove_deadline_overlays(self))
                  except Exception:pass
                  return r
              M.App.__init__=app_init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:self.after(3000,lambda:remove_deadline_overlays(self))
                  except Exception:pass
              M.register_app_init_hook("v636.remove_deadline_overlays", after=after_app_init)''')

          replace('v637_project_offer_model.py', '''    old_init=M.App.__init__
              def init(self,*a,**k):
                  r=old_init(self,*a,**k)
                  def later():
                      _remove_offer_col_from_opportunities(self);_add_project_offer_column(self);_style_urgent_requests(self);_install_cleanup_events(self)
                  try:self.after(3200,later)
                  except Exception:pass
                  return r
              M.App.__init__=init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  def later():
                      _remove_offer_col_from_opportunities(self);_add_project_offer_column(self);_style_urgent_requests(self);_install_cleanup_events(self)
                  try:self.after(3200,later)
                  except Exception:pass
              M.register_app_init_hook("v637.project_offer_model", after=after_app_init)''')

          replace('v638_table_updatefix.py', '''    old_init=M.App.__init__
              def init(self,*a,**k):
                  r=old_init(self,*a,**k)
                  for ms in (900,2200,3800):
                      try:self.after(ms,lambda s=self:_stabilize(s,sort_projects=True))
                      except Exception:pass
                  return r
              M.App.__init__=init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  for ms in (900,2200,3800):
                      try:self.after(ms,lambda s=self:_stabilize(s,sort_projects=True))
                      except Exception:pass
              M.register_app_init_hook("v638.table_stabilize", after=after_app_init)''')

          replace('v640_warning_cleanup.py', '''    old_init=M.App.__init__
              def init(self,*a,**k):
                  r=old_init(self,*a,**k)
                  for ms in (1200,2600,4200):
                      try:self.after(ms,lambda s=self:_cleanup(s))
                      except Exception:pass
                  return r
              M.App.__init__=init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  for ms in (1200,2600,4200):
                      try:self.after(ms,lambda s=self:_cleanup(s))
                      except Exception:pass
              M.register_app_init_hook("v640.warning_cleanup", after=after_app_init)''')

          replace('v631_diskdrop.py', '''    old_init = M.App.__init__

              def init(self, *args, **kwargs):
                  result = old_init(self, *args, **kwargs)
                  try:
                      self.after(1700, lambda: _enable_faulthandler(self))
                  except Exception:
                      pass
                  try:
                      self.after(1800, lambda: _install_tk_exception_guard(self))
                  except Exception:
                      pass
                  try:
                      self.after(3000, lambda: _install_unified_target(self))
                  except Exception:
                      pass
                  return result

              M.App.__init__ = init''', '''    def after_app_init(self, _result, _args, _kwargs):
                  try:
                      self.after(1700, lambda: _enable_faulthandler(self))
                  except Exception:
                      pass
                  try:
                      self.after(1800, lambda: _install_tk_exception_guard(self))
                  except Exception:
                      pass
                  try:
                      self.after(3000, lambda: _install_unified_target(self))
                  except Exception:
                      pass

              M.register_app_init_hook("v631.diskdrop_guards", after=after_app_init)''')

          p = Path('scripts/validate-800-app-lifecycle.py')
          s = p.read_text(encoding='utf-8')
          old = '''        "v628_modernui_resize.py",\n    )'''
          new = '''        "v628_modernui_resize.py",\n        "v632_offerlinks.py",\n        "v636_action_offers_stabletable.py",\n        "v637_project_offer_model.py",\n        "v638_table_updatefix.py",\n        "v640_warning_cleanup.py",\n        "v631_diskdrop.py",\n    )'''
          if old not in s:
              raise SystemExit('lifecycle migrated tuple marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate lifecycle and runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q ZakazkyApp_base_6.1 scripts
          python scripts/validate-800-app-lifecycle.py ZakazkyApp_base_6.1
          python scripts/audit-runtime-overrides.py . --check
          python scripts/validate-770-runtime-policy.py ZakazkyApp_base_6.1
          python scripts/validate-771-runtime-bootstrap-stability.py ZakazkyApp_base_6.1
          python scripts/validate-7900-runtime-integration.py ZakazkyApp_base_6.1
          xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
      - name: Commit lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TURTO Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore --worktree .github/workflows
          git add ZakazkyApp_base_6.1 scripts/validate-800-app-lifecycle.py
          git diff --cached --check
          git commit -m 'TURTO CRM 8.0: consolidate mid-stage App initialization lifecycle'
          git push origin HEAD:refactor/8.0.0-big-cleanup

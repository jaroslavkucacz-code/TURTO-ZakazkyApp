name: Validate TURTO CRM 7.2 visual issued offers

on:
  pull_request:
    branches:
      - main
    paths:
      - post_baseline.py
      - ZakazkyApp_base_6.1/v638_table_updatefix.py
      - ZakazkyApp_base_6.1/v710_cleanup.py
      - ZakazkyApp_base_6.1/v720_visual_offer.py
      - ZakazkyApp_base_6.1/v730_polish.py
      - ZakazkyApp_base_6.1/v740_offer_defaults.py
      - ZakazkyApp_base_6.1/ZakazkyCRM.pyw
      - ZakazkyApp_base_6.1/price_lists_domain/issued_offers/**
      - scripts/validate-6337-issued-offers.py
      - scripts/validate-7100-commercial-cleanup.py
      - scripts/validate-7200-visual-issued-offers.py
      - scripts/validate-7300-polish.py
      - scripts/validate-7400-issued-pricing-columns.py
      - scripts/validate-real-ui.py
      - scripts/publish-update.sh
      - release_version.txt
      - release_notes.txt
      - .github/workflows/validate-7200-visual-issued-offers.yml
      - .github/workflows/validate-7400-issued-pricing-columns.yml
      - .github/workflows/publish-update.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ZakazkyApp_base_6.1/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r ZakazkyApp_base_6.1/requirements.txt

      - name: Compile issued-offer source and validation
        run: python -m compileall -q ZakazkyApp_base_6.1 scripts post_baseline.py

      - name: Validate persistent columns and 7.1 compatibility
        run: python scripts/validate-7100-commercial-cleanup.py ZakazkyApp_base_6.1

      - name: Validate visual PDF editor and fixed numbering
        run: python scripts/validate-7200-visual-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate preview resilience and 7.3 compatibility
        run: python scripts/validate-7300-polish.py ZakazkyApp_base_6.1

      - name: Validate pricing defaults and internal product identity
        run: python scripts/validate-7400-issued-pricing-columns.py ZakazkyApp_base_6.1

      - name: Validate issued offers and immutable PDF revisions
        run: python scripts/validate-6337-issued-offers.py ZakazkyApp_base_6.1

      - name: Validate manual product and customer pricing
        run: python scripts/validate-6340-manual-products-pricing.py ZakazkyApp_base_6.1

      - name: Validate received-offer catalogue separation
        run: python scripts/validate-6341-offer-catalog-separation.py ZakazkyApp_base_6.1

      - name: Ensure virtual display
        if: matrix.python-version == '3.14'
        run: command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Validate the real Tk visual editor and column persistence
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          # Hosted Ubuntu with Python 3.14/Tk/Xvfb can fail natively before
          # Python can report an application assertion. Retry only process-level
          # Tcl/Tk aborts (134) or segmentation faults (139); ordinary test
          # failures still stop immediately.
          set +e
          rc=1
          for attempt in 1 2 3; do
            echo "Tk UI validation attempt ${attempt}/3"
            timeout 150s xvfb-run -a python scripts/validate-real-ui.py ZakazkyApp_base_6.1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -ne 134 ] && [ "$rc" -ne 139 ]; then
              exit "$rc"
            fi
            echo "Transient native Tk failure (${rc}); retrying..."
            sleep 2
          done
          exit "$rc"

      - name: Validate release script syntax
        run: bash -n scripts/publish-update.sh
